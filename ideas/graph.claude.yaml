      pass: "exit 0"
    future: >
      改动文件是网页和写回指令之间的唯一接口；将来换一种编辑界面， 只要产出同样格式的改动文件就能接上同一条链路。

  - id: I-065
    name: "一条指令把改动文件写回想法图，注释原样保留"
    status: todo
    needs: [ I-064, I-044 ]
    what: >
      引擎新增一个子命令：读改动文件，把每一处修改写进 ideas/graph.claude.yaml —— 文字改动定点写入，状态改动走既有的「set
      + 自动留记录」逻辑， 新建删除想法和边按格式规则执行；写完自动校验并重新渲染网页，改动记进记录文件。
    why: >
      写回如果靠 agent 手工编辑 YAML，注释会被抹掉、状态可能绕过 set、格式可能写坏 ——
      这些正是这套工具当初要防住的事。写回必须是一条确定性的指令，不是一次自由发挥。
    expected: >
      对一个带注释的图应用改动文件之后：每处改动都生效，注释和没动过的部分逐字保留， 校验通过，记录文件里多了对应条目，网页已重新渲染；
      同一个改动文件应用第二次不会再产生任何变化。
    how: >
      引擎新增 apply 子命令，核心是一个可单独测试的纯函数：读改动文件 → 在内存里 应用全部改动并跑完整
      check，任何一步失败整体放弃、磁盘不动 → 才原子写盘、 重新渲染、记录日志。要点：baseDigest 不等于当前图指纹时整体拒绝（乐观锁）；
      操作按「先改字段、后删节点」排序，每个结构操作后重建内存快照——否则按旧下标写
      会把状态落到错误的想法上（对抗审查实测过这个静默污染）；状态操作转调既有 setStatus 的证据校验，说明文字也从那里进
      log，不重复记；新增操作强制 status 为 todo、剥掉 payload 里的 log 和人工签字字段——否则改动文件能凭空造出
      「已完成已签字」的想法；删除操作要求已没有别的想法依赖它，并把挂在被删节点上的 分节注释搬给下一个节点；新增节点用 doc.createNode
      且散文字段设块折叠样式 （裸对象塞进 yaml 文档后续就改不动了，实测）；凡是被改了行为字段 （what / expected / how /
      why_this_way / verify）的已完成想法，自动降回 doing 并留
      log——让测试先行、想清楚、人批准三条规则对它重新生效。成功后把改动文件 改名为
      changes.applied-<日期>.json，输出末尾固定提醒「回浏览器刷新页面再做 下一轮」；set
      子命令落盘后也顺手重新渲染，让磁盘上的网页永远新鲜。
    why_this_way: >
      写回必须是确定性指令而不是 agent 自由发挥——注释、格式、校验都会在自由发挥里丢。 全部校验内置在引擎里而不是指望 hook：apply 走
      Bash，hook 根本看不见它。这条 信任边界要诚实写明：apply 守住的是「状态有证据、图不写坏、改动有记录」，
      守不住「改动一定来自人」（那是 I-066 的事）。check 挪到写盘之前，因为这套工具
      自己的底线就是坏图不落盘；「已完成想法自动降级」是对抗审查发现的最大流程漏洞的 最小修法——guard
      对已完成想法的代码文件直接放行，不降级的话改了图之后代码 不经批准就能改。改动格式不借 JSON Patch（RFC
      6902，按下标定位不认编号）也不借 JSON Merge Patch（RFC 7396，数组只能整体替换）：保注释要求应用端逐条走 yaml 的
      Document 接口，任何现成补丁库的应用引擎都是死重；自定义按编号的操作清单， 语义对齐 Kubernetes strategic merge
      patch 的 merge-by-key 先例。
    code:
      - file: claude-companion/ideas.ts
        symbol: applyChanges
      - file: claude-companion/ideas.ts
        symbol: main
    verify:
      command: "npx vitest run .devcompanion/tests/test_ideas_apply.test.ts"
      pass: "exit 0"
    future: >
      agent 对齐代码之前跑的就是这条指令；它也是以后任何「机器改图」场景的唯一入口。

  - id: I-066
    name: "人批准自己在网页上做的修改，而批准机制不被削弱"
    status: todo
    needs: [ I-065, I-048 ]
    what: >
      设计并实现：改动写回之后，这张新图如何获得「人已批准」的地位 —— 同时保持既有底线：批准只能来自人亲手的动作，agent 自己造不出来。
    why: >
      图一改，旧批准就失效，这是刻意的特性；但这次改图的人恰恰就是批准人自己。 如果网页上改完还要按原样再走一遍全图审查和批准，这个功能就没有省下任何步骤。
    expected: >
      人在网页上改完、改动写回之后，用一步人亲手的动作（不是 agent 的动作） 就能让新图进入已批准状态；agent 依然没有任何办法伪造这一步。
    how: >
      三件事。一，先堵已有的旁路：guard 新增一条对 Bash 的规则——命令文本触及
      .approved、.scan-todo、.applied、图文件或改动文件、或直接调用 guard.ts 的一律 拦下，只放行 ideas.ts
      子命令形式的调用；同时把设置里的 Bash 允许列表从 「任何 npx tsx」收窄到「npx tsx <引擎路径>」。二，apply
      写盘后把（写盘前指纹、 写盘后指纹、改动文件的哈希、逐字段改动清单）写进受同等保护的 ideas/.applied 回执，并把逐字段 diff
      打印给人看。三，批准词扩展：整句「批准 <12位指纹>」只在 参数 == 当前图指纹 == 回执里的写盘后指纹 时生效——apply 之后
      agent 对图的任何 一次改动都让三者失配，快速通道自动失效、退回全图审查；指纹不符时当场明确报错
      拒绝这条消息，不许静默失败——静默失败会训练人不看内容只粘指纹。
    why_this_way: >
      对抗审查推翻了原设计的两个假设。其一「agent 造不出批准」现状就是假的：guard 只挂 在 Edit / Write 上，Bash
      从来不经过它，而允许列表放行任何 npx tsx——agent 写个 脚本跑一下就能直接写
      .approved。先堵这扇门，别的都谈不上；堵门顺带关掉 README 里如实记录的「用 Bash 喂假事件给
      guard.ts」的已知天花板。其二「指纹相等 = 人看过 这张图」不成立：指纹证明新鲜度不证明来源，agent 可以在 apply
      之后夹带私货再打印 真实指纹——所以快速通道必须绑定 apply 的受保护回执，不能只绑指纹。诚实的边界：
      这套机制把伪造成本提高到「必须经过人的权限提示」，不是数学上不可伪造。 明确否决的方案：headless 管道喂「批准」（claude
      -p），任何脚本都能跑，等于把门拆了。
    code:
      - file: claude-companion/guard.ts
        symbol: decide
      - file: claude-companion/guard.ts
        symbol: isApproval
      - file: claude-companion/guard.ts
        symbol: recordApproval
      - file: .claude/settings.json
    verify:
      command: "npx vitest run .devcompanion/tests/test_ideas_guard.test.ts"
      pass: "exit 0"
    future: >
      任何「人自己发起的修改」以后都能用同一条通道快速获得批准。

  - id: I-067
    name: "提交之后，人敲一条指令，agent 就把代码对齐到新图"
    status: todo
    needs: [ I-065, I-066, I-049 ]
    what: >
      人敲一条指令，agent 读当前的想法图，找出「想法说的」和「代码做的」不一致的地方，

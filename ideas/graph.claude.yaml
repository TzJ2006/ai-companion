    expected: >
      点「提交」后，磁盘上出现一个改动文件，逐条完整描述人在网页上做的每一处修改； 什么都没改时提交会被阻止，或产生一个明确说明「没有改动」的空文件。
    how: >
      「提交」把改动打包成一个 JSON 文件：版本、项目、baseDigest（页面嵌的图指纹， 原样带回，页面绝不自己算）、逐条改动（操作类型 set
      / add / remove / link / status、 想法编号、字段、编辑前的旧值、新值）。落盘走三级降级：Chromium 的
      showSaveFilePicker（file:// 下实测可用，预填文件名 changes.claude.json， 会话内可静默覆盖保存）→
      触发下载并在页面上显示「移动到 <ideas/ 的绝对路径>」 （路径由 render 时嵌入，第一次保存前也显示）→
      复制到剪贴板。保存成功不清草稿， 只标记「已提交」——等改动真正落图后再由人丢弃。没有改动时提交按钮不可用。
    why_this_way: >
      三级降级链照 Excalidraw / tldraw / drawio 收敛出的行业模式（browser-fs-access） 手写内联，不引
      npm 依赖，保住单文件自包含。每条改动带旧值，是给写回指令在 图已变时做逐条比对和冲突展示用的——只带新值的改动文件一遇冲突只能整体作废。
      保存成功不清草稿是对抗审查的修正：清了之后一旦写回被拒（图在编辑期间被别的会话 改过——本次调研当天就真实发生了一次），人的改动就一份都不剩了。
    code:

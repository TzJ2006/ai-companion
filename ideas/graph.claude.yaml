version: 1
agent: claude
project: ai-companion
overview: >
  一个 TypeScript 单体仓库，做两件互相支撑的事：在函数这一级别追踪代码改动并记录 「为什么改」；以及在这个追踪核心之上长出一套可以装进任何仓库的
  AI 开发工作流。 终点只有一个 —— 那套工作流真的能装进别的仓库并跑起来。追踪核心、报告渲染、 执行引擎都是为这个终点服务的手段。
  2026-08-24 晚：旧代码树（packages/ scripts/ skills/ docs/）先被移到 archive/、
  随后从磁盘上消失了。它只存在于 tag pre-archive-2026-08-24。因此 I-001~I-019
  这批描述追踪核心的想法已改为 blocked —— 它们做完过，但不再是本仓库的活代码。
  注意：这个仓库同时住着三个 agent 的 companion。这张图是 Claude 侧的； Cursor 侧的在
  ideas/graph.yaml，Codex 侧在 codex-companion/。互不覆盖。


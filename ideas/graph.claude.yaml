      人写的，防脚本注入。每次修改记进内存里的改动清单，并尽力存进浏览器本地存储当草稿 （键用项目路径哈希做命名空间；存取全部包
      try/catch，存不了就降级为纯内存并在页面 顶部明说「关页即丢」）。草稿恢复永不静默：重开页面时列出「有 N 处未提交的改动」，
      人逐条确认才恢复。

  - id: I-069
    name: "把三套实现的分歧逐条裁决，写成一份共同规范"
    status: doing
    needs: []
    what: >
      一份唯一的规范文件（companion/FORMAT.md），用 D1～D34 逐条裁决三套实现
      的格式、审批、验证、路径、hook、分发和共享状态。共同基座必须让三边共用
      一张项目图，并保留三边已有的最强可验证保证，而不是退化成最小公分母。
    why: >
      初稿只裁决到 D15，完备性审计又发现 19 个真实分歧；其中旧裁决还会删除
      Codex 的 RED→GREEN 证据并放松 Cursor 的 fail-closed，和「现有功能不回退」
      矛盾。分歧不先裁决就合并代码，只会把三套矛盾藏进一份文件。
    expected: >
      D1～D34 每一项都有三边现状、裁决和理由；规范明确一张项目图、两次常规
      审批、当前 RED/GREEN 证据、严格路径范围、共同 Skill 与 hook 归一化。
      一个陌生 agent 只读这份文件就知道什么可写、何时可做、怎样验证。
    how: >
      保留 YAML、四状态、needs、endpoints 与短版八问；修订 D7/D8/D9/D10，
      吸收 Codex 的内容绑定审批、RED/GREEN 和路径证据，吸收 Cursor 的默认拒绝、
      doing readiness 与重叠检查。新增 D16～D34，覆盖 shell 旁路、未知路径、
      runtime 保护、原子写、共同 CLI/Skill、单文件发布和显式遗留迁移。
    why_this_way: >
      先裁决保证，再裁代码形状；共享核心不等于选最弱交集。基座仍放顶层
      companion/，而平台差异只留在输入输出映射与三个 manifest，避免重新造
      一套抽象框架。
    code:
      - file: companion/FORMAT.md
      - file: CLAUDE.md
    verify:
      manual: "人读 D1～D34：每项都有三边现状、裁决和理由；确认一张共享图、严格写前失败、两次常规审批和 RED→GREEN 是共同基线"
      signed_off: "Zijia Tang 2026-08-30 —— 人在会话中逐条追问 D7/D8 后答复「全留」并回复「通过」；由 ccbuild 代录，原话见 ideas/log.claude.md"
    future: >
      以后任何概念性调整都只改这一份规范；第四个 agent 接入时读它就够了。
    log:

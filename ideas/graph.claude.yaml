  - id: I-063
    name: "在网页上增删想法和前置关系"
    status: todo
    needs: [ I-062 ]
    what: >
      在网页上新建想法（自动分配下一个从未用过的编号）、删除想法、 在两个想法之间加上或去掉「前置」箭头；新建的想法至少要填够前三个问题
      （是什么、为什么、预期结果）才算成形。
    why: >
      人审图最常见的两个结论是「缺一条边」和「这个节点做了太多事、该拆开」。 只能改文字不能改结构的话，这两类最有价值的修改仍然要绕回 YAML 文件。
    expected: >
      网页上加一个节点、连一条边、删一条边，图立即重画出新形状； 新想法的编号不和历史上任何编号冲突（编号永不复用）。
    how: >
      图文件顶层加一个只增不减的取号计数器（next_id），写回指令维护、render 一并嵌进
      页面——新建想法从它取号，而不是页面自己看当前图算最大值（被删掉的编号页面看不见，
      算出来会复用）。删除做成「标记待删、提交时生成删除指令」，可反悔。结构一变， 页面重建 mermaid 图源再重画：把「整张图 → mermaid
      源文本」抽成一个零闭包、 不引用外部变量的纯函数（净化、折行、状态分色、点击绑定全在函数里）， TypeScript
      侧和页面侧跑的是同一份源码（渲染时用 Function.prototype.toString 注入页面）。新计数器字段写进 FORMAT.md。
    why_this_way: >
      取号计数器进图文件而不是让页面算：编号永不复用是格式的硬规定，而页面看不见历史 ——本仓库自己就是反例（旧图 I-001~I-040
      已退役，页面按当前图算 max 会撞上它们）。 共享函数用 toString 注入而不是手抄两份：手抄的第二份一定漂移；对抗审查还抓到
      现状代码里这段逻辑引用了函数外的变量（ends），不先提取成零闭包注入了也是白注入。
      净化必须在共享函数内而不是调用处，否则页面侧重建时漏掉净化，一个含引号的想法名 就让整张图消失。

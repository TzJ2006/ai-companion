  - id: I-005
    name: "崩溃安全的历史存储"
    status: blocked
    needs: [ I-001, I-004 ]
    what: >
      把变更记录存成纯 JSON 文件：不可变的 session 日志（journal）加上由它推导出的
      索引与按文件分组的历史（projection），带跨进程文件锁、原子写、 以及可自愈的投影清单。
    why: >
      历史记录一旦损坏，整个「为什么改」的价值就没了。而钩子是多进程并发写的， 编辑器随时可能被关掉。
    expected: >
      并发写不会互相覆盖；写到一半崩溃不会留下半份文件；投影和日志对不上时 能自动重建；日志被人篡改成非法结构时明确报错而不是静默吃掉。
    how: >
      withProjectLock 用带心跳租约的独占锁文件（过期可回收）；所有写都是 临时文件 + rename；projectSession
      增量投影并维护一份带摘要的清单， 清单对不上就整体重建。
    why_this_way: >
      日志（journal）不可变、索引可推导 —— 这样任何投影损坏都能从日志重算， 不需要备份。锁用心跳租约而不是看 PID：PID 会被复用，
      而复用的 PID 会让仓库被永久锁死（代码里明确写了这条注释）。
    code:

  - id: I-012
    name: "百毫秒内的编辑捕获"
    status: blocked
    needs: [ I-004 ]
    what: >
      PostToolUse 钩子：Claude 或 Codex 每次写文件之后立刻触发， 在 100
      毫秒内把事件（含改前／改后快照证据）写进队列，然后就结束。
    why: >
      希望每次改动连同原因都被自动记下来，不需要人手动登记； 同时绝对不能让编辑卡顿。
    expected: >

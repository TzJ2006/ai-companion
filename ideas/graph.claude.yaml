  - id: I-070
    name: "把三份图引擎合成一份，并把遗留状态显式迁入同一张项目图"
    status: todo
    needs: [ I-069 ]
    what: >
      companion/ideas.ts 成为唯一图引擎，只读写项目级 ideas/graph.yaml；合并
      Claude 的扫描/渲染、Cursor 的 readiness/new/paths/allow/log，以及 Codex 的
      审批摘要、RED/GREEN runtime、路径与行号验证。migrate 显式导入旧后缀 YAML
      或 Codex JSON，不自动选择胜者。
    why: >
      当前三边不仅代码重复，状态也分叉；只共享实现、仍各写一张图，换 agent
      仍然无法接手。迁移必须先把项目真相收敛，再退役旧引擎。
    expected: >
      原有 6 个 Vitest 与 14 个 Codex unittest 表达的保证全部迁成共享测试并全绿；
      三种遗留输入各有迁移 fixture；迁移后只有 graph.yaml 是可写真相，冲突输入
      会停下要求人选择，绝不覆盖。
    how: >
      以 Claude TypeScript 为解析和渲染基体，逐项移植测试先于代码；使用
      ideas/.runtime 保存审批与验证证据，图 mutation 用 digest 做并发检查；新增
      paths/migrate/new/status/allow/request-approval/run-check/log。旧引擎保持只读，
      直到各平台验收完成。
    why_this_way: >
      复用现有 TypeScript 最大公共代码面，但以行为测试决定保留什么，不按文件
      行数投票。显式 migrate 比安装器猜测安全；一份项目图比 agent 后缀更符合
      「项目记录」的定义。
    code:
      - file: companion/ideas.ts
    verify:
      command: "npx vitest run --dir .devcompanion/tests && python -B -m unittest discover -s codex-companion/tests -v"
      test_files:
        - .devcompanion/tests/*.test.ts
        - codex-companion/tests/test_*.py
      pass: "exit 0"
    future: >
      新 agent 直接接手同一图；遗留格式迁一次后不再参与日常读写。

  - id: I-071
    name: "把三套强制规则合成一个策略核心，并在三种 hook 输入之间做薄映射"
    status: todo
    needs: [ I-070 ]
    what: >
      companion/guard.ts 把三家事件归一化后执行同一套策略：未认领文件默认拒绝、
      doing readiness/前置/路径范围、两次审批、RED→GREEN、状态和 runtime 保护、
      shell mutation 与 Stop 完成检查。写前/批准/Stop 崩溃时拒绝，写后记录崩溃
      时放行告警；各平台只编码输入输出协议。
    why: >
      直接搬 Claude guard 会漏掉 Codex apply_patch、MCP 与 Bash，也会把 Cursor
      的默认拒绝改成默认放行。共同守卫必须共享“决定”，不能假装原始 JSON 完全相同。
    expected: >
      三组真实事件 fixture 对相同行为产生相同 allow/deny；未知写路径、未批准、
      无 RED、越界文件和 shell 旁路均被拒绝；PostToolUse 记录失败不会阻断已经
      完成的写；AIDEV_GUARD=off 会显示并记录警告。
    how: >
      同一文件里保留三个小 normalize 函数与三个 output encoder，不建 adapter
      类层级；策略函数只接收 normalized event。移植 Cursor gate 和 Codex hook
      测试，覆盖 apply_patch 多文件解析、MCP、本地编辑与 Stop continuation。
    why_this_way: >
      三家 hook 已足够接近，可以共享策略；又没有接近到可安全删除归一化。
      几个纯函数是最小薄层，比复制三份规则或引入通用 adapter framework 都短。
    code:
      - file: companion/guard.ts
    verify:
      command: "npx vitest run .devcompanion/tests/test_ideas_guard.test.ts
        .devcompanion/tests/test_companion_gate.test.ts .devcompanion/tests/test_companion_record.test.ts"
      test_files:
        - .devcompanion/tests/test_ideas_guard.test.ts
        - .devcompanion/tests/test_companion_gate.test.ts
        - .devcompanion/tests/test_companion_record.test.ts
      pass: "exit 0"
    future: >
      新规则写一次；新平台只新增事件 fixture 和两段映射。


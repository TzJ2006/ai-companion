  - id: I-001
    name: "不随行号漂移的函数身份"
    status: blocked
    needs: []
    what: >
      给每个函数算一个稳定的身份哈希：sha256(文件路径 :: 类名 :: 函数名 :: 参数名:类型)，取前 16 位十六进制。
    why: >
      整个追踪系统需要回答「这个函数的历史」，而 git 只知道行号。代码一挪位置， 按行号索引的历史就全断了。必须有一个不随行号变化的身份。
    expected: >
      同一个函数在文件里上下移动之后，哈希不变，历史能接上；改了参数类型则哈希改变 （这是故意的 —— 契约变了就是另一个函数）。
    how: >
      identity.ts 里拼出 identityString 再做 sha256。刻意剔除 self / cls，
      因为它们是语言噪音而不是契约的一部分。
    why_this_way: >
      把参数的「名字:类型」都算进哈希，是为了区分重载；把 class_name 算进去， 是为了区分不同类里的同名方法。不含行号 ——
      这正是整个设计的要点。
    code:
      - file: archive/2026-08-24/packages/ast/src/identity.ts
        symbol: computeFunctionIdentity
        lines: "4-32"
    verify:
      command: "npx vitest run
        .devcompanion/tests/test_ast_computeFunctionIdentity.test.ts"
      pass: "exit 0"
    future: >
      历史存储、变更归因、报告渲染全都以这个哈希为主键。
    log:
      - date: 2026-08-25
        by: ccfix
        note: 代码已不在工作树里，只存在于 tag pre-archive-2026-08-24；不再是本仓库的活代码

  - id: I-002
    name: "Python 与 TypeScript 的统一解析"
    status: blocked
    needs: [ I-001, I-003 ]
    what: >
      用 tree-sitter（WASM 版）把两种语言的源文件解析成同一个 ParsedModule 结构：
      函数、类、方法、参数、装饰器、返回类型、docstring、import。
    why: >
      要在函数级别归因，就必须先知道每个函数占哪几行。正则做不到这件事 —— 嵌套类、装饰器、类型注解都会让正则失效。
    expected: >
      给一个 .py 或 .ts 文件，parseFileAuto 返回它全部的函数签名和行号范围， 调用方不需要知道是哪种语言。
    how: >
      parser-factory.ts 提供一个语言无关的工厂（init / parseSource / parseFile）， Python 和
      TypeScript 各自只提供一个 parseModule 回调；multi-lang.ts 按扩展名分发。
    why_this_way: >
      用工厂而不是两份复制的解析器代码，是因为初始化、读文件、建树这三步两种语言 完全一样，不同的只有「怎么从语法树里取东西」。新增一门语言只需要写一个
      parseModule 回调。
    code:
      - file: archive/2026-08-24/packages/ast/src/parser-factory.ts
        symbol: createLanguageParser
        lines: "18-46"
      - file: archive/2026-08-24/packages/ast/src/multi-lang.ts
        symbol: parseFileAuto
        lines: "17-31"
      - file: archive/2026-08-24/packages/ast/src/parser.ts
        symbol: parsePythonModule
        lines: "26-279"
      - file: archive/2026-08-24/packages/ast/src/ts-parser.ts
        symbol: parseTsModule
        lines: "21-320"
    verify:
      command: "npx vitest run
        archive/2026-08-24/.devcompanion/tests/test_ast_multiLang.test.ts"
      pass: "exit 0"
    future: >

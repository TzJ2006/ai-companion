version: 1
agent: claude
project: ai-companion
overview: >
  三套「想法图」开发工作流，一个仓库里并排住着，各服务一个 agent：
  claude-companion（TypeScript，五个斜杠命令 + 七条 hook 规则）、
  cursor-companion（TypeScript，写闸门式）、codex-companion（Python）。
  共同的核心是一句话：项目里的每一个想法都是图上的一个节点，前置关系是唯一的边，
  每个节点必须回答八个问题。所有东西存在 ideas/graph.yaml 一个文件里。
  它要解决的是同一个根因：想法从来没被写下来过，只有代码被写下来了。

  2026-08-25 重建：commit ca7e956 把旧的 monorepo（packages/ scripts/ skills/ docs/，
  即函数级变更追踪那一整套）移进 gitignore 的 archive/ 并从工作树上删除，只留在 git
  历史和 tag pre-archive-2026-08-24 里。旧图的 I-001~I-019 描述的就是那批代码，
  已经不是本仓库的活代码，因此整张图按人的决定重建，新 id 从 I-041 起
  （FORMAT.md 规定 id 永不复用）。

# 什么叫「这个项目做完了」（2026-08-25 由人在 /ccscan 第 2 步选定）
endpoints: [ I-057, I-058, I-059 ]

ideas:

  # ─────────────────────────────────────────────────────────────
  # 地基：格式与引擎
  # ─────────────────────────────────────────────────────────────

  - id: I-041
    name: "八问的想法节点格式"
    status: doing
    needs: []
    what: >
      一个想法节点的格式：id / name / status / needs，加上八个必答问题
      （是什么、为什么有它、预期结果、如何实现、为什么这样实现、代码在哪几行、
      如何验证、未来怎么用），外加一条 append-only 的 log。
    why: >
      AI 出幻觉、prompt 对不齐需求、返工之后自己也看不懂项目框架 —— 这三件事的
      根因是同一个：想法从来没被写下来，只有代码被写下来了。
    expected: >
      同一个想法，人和 AI 读同一份记录得到同一个理解；一个冷启动的陌生 agent
      读这个文件就能接着干，不需要额外上下文。
    how: >
      YAML，一个扁平的 ideas 列表，一种节点、一种边。规格写在 FORMAT.md，
      三个 companion 各有一份基本一致的副本。
    why_this_way: >
      选一层扁平结构而不是需求／特性／模块／函数四层 —— FORMAT.md 结尾写明：
      诉求是「所有想法都变成一个个模块」，模块不是分类法，四层结构本身就是让人
      看不懂项目的那种复杂度。YAML 而不是 JSON，因为八个回答都是成段散文。
    code:
      - file: claude-companion/FORMAT.md
        lines: "1-143"
    verify:
      manual: "拿一个真实想法填一遍八问，看有没有哪个问题填不进去、或者填完还说不清这个想法"
      signed_off: null
    future: >
      整套工具的其它部分都只读写这一个格式；加字段的成本是一个 YAML key。
    log:
      - date: "2026-08-25"
        by: ccscan
        note: "重建后的第一个节点；人工验证未签字，所以不是 done"

  - id: I-042
    name: "图的解析与校验"
    status: done
    needs: [ I-041 ]
    what: >
      读 graph.yaml，检查 id 唯一、needs 指向存在的想法、图无环、done 的节点必须有
      code 和 verify、done 的 code 路径真的存在、人工验证必须有人签字；
      八问里没填的字段报成警告。
    why: >
      没有校验，图会安静地烂掉：done 却没有代码、code 指向已删掉的文件、两个想法
      互相依赖。烂掉的图比没有图更糟，因为它看起来是完整的。
    expected: >
      健康的图 check 通过、退出码 0；每一种烂法都能被指出来并说明是哪个 id。
    how: >
      DFS 三色标记查环；从 endpoints 反向遍历 needs 找出通不到任何终点的孤儿；
      existsSync 验证 done 节点的 code 路径（todo 的不查 —— 那是计划中的位置）。
    why_this_way: >
      把「done 必须有 code + verify」做成硬错误而不是警告 —— 代码注释写明这是整套
      东西成立的前提：如果「完成」可以没有证据，这张图就只是一份愿望清单。
      todo 的 code 路径刻意不查，否则计划本身会被当成错误。
    code:
      - file: claude-companion/ideas.ts
        symbol: check
        lines: "260-327"
      - file: claude-companion/ideas.ts
        symbol: findCycle
        lines: "119-137"
      - file: claude-companion/ideas.ts
        symbol: orphans
        lines: "140-154"
    verify:
      command: "npx vitest run .devcompanion/tests/test_ideas_graph.test.ts"
      pass: "exit 0"
    future: >
      /ccbuild 动手前先跑它；/ccgraph 用它的输出告诉人接下来该做什么；
      guard 的 R5 用它拦住「回合结束时图是坏的」。

  - id: I-043
    name: "前沿查询"
    status: done
    needs: [ I-042 ]
    what: >
      算出现在可以做哪些想法：status 是 todo、且所有前置都已 done 的节点。
    why: >
      「接下来做什么」应该是图算出来的，不该是另一份要手动同步的 TODO 列表 ——
      两份清单一定会不一致。
    expected: >
      next 打出来的就是可以立刻动手的想法；一个都没有时说清是全做完了还是全被挡住了。
    how: >
      一次过滤：status === todo 且 needs.every(前置已 done)。
    why_this_way: >
      不做拓扑排序 —— 代码注释写明前沿只需要一次过滤，做完一个再算一次即可，
      少一个可能出错的地方。
    code:
      - file: claude-companion/ideas.ts
        symbol: frontier
        lines: "111-116"
    verify:
      command: "npx vitest run .devcompanion/tests/test_ideas_graph.test.ts"
      pass: "exit 0"
    future: >
      /ccbuild 的入口；互不相干的前沿想法可以并行交给多个 subagent。

  - id: I-044
    name: "状态写回与记录"
    status: done
    needs: [ I-042 ]
    what: >
      改一个想法的状态，同时在它自己的 log 里追加一条记录；写回时保留 YAML 注释；
      拒绝没有 code / verify 的 done，拒绝没签字的人工验证。
    why: >
      改了什么代码、什么文档、什么想法要有详细记录，而原因要放在想法旁边，
      不是另一个文件里 —— 放远了就没人读。
    expected: >
      set 之后重新读：状态变了、log 多了一条、原来的注释还在；对一个没有 code 的
      想法 set done 会失败并说明原因。
    how: >
      yaml 的 parseDocument 保留注释和格式，setIn 定点修改，写临时文件再 rename。
    why_this_way: >
      走 Document 而不是 parse → 改 → stringify：后者会抹掉整个文件的注释和排版，
      而注释正是人留给自己的东西。rename 是原子的，写到一半崩溃不会毁掉原图
      （代码注释：a crash mid-write leaves the old graph intact）。
    code:
      - file: claude-companion/ideas.ts
        symbol: setStatus
        lines: "331-355"
      - file: claude-companion/ideas.ts
        symbol: save
        lines: "95-99"
    verify:
      command: "npx vitest run .devcompanion/tests/test_ideas_graph.test.ts"
      pass: "exit 0"
    future: >
      五个命令都通过它写状态，所以不存在「忘了记一笔」这条路径。

  - id: I-045
    name: "可点击可缩放的想法图"
    status: done
    needs: [ I-042 ]
    what: >
      渲染成一个自包含网页：上面是只显示想法名称的完整项目图，可平移缩放；
      点任意节点跳到下面的详情卡片，卡片里是八问的全部回答，以及它的前置想法和
      「它是哪些想法的前置」，两个方向都能继续点。
    why: >
      看不见形状的项目最后一定会被重写。图是给人看的，不是给机器看的，
      而人要判断的三件事（节点做得太多、缺边、通不到终点）只有画出来才判断得了。
    expected: >
      双击打开 graph.html 就能一眼看出项目形状；缩放之后线条依然锐利；
      拖拽不会被误判成点击节点。
    how: >
      Mermaid flowchart TD（CDN）做布局，节点标签只放 name，click 回调跳详情。
      缩放靠改 SVG 自身的 width/height 让矢量重画，平移靠 wrapper 的 translate。
    why_this_way: >
      用 Mermaid 而不是 d3 / cytoscape：静态 HTML，没有构建步骤也不用起服务器。
      缩放刻意不用 CSS scale() —— 代码注释写明 scale 会把图层栅格化一次再拉伸，
      那正是之前看起来发虚的原因；fit 只缩不放，因为把一张小图放到 235% 不是
      任何人说「适应窗口」时想要的。
    code:
      - file: claude-companion/ideas.ts
        symbol: render
        lines: "364-605"
    verify:
      command: "npx vitest run .devcompanion/tests/test_ideas_graph.test.ts"
      pass: "exit 0"
    future: >
      /ccthink 第 2 步用它让人在动手之前就看出拆分错了；/ccscan 用它交付结果。

  - id: I-046
    name: "可核验的扫描清单"
    status: done
    needs: [ I-042 ]
    what: >
      /ccscan 开始时把项目里值得读的文件列成一张清单（ideas/.scan-todo），
      每 Read 一个文件由 hook 划掉一个；check 在清单没清空时持续警告。
      ideas/.scanignore 可以按路径前缀排除（第三方包、别的 agent 的并行版本）。
    why: >
      「我读完了」是一句 agent 随口就能说的话。一张图如果是从半个项目上建起来的，
      它看起来和完整的一模一样 —— 这比没有图更糟。
    expected: >
      扫描进度是「已读 37/42」这样的数字而不是一句保证；Grep / Glob 不算，
      因为它们不把文件内容放进上下文。
    how: >
      git ls-files -z --cached --others --exclude-standard 生成清单
      （拿不到 git 时退化成目录遍历），按扩展名和 .scanignore 过滤；
      strike() 按大小写不敏感的相对路径划掉一行。
    why_this_way: >
      用 git ls-files 而不是自己遍历，因为它已经懂 .gitignore、子模块和大小写；
      加 -z 是因为不加时 git 会把非 ASCII 路径转义成八进制，那些文件就永远划不掉
      （代码注释明确写了这一点）。node_modules 显式排除，因为仓库可能真的把它提交了。
    code:
      - file: claude-companion/ideas.ts
        symbol: listProjectFiles
        lines: "192-210"
      - file: claude-companion/ideas.ts
        symbol: strike
        lines: "243-252"
      - file: claude-companion/ideas.ts
        symbol: scanIgnores
        lines: "184-190"
    verify:
      command: "npx vitest run .devcompanion/tests/test_ideas_guard.test.ts"
      pass: "exit 0"
    future: >
      任何声称「通读了项目」的命令都可以挂在同一张清单上。

  # ─────────────────────────────────────────────────────────────
  # 强制层：跑在 harness 里、agent 绕不过去的纪律
  # ─────────────────────────────────────────────────────────────

  - id: I-047
    name: "七条 hook 强制规则"
    status: done
    needs: [ I-042, I-046 ]
    what: >
      一个 guard.ts 挂在 PreToolUse / PostToolUse / Stop / UserPromptSubmit 上，
      按事件分派七条规则：R1 每次编辑自动记进 log；R2 已有想法的 status 只能走 set；
      R3 测试文件不存在就不准写实现；R4 how / why_this_way 没填就不准动它的代码；
      R5 图有错误就不准结束回合；R6 没人批准的图不准开始实现；
      R7 文件只有被真的 Read 过才算扫描过。
    why: >
      五个命令都只是提示词 —— agent 可以跳过调研、编造 why_this_way、直接 Edit
      把 status 改成 done 绕过全部校验、自问自答说「看起来合理」然后继续。
      写在提示词里的纪律，到第三十轮对话就不算数了。
    expected: >
      跳过测试直接写实现会被拒绝并告诉它先写哪个文件；手改 status 会被拒绝并给出
      该跑的 set 命令；图坏着不准结束回合；每次编辑在 ideas/log.md 留一行，
      不需要 agent 配合。
    how: >
      退出码 2 + stderr = 「拦下并把原因告诉 Claude」，这是四个 hook 事件上唯一
      通用的机制，所以一个脚本按 hook_event_name 分派就够。
      install.ts 负责写进目标仓库的 .claude/settings.json 且不覆盖别人的 hook。
    why_this_way: >
      只强制机器判得了的事：文件存不存在、字段填没填、状态变没变、check 过不过。
      八个回答的质量、联网搜索是否诚实强制不了，唯一的防线是让遗漏在 check 和
      渲染里可见 —— 硬拦一个判不准的东西比不拦更糟。所有异常路径一律 fail open
      （代码注释：a guard that crashes must never block work），
      守卫自己崩了不能把人锁在外面；AIDEV_GUARD=off 是逃生口。
    code:
      - file: claude-companion/guard.ts
        symbol: decide
        lines: "159-190"
      - file: claude-companion/guard.ts
        symbol: ruleTestFirst
        lines: "217-274"
      - file: claude-companion/guard.ts
        symbol: ruleGraphIsSound
        lines: "307-320"
    verify:
      command: "npx vitest run .devcompanion/tests/test_ideas_guard.test.ts"
      pass: "exit 0"
    future: >
      要加新纪律就在 decide 里加一条规则加一个测试 —— 前提是它机器判得了。

  - id: I-048
    name: "不可伪造的人工批准"
    status: done
    needs: [ I-047 ]
    what: >
      批准绑定在图的 sha256 前 12 位上，只有 UserPromptSubmit 事件里整条消息就是
      「批准 / approve / 同意」时才写进 ideas/.approved；图改一个字批准就失效。
      .approved 和 .scan-todo 这两个账本文件本身被 PreToolUse 拦住，不能用 Write 写。
    why: >
      agent 写得进去的标记，agent 就能伪造。一个「我已确认」的标记如果由被约束者
      自己写，它约束不了任何东西。
    expected: >
      没批准过的图上动手会被拒绝并要求先给人看；「我不批准」不会被算成批准；
      任何工具事件都产生不了批准。
    how: >
      APPROVALS 是一个集合，比对的是 trim + 小写 + 去尾部标点之后的整条 prompt；
      换行符先归一化再做哈希，免得 CRLF 检出被读成另一张图。
    why_this_way: >
      把「我做了」绑到一个不真做就产生不了的事件上：UserPromptSubmit 只有人亲手敲
      消息才会触发。判断「整条消息就是批准」而不是「消息里含批准」，否则
      「我不批准」会被算成批准。
      已知天花板（README 如实写出）：agent 仍可以用 Bash 直接喂一个假的
      UserPromptSubmit 给 guard.ts。R6 挡的是顺手跳过，不是铁了心要绕过去的 agent。
    code:
      - file: claude-companion/guard.ts
        symbol: graphHash
        lines: "92-98"
      - file: claude-companion/guard.ts
        symbol: isApproval
        lines: "112-119"
      - file: claude-companion/guard.ts
        symbol: recordApproval
        lines: "280-285"
    verify:
      command: "npx vitest run .devcompanion/tests/test_ideas_guard.test.ts"
      pass: "exit 0"
    future: >
      任何「必须由人点头」的关卡都可以用同一招：绑到 agent 造不出来的事件上。

  # ─────────────────────────────────────────────────────────────
  # 工作流：五个命令
  # ─────────────────────────────────────────────────────────────

  - id: I-049
    name: "五个斜杠命令"
    status: doing
    needs: [ I-041, I-043, I-044, I-045 ]
    what: >
      /ccscan 通读项目建图、/ccthink 对齐→拆分→调研→设计测试→按周排期、
      /ccbuild 测试先行地实现、/ccfix 先查代码与想法是否一致再查想法本身、
      /ccgraph 只看不改。每个都是一份 markdown 提示词。
    why: >
      引擎只是数据结构，真正决定产出质量的是「按什么顺序做事」。
      一句 prompt 对不齐需求，返工的成本远高于先花二十分钟对齐。
    expected: >
      每个命令在真实项目上跑一遍，产出的是它承诺的东西：
      /ccscan 给出诚实的覆盖数字和一份「我也不知道」的清单，
      /ccfix 给出带行号的不一致而不是泛泛而谈。
    how: >
      纯 markdown，步骤固定不可跳；关键处停下来等人（ccthink 第 2 步审拆分、
      ccfix 第 1 步审不一致、所有命令的最后等「批准」）。
    why_this_way: >
      /ccthink 把「能借就借」设成命令里优先级最高的规则，并把调研放在回答
      「如何实现」之前 —— 否则调研只会变成给已有答案找依据。
      /ccfix 刻意不让 AI 自己判断代码和想法哪边对：它恰恰是判断不了的那一方。
      /ccscan 明确禁止编造 why_this_way，因为编出来的理由会被下一个 agent 当成
      事实并一直维护下去，这是这个命令能造成的最大伤害。
    code:
      - file: claude-companion/commands/ccscan.md
        lines: "1-125"
      - file: claude-companion/commands/ccthink.md
        lines: "1-153"
      - file: claude-companion/commands/ccbuild.md
        lines: "1-122"
      - file: claude-companion/commands/ccfix.md
        lines: "1-110"
      - file: claude-companion/commands/ccgraph.md
        lines: "1-42"
    verify:
      manual: "五个命令各在一个真实项目上跑一遍，确认每一步都做到了它承诺的事；尤其看 /ccfix 是否报出准确行号"
      signed_off: null
    future: >
      产出的图直接就是 /ccbuild 的执行计划，中间不需要再转一次格式。
    log:
      - date: "2026-08-25"
        by: ccscan
        note: "五个命令都写完并装出去了，但没有一个在真项目上从头到尾走过；人工验证未签字"

  # ─────────────────────────────────────────────────────────────
  # 多 agent 共存与分发
  # ─────────────────────────────────────────────────────────────

  - id: I-050
    name: "文件名按 agent 认领"
    status: done
    needs: [ I-042 ]
    what: >
      ideas/graph.yaml 空着就用它并在文件里写 agent: claude；被别人占了就用
      ideas/graph.claude.yaml，配套的 .approved / .scan-todo / log.md 一起加后缀。
      选择做一次就固定，因为「后缀文件存在」本身就是答案。
    why: >
      Claude、Codex、Cursor 三个 companion 住在同一个仓库里，都想要
      ideas/graph.yaml。谁后写谁就毁掉前一个。
    expected: >
      三边并存，谁也不覆盖谁；一个没有 agent: 键的 graph.yaml 被当成别人的
      （反过来假设就会毁掉别人的东西）。
    how: >
      nameIsTaken 先看后缀文件在不在（在 = 已经选过了），再看平名文件的 agent: 行；
      agentName 按有没有扩展名决定后缀是插入还是追加（dotfile 没有扩展名可拆）。
    why_this_way: >
      先到的保留干净名字。用「文件是否存在」当状态，而不是另存一份配置 ——
      少一个可能和现实不一致的地方。agent: 键不是装饰，代码注释写明没有它，
      下一次调用会把我们自己的平名图读成别人的，从而悄悄换到后缀文件、
      抛弃刚写的图。
    code:
      - file: claude-companion/ideas.ts

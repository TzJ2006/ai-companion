  - id: I-004
    name: "把 diff hunk 归因到函数"
    status: blocked
    needs: [ I-002 ]
    what: >
      解析 git 的 unified diff，把每个 hunk 的行号范围和文件里各函数的行号范围 做重叠比对，得出「这次改动动了哪几个函数」。
    why: >
      git 只会告诉你「这个文件的第 41-53 行变了」。要回答「为什么改」， 得先知道改的是哪个函数。
    expected: >
      给一段 diff 和一份函数签名表，得到一串带函数名和身份哈希的变更记录； 落在任何函数之外的 hunk 标成 module-level 或
      config-change，而不是丢掉。
    how: >
      parser.ts 解析 diff 文本成 FileDiff[]；annotator.ts 对每个 hunk 求重叠函数，
      再按「文件::函数哈希」去重合并同一函数的多个 hunk。
    why_this_way: >
      归因不上的 hunk 保留成 module-level 而不是丢弃 —— 丢掉就意味着记录不完整，
      而不完整的记录看起来和完整的一样，这比没有记录更糟。

    why: >
      完整诉求是「改图即改项目」：改动写回 YAML 只是中转，最终交付物是符合新想法的代码。 这一步不接上，人还是要自己去发起实现，链路就断在最后一米。
    expected: >
      图里某个想法被改过之后敲这条指令，agent 自动开始工作； 结束时被改想法的验证命令通过、代码与八个问题的回答一致； 图里没被改过的部分不被乱动。
    how: >
      新斜杠命令 /ccapply（命令文件正文含 ideas.ts 字样——安装器靠这个字样识别自家 文件，缺了会被判为外来文件、永不更新；用
      install.ts --update 分发到已装仓库）。 流程：在 ideas/ 里找 baseDigest
      等于当前图指纹的改动文件（陈旧的逐个报出并忽略； 一个都找不到时提醒「检查是否存进了下载目录」）→ 跑 apply → 把逐字段 diff、
      check 结果、新指纹、以及「哪些想法八问未齐、本轮不实现（网页新建的三问想法都在 此列，先跑 /ccthink
      补齐再批准可省一次重复批准）」逐项报给人 → 人敲「批准」或 「批准 <指纹>」→ agent 只对本次改动触到、且八问齐全的想法按
      /ccbuild 纪律实现 （测试先行、状态走 set、verify 通过才标完成）→ 结束报告固定提醒刷新浏览器页面。
      指纹失配的改动文件有明确重放路径：agent 把每条改动（含旧值）对着新图逐条向人 确认，确认后以当前指纹重新生成改动文件再 apply。
    why_this_way: >
      交互式斜杠命令而不是 headless 管道：人敲 /ccapply 本身就是真实的 UserPromptSubmit 事件，hook
      全部照常生效，批准环节留在人手里。实现范围限定在本次改动触到的想法， 全图对齐是 /ccfix
      的事——一次提交不该引发全仓库漫游。轻量修改的分工也写进命令： 改一个错别字直接在对话里说更快（改散文字段本来就允许 agent 用 Edit

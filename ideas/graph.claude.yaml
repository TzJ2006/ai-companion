    how: >
      render 在网页里嵌入两样东西：整张图的 JSON 数据（一个 script 标签，作为页面唯一的 数据模型，DOM 只是视图）和当前图内容的
      12 位指纹（供提交时做过期检查）。 每张详情卡片加「编辑」开关：散文字段变多行输入框、状态变下拉、名称变单行输入框； 赋值一律走

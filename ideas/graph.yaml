  - id: I-082
    name: "格式规范里定下：一张想法图要带一份分步概览，以及那几句话怎么写"
    status: doing
    needs: [ I-041, I-086 ]
    what: >
      两份格式规范里加一节，规定每一张想法图都在文件顶层带一份分步概览： 一个有顺序的步骤列表（每一步一个名字和一句话），每个想法标明自己归哪一步。
      同一节里把那几句话该怎么写也定死：三到七步；每一步一句动词开头的话， 说清这一步做完之后这个项目多了什么能力（不是说它包含哪些东西）；
      不用任何缩写；不用任何需要读过这个仓库才懂的词； 「已知缺陷」「终点」「阅读顺序」这类给写图的人分类用的筐不算步骤。
    why: >
      「打开图的网页看不懂这个项目在做什么」不是这一个仓库的毛病， 是每一个装了这套工具的仓库都会有的毛病。给这个仓库手写几句话只解决一次；
      把「概览该怎么写」定成一条规矩写进规范，任何仓库照着做，都能得到属于它自己的那一份。
      这也是这套工具一贯的做法：概念性的东西只写在规范里一处，实现跟着规范走。
    expected: >
      读两份规范，能查到这份概览的字段长什么样、分几步、每一句话该怎么写、什么不算一步。
      一个从没见过这个项目的人，照着这一节就能给自己的仓库写出一份合格的概览， 不需要来问任何人，也不用参考这个仓库写成了什么样。
    how: >
      两份规范各加一节，正文相同（共同基座那份是权威，Claude 那份是迁移完成之前还在跑的副本）。
      **字段形状**：图文件顶层加一个有顺序的列表，每一项两个键 —— 一个短名字、一句话； 每个想法加一个字段，写明自己归哪一步（填那个短名字）。
      **五条写作规矩，逐条写进规范**：一、三到七步。二、每一步一句动词开头的话， 说清这一步做完之后这个项目多了什么能力 ——
      是「能做什么了」，不是「里面装了哪些东西」。 三、不用任何缩写。四、不用任何需要读过这个仓库才懂的词。
      五、给写图的人分类用的筐（比如「已知缺陷」「终点」「阅读顺序」）不算一步。 **同时给一个完整的例子和一个反例**：反例就用第五条 ——
      把「已知缺陷」写成一步长什么样， 以及为什么读的人会当场卡住。
    why_this_way: >
      **为什么是「顶层一个有序列表 + 每个想法声明自己属于哪一步」**：这是给东西分组的通行形状 （接口文档里给接口分组用的就是它 ——
      一个顶层的组定义表，加上每个条目自己声明归属）。 它让「步骤的顺序」「每步的说明」「谁属于哪一步」三件事各有各的位置，而不是挤成一团。
      **为什么不用图文件里现成的分节注释**（这是第一步里人先选的做法，调研之后否掉了）： 它今天能用 ——
      实测能切出十段、数字和图例完全对得上。但它会**静默说假话**：
      网页新建的想法是追加到列表末尾的，于是每一个从网页建出来的想法都会自动归到最后一段，
      改动记录里看不出、页面上也看不出，只是那句「这一段有几个想法」悄悄变成错的。 而我们刚刚才把网页新建想法这条路建好，这个错法从第一天起就活着。
      另外两条：注释是个口头约定 —— 两份规范里从来没提过它，新建出来的空图里也没有， 所以装到别的仓库就是一片空白；而 yaml
      那个库自己的文档说它的注释处理「并不完全稳定」。 **规矩要带得走，就不能建在一个带不走的东西上。**
      **为什么定三到七**：超过七行的概览不是概览，是目录 —— 人一眼扫不完，也就不会去扫。
      下限三是因为一两步的项目根本不需要概览。这个范围能被机器检查，所以它是规矩不是建议。
      **为什么把「筐不算步骤」明写进去**：这个仓库自己的图里就有三个这样的筐，照搬进概览，
      读的人会当场问「阅读顺序是这个项目要做的一件事吗」。这条规矩是从真实的反例里长出来的， 所以连那个反例一起写进规范 ——
      只写规矩不写反例，下一个人还会再犯一次。 **为什么两份规范都写、正文相同**：两份说得不一样，就是下一次漂移的起点，
      而这套工具已经为「三份副本各写各的」付过一次账了。
    code:
      - file: companion/FORMAT.md
      - file: archive/claude-companion/FORMAT.md
    verify:
      manual: "看着按这条规矩真生成出来的那份概览（先在本仓库的网页上看）：它说清楚这个项目分几步、每步做了什么了吗？一个从没打开过这个仓库的人读完能不能懂\
        ？看不清楚的话，指出是五条规矩里的哪一条没写好——那说明要改的是规范，不是硬凑那几句话"
      signed_off: null
    future: >
      以后再往图里加任何一种新结构，都照这个路子走：规范先定规矩，实现跟着规范。
    log:
      - date: 2026-09-01
        by: ccbuild
        note: 开始把分步概览的规矩写进两份格式规范

  - id: I-085
    name: "引擎认识分步概览，并且校验它 —— 归错步当场报出来"
    status: todo
    needs: [ I-041 ]
    what: >
      引擎认识顶层的步骤列表和每个想法的归属字段；校验命令检查这几件事： 归属指向一个不存在的步骤是错误；已经声明了步骤却有想法没归属、步数超出三到七、
      有哪一步一个想法都没有，是警告；一个完全没写步骤的图不报任何东西。 网页上新建的想法允许带归属字段。同时把本仓库现有的想法一次性归到步骤里。
    why: >
      一条没有校验的规矩只是一句建议。归错步、漏归、步数失控这几件事， 如果不在校验里当场报出来，就会变成页面上一句没有人会发现的假话 ——
      而页面上的数字看起来永远是对的，这正是它危险的地方。
    expected: >
      把一个想法归到不存在的步骤，校验报错；漏归、步数超范围、有空步，校验报警告； 一个完全没写步骤的图（比如刚建出来的空图）什么都不报。
      本仓库的想法全部归好步之后，校验零错误。
    how: >
      引擎的图结构里加两处：顶层的步骤列表，和每个想法的归属字段。 **校验分两档，故意的**：归属指向一个不存在的步骤 ——
      报**错误**（那是确定的笔误， 而且会让页面上的数字凭空少一个）；已经声明了步骤却有想法没归属、步数超出三到七、 有哪一步一个想法都没有 ——
      报**警告**；整张图完全没写步骤 —— **什么都不报**。 新建想法允许携带的字段里加上归属，否则从网页建出来的想法永远归不了步。
      再抽一个两行的小函数，数「一组想法里有几个、做完几个」，让页面的图例和分步概览 共用同一个数法。 最后把本仓库现有的想法一次性归到步骤里 ——
      这是照着刚定下的规矩做的第一个例子， 也正好检验那条规矩写得够不够清楚：写不出来，就是规矩没写明白。
    why_this_way: >
      **为什么归错步是错误、漏归只是警告**：归到一个不存在的步骤，是确定的笔误，没有第二种解释； 而「还没归」在一个刚加上这个字段的世界里是正常状态
      —— 一上来就报错， 会让每一个已经装了这套工具的仓库当场变红，那是拿别人的仓库为我们的新字段买单。
      要诚实说清楚代价：**漏归只报警告，意味着页面上那个数字会少算，而警告是会被人略过的**。
      这是一个自觉的取舍，不是没想到；等这个字段在各仓库里落稳了，再收紧成错误。
      **为什么完全没写步骤时什么都不报**：一张刚建出来的空图、或者一个还没想清楚自己分几步的
      项目，不该被工具催。规矩是给想用的人用的，不是拿来罚不用的人的。
      **为什么把「数几个、完成几个」抽成一个小函数**：页面的图例现在是把整张图的计数拍成一个
      字符串，切不开。分步概览要按步计数，如果各写各的，图例说的和概览说的迟早对不上 —— 而两处数字打架，比一处数字没有更让人不信任这张页面。
      **为什么归步这件事放在这个想法里，而不是单独一个**：它是规矩的第一个使用者。 分开做的话，规矩写完没人用过，就没人知道它是不是写清楚了。
    code:
      - file: archive/claude-companion/ideas.ts
        symbol: check
      - file: archive/claude-companion/ideas.ts
        symbol: applyChanges
      - file: ideas/graph.claude.yaml
    verify:
      command: "npx vitest run .devcompanion/tests/test_ideas_steps.test.ts"
      pass: "exit 0"
    future: >
      以后任何「图里新增一种结构」都照这个路子：规范定规矩，校验兜住它。

  - id: I-086
    name: "网页把分步概览印在标题下面，历史说明收进折叠"
    status: todo
    needs: [ I-085 ]
    what: >
      渲染网页时，在标题和图之间印出分步概览：每一步一行，显示这一步的名字、那句话， 后面跟上机器算出来的「这一步有几个想法、已经做完几个」。
      现有那段又长又密的历史说明保留，但收进一个默认折叠的区域。 图里没写步骤时，这一块整个不出现。
    why: >
      规矩和数据都有了，人还是看不见 —— 概览得印在人打开网页第一眼看到的地方。
      而现在第一眼看到的，是一段提到某个提交号、某个标签名、哪些目录被移走了的历史说明。
    expected: >
      打开网页，标题下面就是分步概览，一眼看出这个项目分几步、每步做什么、每步进行到哪儿；
      各步的想法数加起来等于图里想法的总数，完成数加起来等于图例里那个已完成数； 历史说明还在，但要点一下才展开；一张没写步骤的图上，这一块不出现。
    how: >
      在标题和图之间输出一段列表，每一步一行：名字、那句话、以及「N 个想法，做完 M 个」。 数字用引擎那个共用的小函数算，和图例同源。
      现有那段历史说明原样搬进一个折叠区域 —— 用浏览器自带的折叠元素， 页面里已经有它了（每张卡片的「修改记录」用的就是这个），不用写一行脚本，
      键盘操作、读屏器、以及用页内查找时自动展开，全都自带。 默认收起靠的是「不写那个 open 属性」，**不能写成 open="false"** ——
      那样反而是展开的。 图里没写步骤时，整块不输出（不是输出一个空框）。 两处必须绕开的坑，都是现有测试盯着的：新加的标签不能用 idea /
      mermaid / graph 这几个类名， 属性名也不能以 id 结尾 —— 已有测试靠 `id="I-0xx"`
      这样的字符串定位卡片，撞上就会误伤； 步骤的名字和那句话是新的、可能含有奇怪字符的文本，必须走现成的转义函数。
    why_this_way: >
      **为什么用浏览器自带的折叠元素而不是自己写显示隐藏**：自己写要处理点击、状态、 键盘、读屏器标注，还得自己想办法让页内查找能找到收起来的内容
      —— 而自带的那个全都有， 代价是零行脚本。这个页面本来就有一个在跑（每张卡片的修改记录）， 借它等于连样式先例一起借了。
      **为什么不做展开状态记忆**：那要动浏览器本地存储，而存储那一块现在被测试盯得很紧
      （每一次存取都必须包在错误处理里）。为一个「下次打开还是收着」的小方便去动它， 不划算。
      **为什么历史说明是搬进折叠、不是删掉**：那段话里有真实的历史（哪次提交把旧代码移走了、
      为什么编号从某处重新开始），删了就没别的地方记着了。它只是不该占第一屏。
      **为什么没写步骤时整块不输出**：一个空的框会让人以为坏了，而「什么都不显示」 清楚地表示「这张图还没写概览」。
    code:
      - file: archive/claude-companion/ideas.ts
        symbol: render
    verify:
      command: "npx vitest run .devcompanion/tests/test_render_steps.test.ts"
      pass: "exit 0"
    future: >
      这份概览也是「把图发给别人看」时对方读到的第一段话。

  - id: I-087
    name: "建图和新增想法的命令，照规范写出并维护那份分步概览"
    status: todo
    needs: [ I-041 ]
    what: >
      第一次给一个陌生仓库建图的那条命令，按规范里那一节写出分步概览，并给每个想法归步；
      新增想法的那条命令，给新想法指定归属，必要时新增一步并说明为什么要多一步。
    why: >
      规矩写在规范里，但真正动手写图的是这几条命令。命令不照着做， 规范就只是一份没人读的文件，陌生仓库里的图仍然没有概览 ——
      而「装到别的仓库也能得到同样的东西」正是这件事的全部意义。
    expected: >
      在一个陌生仓库跑一次建图，产出的图带着一份合格的分步概览、每个想法都有归属；
      再跑一次新增想法，新想法有归属，而且如果它开启了一个新阶段，命令会说明为什么多这一步。
    how: >
      改两个命令的说明文字。**建图那条**：在「读完项目、抽出想法」和「画出边」之间加一步 ——
      先写这份分步概览，再让每个想法认领一步；说明里直接引规范那一节，不重抄规矩 （抄一遍就等于又造了一份会漂移的副本），只补一句这条命令特有的话：
      步骤是从刚读完的这个项目里看出来的，不是从别的仓库抄的。 **新增想法那条**：在「填完前三个问题」之后加一步 —— 给这个想法认领一步；
      如果它不属于现有任何一步，就新增一步，并且**必须说明为什么这个项目多了一个阶段**， 因为步数有上限，加一步是要占名额的。
      两条命令都提醒：概览超过七步就该合并，而不是继续往下加。
    why_this_way: >
      **为什么改的是命令的说明文字，而不是往引擎里塞逻辑**：这份概览是要动脑子写的东西 ——
      判断一个项目分几步、每步一句人话怎么说，这件事机器做不了，只能由读完项目的那一方来做。 引擎能做的是校验（那是上一个想法的事），能写的只有说明。
      **为什么引规范而不是把规矩抄进命令**：这套工具已经为「同一件事在三个地方各写一份」 付过一次账了 ——
      抄进来的那一份迟早和规范不一样，而且没人知道哪份算数。 **为什么加一步要说明理由**：三到七步是个硬上限，没有理由的新增会让概览一路膨胀到
      变成目录 —— 而目录正是这条规矩要防的东西。让加步这件事需要开口解释， 是最便宜的刹车。 **为什么这条只能人工验证**：改的是给 agent
      读的提示词，不是代码。机器可以断言那几行字 在文件里，但断言不了「照着做了」—— 那种测试看着绿，实际什么也没保证。
      真验证只有一个：在一个陌生仓库真跑一遍建图，看产出的图带不带一份合格的概览。
    code:
      - file: archive/claude-companion/commands/ccscan.md
      - file: archive/claude-companion/commands/ccthink.md
    verify:
      manual: "在一个不是本仓库的真实项目上跑一遍建图，看产出的图带着三到七步的概览、每个想法都有归属、每句话不含缩写也不含要读过那个仓库才懂的词；再跑一次\
        新增想法，看新想法有没有认领步骤"
      signed_off: null
    future: >
      装到别的仓库之后，那边第一次建图就自带一份属于它自己的概览，不用任何人教。

  - id: I-083
    name: "图下面一个能收起的索引：列出所有等着人工验收签字的想法"
    status: done
    needs: [ I-045 ]
    what: >
      图的下面加一个默认收起的区域，点一下展开，列出所有「如何验证」是人工检查、 但签字栏还空着的想法。每一行显示想法的名字，和那条人工检查的原文；
      点一行就跳到对应的想法卡片。
    why: >
      现在有十二个想法等着人签字，散在四十多张卡片里。网页上刚做好的签字功能， 卡在「找不到该签哪几条」这一步 ——
      人得自己一张一张翻过去，找哪张卡片的签字栏是空的。
    expected: >
      打开网页，图下面有一个收起的区域，上面写着现在有几条等着签字；点开列出每一条的名字， 以及它要人去看的那件事；点任意一行，页面跳到那个想法的卡片。
      图里没有等签字的想法时，这个区域根本不出现 —— 空列表比不出现更让人以为是坏了。
    how: >
      在图的下面、详情卡片的上面，输出一个默认收起的折叠区域，标题上带着条数。 **判断条件用页面上签字按钮已经在用的那一个**，一个字都不改：
      「没有可自动运行的验证命令，并且签字栏是空的」。 这一条要特别写明白，因为它和这个想法原来的说法不是一回事 ——
      原文写的是「验证是人工检查、且签字栏为空」，而按钮实际用的判断里**没有**
      「必须是人工检查」这一条。两者在今天这张图上恰好都是十二条，但它们是不同的集合：
      一个既有命令又有人工说明的想法，按原文该列出来、而它的卡片上没有按钮。 两处必须是同一个判断，否则索引会指向一张没有按钮可点的卡片。
      每一行是一个指向卡片的链接（想法名字），后面跟那条人工检查的原文。
      **链接必须带上真正的锚点地址**，不能只靠脚本跳转：那个平滑滚动的函数住在需要联网 取画图库的模块里，双击打开又没网的时候整个模块不执行 ——
      锚点才是唯一在四种情况下 都管用的那条路，脚本只是锦上添花。 **行里绝不能带签字按钮的那个标记**：现有的签字测试用那个标记定位元素，
      多一个就会静默劫持五处断言。索引只负责带人过去，签字仍然在卡片上。 条数为零时整块不输出。
    why_this_way: >
      **为什么复用签字按钮的判断而不是按原文写**：两处判断不一致，就会出现「索引说这条要签，
      点过去卡片上没有按钮」——而人会以为是页面坏了，不会想到是两个判断不一样。 调研实测两者今天都命中十二条，正因为凑巧一致，分歧才更容易被漏掉。
      **为什么每行必须带锚点地址**：调研查出来的 —— 跳转函数和画图库在同一个模块里，
      那个模块第一句就是从网上取画图库。双击打开的页面没网时它整个不执行，
      于是所有需要脚本的跳转全部失效。带着锚点，浏览器自己就能跳，只是没有平滑滚动和高亮。
      这也是为什么不自己写一套跳转：现成的那套在能用的时候更好，在不能用的时候有兜底。
      **为什么不在索引行上直接放签字按钮**（第一反应会想这么做，能少一次跳转）：
      现有的签字测试有五处用那个标记去找元素，索引在卡片上面，多出来的那个会先被找到， 于是五条断言全部在测另一个东西 ——
      而且它们仍然是绿的。这类「测试还绿着但测的 已经不是原来那个东西」的改动，比测试变红危险得多。
      **为什么零条时整块不出现**：一个写着「（0）」的空框会让人点进去看，然后发现什么都没有； 而这一块不在，本身就说明没有待办。
    code:
      - file: archive/claude-companion/ideas.ts
        symbol: render
        lines: "1020-1050,1176-1184,1246-1248"
    verify:
      command: "npx vitest run .devcompanion/tests/test_render_worklist.test.ts"
      pass: "exit 0"
    future: >
      以后任何「该由人动手的事」都可以在图下面挂一个同样的索引，人不用再翻卡片找。
    log:

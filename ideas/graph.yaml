  - id: I-081
    name: "在网页上给人工验证签字，签的是人自己打的那句话"
    status: done
    needs: [ I-064, I-065 ]
    what: >
      改动记录里加第七种操作：签字。网页上，凡是「如何验证」写的是人工检查、 而且还没签过字的想法，卡片上多一个签字入口 ——
      点开先把那条人工检查的原文显示出来， 下面填自己的名字和自己的一句话。写回时落成和现在手工录入完全一样的格式。
    why: >
      图上现在有 12 个想法的最后一步是人工验证，而人工验证只能由人签字才算数。 没有这个入口，每签一次都要人绕出网页、口头告诉 agent、再由
      agent 代录 —— 这堵墙会一直撞。而「改图即改项目」这条链承诺的是全程不碰 YAML， 签字是这条链上唯一还没接上的一环。
    expected: >
      打开网页，找到一个人工验证还没签字的想法，点签字，看得见那条人工检查的原文，
      填上名字和自己的一句话，提交并确认之后，图里那个想法的签字栏就是你写的那句话；
      随后把它标成完成不再被拒。三种情况签不了：验证不是人工的、话是空的、已经签过了。
    how: >
      信封加第七种操作 `{op:"sign", id, who, words}`，走同一个信封、同一个写回核心， 和别的改动一样进账本、一样走「提交 →
      看逐条 → 确认」两步。 写回时落成 `<名字> <日期> —— 人的原话：「<原话>」；在网页上签的`， 和现在手工录入的格式一致。
      引擎拒绝三种情况：那个想法的验证不是人工检查、`words` 去掉空白之后是空的、 签字栏已经有值（改签是另一件要说明白的事，本轮不猜，先拒绝）。
      页面上只有「验证是人工的且签字栏为空」的卡片才出现这个入口；点开之后
      **先把那条人工检查的原文显示出来**，再是两个输入框；名字存进浏览器本地存储， 只用填一次。
    why_this_way: >
      为什么是「打一句话」而不是「点一下确认」：一个复选框留下的只有「有人点过」， 一句话留下的是这个人对这件具体事情的判断。人工验证之所以要人签，
      正是因为机器判断不了；只留下点击痕迹，等于把这条规矩掏空成一个仪式。 为什么签字前必须把人工检查的原文显示出来：签的是一件具体的事，不是一张空白纸。
      要人翻到别处去找那句话才能签，和随手点「我同意」没有区别。 为什么落成和手工录入一样的格式：图里已经有几条签字是 agent 代录的，
      新旧两种格式并存，会让以后读记录的人以为它们是两回事。 **为什么这不削弱现有的保证** —— 这一条必须写清楚，免得以后把网页签字当成罪魁祸首：
      守卫拦「手改图」的那条规则只比较状态，`signed_off` 根本不在它的保护范围里， agent 今天直接编辑 yaml
      就能把签字写进去。所以这个入口没有拆掉任何一道门， 那道门本来就没关。真正要堵它的是 I-066，还没做；在它做完之前，
      签字的分量靠的是约定而不是机器，这一点如实记在这里。 **还有一条更硬的话必须写下来：共同基座的 D27 已经裁过这件事，而这个做法和它相左。**
      D27 说「人工验证只能通过 manual-check challenge，把签字摘要写回图并保存回执； 直接编辑已有签字被拒绝」，理由是「一个
      agent 能编辑的签名不能证明人看过结果」。 网页签字产出的正是那种签名 —— agent 可以自己造一份带 sign 的改动文件跑写回。
      它不比现状更糟（今天直接编辑 yaml 就能写签字），但它朝 D27 定的方向走反了一步； 换来的是人不必每签一次就绕出网页找 agent
      代录，而图上有 12 个想法正卡在这一步。 和解的办法 D27 里已经写好了：把网页这一步降级成「提出签字请求」，
      真正落进图的那一下仍然由不可复用的用户响应触发 —— 那是 I-066 的事。 在它做完之前，这条路是一笔明知故欠的账，已经同时记进 D27
      的裁决表， 免得以后被当成已经解决了。 为什么不做覆盖已有签字：谁能在什么情况下推翻另一个人的签字，是一件要先想清楚的事， 本轮不猜。

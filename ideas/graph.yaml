  - id: I-093
    name: "一份三家共用的规则核心：事件进来，判成允许或拒绝出去，理由让人读得懂"
    status: done
    needs: [ I-089, I-090, I-091 ]
    what: >
      守卫的判断逻辑只写一份：输入是归一化后的事件（哪个事件、哪个工具、要动哪些
      文件、人说了什么），输出是允许或拒绝加一句理由。规则包括：没有想法认领的文件
      默认不许写；想法没就绪不许写；没批准不许写；没有失败测试记录不许写实现；程序 保管的证据文件谁都不许直接写；shell
      命令里的写文件招数（重定向、就地替换、用 解释器一行写文件）同样拦；看不出要写哪儿的写操作直接拒；会话结束前图必须校验
      通过。写前和批准环节崩溃就拦下，写后记录崩溃只警告不拦（裁决表 D9）； AIDEV_GUARD=off 是唯一逃生口，用了会大声警告并记录。
    why: >
      三套守卫各有独门强项也各有致命短板：Claude 版全面「崩了就放行」，Cursor 版没有 批准和测试先行，Codex 版看不见 MCP
      工具的写入。规则只写一份，修一处三家同时 生效，才配叫共同基座。
    expected: >
      每条规则都有测试逐条对应：越界写、未批准、无失败记录、shell 旁路、未知目标，
      全部被拒且理由说人话；写后记录失败不阻断已完成的写；三家现有测试表达的保证在 共同规则下全部还原。
    how: >
      companion/guard.ts 里一个纯函数 decide(归一化事件, 图, 证据)，按序执行规则 表：程序保管的证据文件和生成文件只许
      CLI 改；图和日志可编辑，但和旧图比对 发现 status 或 signed_off 字段被直接改动就拒绝（堵 Cursor 版「agent
      自己改 账本解锁」的洞）；产品路径必须命中某个就绪 doing 想法的 code 或
      test_files，否则默认拒绝；再查批准回执（I-090）和失败测试证据（I-091）； shell 命令过三层正则（照
      codex-companion 移植：重定向、就地替换、解释器 一行流、包管理器）；看不出写哪儿的写操作直接拒；Stop 时跑 check。写前、
      批准、Stop 的 catch 里返回拒绝，写后记录的 catch 里只警告不拦（D9）； AIDEV_GUARD=off
      放行一切但每次醒目警告并尽力记一笔。
    why_this_way: >
      与其修补三份守卫，不如把规则写成一个纯函数，fixture 直接喂归一化事件 —— 网上最接近的先例 Probity（一个 TypeScript
      程序服务 Claude/Codex/Copilot 三家）就是这个架构，证明可行。拒绝顺序先查保护文件再查认领，因为 agent
      最常见的越界是先动证据；崩溃方向按事件分（写前拦、写后放）是三家现状里 Codex 混合模型胜出：Claude
      全放行会漏不可逆的越界写，Cursor 全拦会因 记录器的 bug 让全仓库停工。
    code:

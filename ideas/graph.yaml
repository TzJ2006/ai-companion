  - id: I-060
    name: "把想法按依赖顺序排列：前置的永远排在前面"
    status: done
    needs: [ I-042 ]
    what: >
      给定一张图，返回按拓扑序排好的想法列表：每个想法都排在它全部前置之后； 同一层内按 id
      排（拓扑序不唯一，需要一条固定的规则来保证每次输出同样的顺序）； 图有环或有指向不存在 id 的边时，不死循环、不丢任何节点。
    why: >
      现在「从上往下读就是依赖顺序」只是巧合 —— 这张图是一次性自底向上建出来的。 /ccthink 每次把新想法追加到文件末尾，这个巧合就会失效。
    expected: >
      给一个前置写在后面的图，返回的列表里每个想法仍排在它全部前置之后； 同样的输入永远给出同样的输出；有环的图不会让它卡住或吞掉节点。
    how: >
      在图查询那一区新增一个独立函数 topoOrder，用 Kahn 算法： 先按 needs 数出每个想法的入度，指向不存在 id
      的边直接跳过（沿用这个文件里已有的约定 —— 悬空的边静默忽略，由 check 去报错）； 然后按层推进：把当前入度为零的一整批取出来，按 id
      排好一起输出，再把它们解锁的节点 作为下一层，如此往复。这是「同一层内按 id 排」的字面意思 —— 深度在前、id 在后，
      既不是先进先出的队列，也不是每步只取一个最小的贪心（那两种都会把某个第二层的想法 排到还没输出的第一层想法前面）。
      走完之后，把入度仍然大于零的节点（也就是环里的那些）按 id 排好接在末尾，一个都不丢。
      三种顺序长得很像，一个三节点直链的夹具分不开它们，所以测试必须用下面这两个小图 （我把三种写法都跑过，数字是实际输出，不是推测）： 一、I-002
      需要 I-001，I-004 需要 I-003 —— 按层和先进先出都给 I-001, I-003, I-002, I-004，而每步取最小给
      I-001, I-002, I-003, I-004。这个夹具抓「每步取最小」。 二、I-003 需要 I-002，I-004 需要 I-001
      —— 按层给 I-001, I-002, I-003, I-004， 而先进先出给 I-001, I-002, I-004,
      I-003。这个夹具抓「照抄 codex」。 两个都要，只有一个就会放过另一种错实现。 返回的是想法对象本身、按数组下标取，不经过 id
      查找表：查找表对重复 id 只留最后一个， 而命令行的 render 从不先跑 check，重复 id 会让一张卡片凭空消失。 不动现有的
      findCycle。
    why_this_way: >
      这个算法不用自己想 —— 这个仓库的 Python 版本里已经有一份，连两条契约都定好了：
      悬空的边跳过而不是报错，环里的节点当数据返回而不是抛异常。借它的形状， 但必须换掉它的队列：它用的是先进先出（只在初始种子和每次展开时排序），
      而那既不是「同一层内按 id 排」，也不是「每步取最小」—— 三种顺序互不相同， 照抄会给出第三种。分开按层和先进先出要用 how
      里的第二个夹具：I-003 需要 I-002、 I-004 需要 I-001 —— 按层给 I-001, I-002, I-003,
      I-004，先进先出给 I-001, I-002, I-004, I-003。 （之前这里写的反例是错的，已作废：「四个想法 A B C
      D，唯一的边是 C 需要 A，先进先出给出 A B D C」—— 按层给的也是 A B D C，这个夹具只能抓住「每步取最小」，分不开先进先出。
      三种顺序我逐个手推过，写在这里免得下一个人再被它误导。） 这一条是 expected 明确要求的，所以必须自己决定并写清楚。
      选按层，理由是它的唯一消费者 I-061 要的就是这个： 「卡片从没有前置的地基一路排到终点」—— 先把所有没有前置的读完，再读建立在它们之上的。
      每步取最小做不到这一点：它会在某个第一层的想法还没输出时， 先输出一个 id 更小的第二层想法。这三种顺序的分歧要记进 FORMAT.md
      的分歧裁决表， 因为 codex 那边已经在跑另一种了。 为什么不并进 findCycle：它在遇到第一个环时就 break 掉整个遍历，
      合并会返回一个被截断的顺序、丢掉节点 —— 而「不丢节点」正是 expected 禁止违反的那条。 而且两者要的返回值不同：check
      打印的是环的路径（只有深度优先能给出）， 拓扑序要的是完整顺序。findCycle 还是别人（I-042）已经完成的代码。
      为什么不用现成的排序库：这个引擎把零依赖写成了设计前提； 而且现成的库都不给这里真正需要的两件事 —— 按 id
      决定同层顺序、把环里的节点当数据返回， 装回来还得再包一层。 要顺带回答一个明显的反问：I-043 当初写过「不做拓扑排序」。那条裁决没有被推翻
      —— frontier 回答的是状态问题（现在能开工的是哪些），topoOrder 回答的是结构问题 （这张图该按什么顺序读）。两者互不包含，而且
      topoOrder 绝不能变得知道状态， frontier 也不该改成建立在它之上。 已知边界：「按 id 排」是按字符排的。现在的 id
      是补零的三位数，字符顺序正好等于数字顺序； 一个用一位数和两位数混排 id 的项目会排反。用普通的排序（和这个文件里另外两处一致），
      不用跟语言环境相关的比较 —— 那会让同样的输入在不同机器上给出不同的输出。
    code:
      - file: archive/claude-companion/ideas.ts
        symbol: topoOrder
        lines: "157-213"
    verify:
      command: "npx vitest run .devcompanion/tests/test_ideas_toposort.test.ts"
      pass: "exit 0"
    future: >
      任何需要「按依赖顺序走一遍」的地方都可以用它 —— 渲染只是第一个消费者。
    log:
      - date: 2026-08-31
        by: ccbuild
        note: 开始实现 topoOrder：先写 test_ideas_toposort.test.ts 并确认它红
      - date: 2026-08-31
        by: ccbuild
        note: 新增 topoOrder（分层 Kahn，层内按 id 排、悬空边跳过、环里的节点按 id 接在末尾、按下标取不经 id
          查找表）；test_ideas_toposort.test.ts 9 个测试，含两个能分开「每步取最小」和「先进先出」的夹具，先红后绿

  - id: I-061
    name: "网页里的详情卡片按依赖顺序显示，而不是按书写顺序"
    status: todo
    needs: [ I-060, I-045 ]
    what: >
      render() 输出下方详情卡片时用拓扑序，而不是 yaml 里的书写顺序。 id 不动，yaml 源文件也不动 —— 只有渲染出来的网页变。
    why: >
      人读的是网页。顺序不对，读者得自己在脑子里追每个 needs 才知道该先看哪个。
    expected: >
      打开 graph.html，没有前置的地基排在最前，每张卡片都排在它全部前置之后； 把 yaml 里想法的书写顺序打乱重渲染，卡片顺序不变。
    how: >
      只改一处：生成网页时输出详情卡片的那一行，把「按书写顺序遍历」换成「按 topoOrder 排好再遍历」。 topoOrder 是 I-060
      已经建好的函数，至今一个生产调用者都没有 —— 全仓库只有它自己的测试在用它，
      这个想法就是它的第一个消费者，所以不用再写任何排序逻辑，顺序也不用再定 （I-060 已经为这个消费者选定了「按层、层内按 id」）。
      必须不动的三样，每一样都有具体理由。一、上面那张流程图：它的节点声明顺序来自共用的画图函数，
      而现有测试断言「页面里画出来的那张图逐字等于那个函数算出来的」；动它就是动已经定下来的画面，
      而且布局引擎的结果跟节点声明顺序有关，图会无缘无故换个样子。 二、嵌进页面的 JSON 数据模型：I-062 定的是「JSON
      是页面唯一的数据模型，DOM 只是它的视图」， 卡片顺序是视图的事，不该反过来动模型；更实际的原因是页面每次改结构都照着这份 JSON 的顺序
      重算流程图源码，JSON 一旦重排而初始那张图没重排，人第一次断开一条前置，整张图就会因为
      声明顺序变了而重新布局、当场跳一下。三、锚点和跳转：卡片的 id、链接、点击跳转全是按 id 找元素， 与顺序无关，换序之后点节点仍然跳得到 ——
      这一点要在测试里钉住，不能只靠推理。 顺带在「想法详情」标题下加一句给人看的说明：卡片按依赖顺序排列，不是文件里的书写顺序， 否则读者对着和
      yaml 不一样的顺序会以为渲染错了。
    why_this_way: >
      比较过四种做法。按 id 排：id 是按写下来的先后发的号，所以按 id 排基本等于按书写顺序排，
      正是这条想法要治的毛病；而且它直接违背「未来怎么用」那一句 —— 新想法的 id 永远最大，只会排在最后。
      按状态排（已完成的在前、待办的在后）：那回答的是「现在能开工的是哪些」，而 frontier 已经在回答 这个问题；I-043
      当初裁过一次、I-060 又重申过：状态问题和结构问题是两件事，读图的顺序是结构问题。
      何况按状态排会把一条依赖链拆散到四段里，读者要追的前置反而更多。 直接把 yaml
      里的想法重排、让文件顺序等于依赖顺序：「是什么」里明说源文件不动，而且这条路踩两个 硬约束 ——
      批准绑在图内容的哈希上，重排文件就是改内容，人刚批准的图当场作废；网页提交时的过期
      检查用的也是同一个指纹。为了排版去动一份刚被签过字的文件，代价和风险都不成比例。 在浏览器里用脚本重排：等于把拓扑排序在页面里再写一遍，而

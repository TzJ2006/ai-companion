    status: done
    needs: [ I-076, I-077 ]
    what: >
      在网页上新建想法（页面先给一个临时号，真编号由引擎发）、删除想法、 在两个想法之间加上或去掉「前置」箭头；新建的想法至少要填够前三个问题
      （是什么、为什么、预期结果）才算成形。
    why: >
      人审图最常见的两个结论是「缺一条边」和「这个节点做了太多事、该拆开」。 只能改文字不能改结构的话，这两类最有价值的修改仍然要绕回 YAML 文件。
    expected: >
      网页上加一个节点、连一条边、删一条边，图立即重画出新形状； 新想法的编号不和历史上任何编号冲突（编号永不复用）。
      画图要联网取一个第三方库，所以还要说清楚断网时会怎样：图画不出来，但增删和提交照常能用， 并且页面明说图暂时不可用 —— 不能变成满屏的流程图源码。
    how: >
      四件事，都落在生成网页的那个函数里。 **前置箭头**：每张卡片的「前置想法」从只读链接变成可编辑 —— 一个下拉框选一个已有想法连上去，
      每条已连的箭头旁边一个叉号断开。每次操作往账本追加一条「连」或「断」，写的是「从哪个到哪个」， 不是整个前置列表的新值。
      **新建**：一个「新建想法」按钮，出一张空卡片，编号先给临时号；前三问（是什么、为什么、预期结果） 填不齐就不让它进入提交。
      **删除**：卡片上一个「删除」按钮，做成「标记待删」，可以反悔，提交的时候才变成一条删除操作。
      **重画**：结构一变就调共用的那份画图函数重新算出图源，然后建一个全新的图元素替换掉旧的 ——
      画图库会在处理过的元素上盖章，原地改文字不会重画。文字一律用 textContent 赋值。
      重画要保留人当前的缩放和平移，不能每改一下就把视角重置回全图。
      跨模块这一段要动两处：把编辑那段脚本挪到画图那段前面（现在是反着的，等于让编辑排在一次跨网
      取模块后面才初始化）；画图那段在自己的依赖加载完之后往外挂一个重画函数，照抄现在那个 「点击节点跳到卡片」的做法 ——
      那是今天两段脚本之间唯一的桥。编辑那段只做特性探测，绝不等待。
      **断网**：探测不到重画函数时，增删和提交照常工作，页面明说「图暂时不可用（离线）」， 并且要把原始的图源文本藏起来 ——
      现在画图一失败，读者看到的是满屏的流程图源码。 卡片上的前置链接仍然可点，因为它们本来就是真的锚点链接。
    why_this_way: >
      编号为什么只发临时号：真编号必须由写回时统一发放，理由写在取号计数器那个想法里，这里只是用它。 好处是这个想法不必等格式规范定稿就能开工。
      边为什么记成「连/断」一对而不是整列表的新值：账本那个想法已经裁决过， 同一个想法上的两处边改动不能互相覆盖。
      为什么要把编辑脚本挪到前面：实测现在编辑那段排在画图那段后面，而画图那段头一件事就是从 CDN 取模块、而且用了顶层等待 ——
      也就是说今天的编辑功能，是排在一次跨网请求后面才初始化的。 挪一下位置零成本，收益是断网时编辑立刻可用。
      为什么用一个全局函数当桥，而不是事件总线或者共享模块：桥今天就已经有一个了（点击节点跳到卡片），
      再挂一个可以特性探测的函数，比引入一套事件机制短，也比在 file:// 下再引一个模块少一种失败方式。
      为什么重画必须建新元素：画图库会在处理过的元素上盖章，原地改不生效 —— 这是那种会让人以为「重画没触发」而跑去乱改别处的坑。
      为什么保留缩放和平移：人正盯着图的某个角落改东西，每次重画都跳回全图，这个功能就没法用。 为什么断网要藏源码：这是现状就有的缺陷（画图失败 =
      满屏源码），加了重画之后会被更频繁地撞见， 顺手修掉比单开一个想法便宜。 为什么节点和边不再拆成两个想法：它们用的是同一套机器 ——
      同一本账、同一条重画通路、同一份共用 函数，拆开会得到两个几乎一样的节点和两份几乎一样的测试。拆分的收益是「能各自验证」，
      而这里同一个测试文件里的两组断言就能各自验证。

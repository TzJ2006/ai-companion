  - id: I-055
    name: "修复扫描清单被多个进程同时写入时会丢记录的问题"
    status: done
    needs: [ I-046 ]
    what: >
      让 strike() 在多个 hook 进程同时划掉文件时不丢写、不写坏文件。
    why: >
      本次 /ccscan 亲眼撞上了：同一轮里并行 Read 五个文件，hook 也就并行跑了五个 guard 进程，各自 readWorklist →
      filter → writeFileSync。后写的覆盖先写的， log 里留下证据（「读 .gitignore (还剩 32)」紧接着「读
      package.json (还剩 32)」， 数字没降），并且清单里被写进了一行残缺内容 `n`。 结果是：文件真的读了，账本却说没读 —— R7
      报出的数字反而不准了。
    expected: >
      并行 Read N 个文件之后，清单恰好少 N 行，且不出现任何不是文件路径的行。
    how: >
      让 strike 不再重写清单，改成只追加，race 就不存在了。 .scan-todo 变成只写一次的清单（由 scan
      生成，那是真的单进程）；新增只追加的 .scan-done， strike 用 appendFileSync
      追加一行就结束，不读、不改、不重写任何东西； 「还剩哪些」变成「清单减去已读」的集合差，所以重复追加无害，撕裂的半行也只是匹配不上任何东西。
      追加必须是一次 write 调用（传一个拼好的整串，不用 WriteStream、不分多次），否则原子性不成立。 strike 的返回值从
      true/false 改成它自己那次快照里的剩余数， 好让 guard 记日志时不必再读第二次 —— 否则「两条连着都写还剩
      7」这个症状会在修好之后依然出现。 返回值的契约必须能分开两件事，否则会静默改坏 R7：不在清单里、或者根本没有扫描在跑，返回 -1；
      真的划掉了，就返回这次快照的剩余数（可以是 0）。裸的数字做不到 —— 「不在清单里」和 「划掉了还剩 0」都会是 0，而 guard.ts
      现在正按真假值分支（`if (!struck) return OK`）， 现存的两个绿测试恰好分别压着这两个方向：一个断言没有清单时不记日志，
      一个断言划到最后一个时要记「扫描还剩 0」。 save 的固定临时文件名 ${file}.tmp 换成带进程号和随机后缀的名字（照抄 codex
      的写法）， 并给 rename 加上 EPERM/EBUSY/EACCES 重试：Windows 上覆盖已存在文件的 rename 并不可靠。
      .scan-done 必须同时加进 guard 的写保护名单和 ideas/.gitignore， 否则 agent
      可以自己写一份「我读过了」，而那正是 R7 存在的全部理由。 最后，scan 做一次性迁移：清单 = 现在的项目文件列表，已读 =
      清单减去旧的剩余， 并且已读要和清单对账、凡不是清单里已知路径的一律丢掉 —— 现在卡在清单里的那行残缺内容 `n` 因此自动消失。
    why_this_way: >
      原来写的「对齐 save 的临时文件 + rename」只是半个修复，而这个仓库当场就有反证： rename
      让「写」变成原子的，但它不串行化「读」。strike 先读、后写，另一个进程在这中间已经
      读走了旧列表，于是它写回去的时候会把别人的成果抹掉。证据就在 ideas/log.claude.md 第 301 和 302 行 ——
      两行都写「扫描还剩 7」，而那个据说被划掉的文件至今还是清单的第一行。 codex 那边的 command_reviewed
      是同一个错误的更高级版本：它用了正确的原子写， 但仍然是「读—改—写」，仍然丢写。三套实现里最完善的那套也栽在这里。
      改成只追加就把两个症状一起消解掉：操作系统给每次追加定位，N 个并发进程产生 N 条完整记录，
      不需要锁、不需要重试、不需要等待、不需要任何新依赖。Windows 上同样成立： 底层库给追加模式加的是 FILE_APPEND_DATA，正是
      POSIX 那套语义的 Windows 对应物。 这里要说清楚证据的边界，免得把话说满：guard 记日志用的就是追加，而
      log.claude.md 里 真正能证明「同时写」的时刻只有三处（剩余数 32 出现三次、19 两次、7 两次），
      其余上百行是先后写的，证明不了并发。所以真正的保证不是「我们试过很多次都没坏」，
      而是「文件长度的增长是原子的，内容不交错的上限是磁盘扇区大小（512B 到 4KB），
      而我们每条记录是一条几十字节的路径」。实现的第一步就是把这件事测出来 —— 先写那个并发测试，对着现在的代码跑一遍确认它真的红，再动实现。
      另外记一条被考虑过、本轮不采纳的更彻底的做法：Claude Code 有一个 PostToolBatch 事件，
      在一整批并行工具调用全部结束之后只触发一次。把划掉动作挪到那里，就只有一个进程在写，
      并发从源头消失，比任何并发安全的写法都简单。不采纳的原因是它要改安装器去注册一个新事件、 依赖较新的版本，而且它改变的是 R7
      本身的语义（按批划掉而不是按每次 Read 划掉）， 那是 FORMAT.md 该裁决的事，不是一个 bug 修复该顺手做的。
      只追加的做法与它不冲突：无论由哪个事件触发，写法都是安全的，而且它对子 agent 带来的 不封顶的并发数同样成立。
      不用锁：大约三十行代码换来三种新的失败方式，而且过期锁是长期成本不是边缘情况 —— hook
      进程会被外层杀掉，锁比进程活得久。守卫按设计必须「出错就放行」， 所以每条锁路径都得有「超时就放弃划掉」的分支，那等于把少计重新引回来， 而少计正是
      R7 要消灭的东西。Node 也没有内建的文件锁可退。 不引第三方包：这个引擎把「装到别的仓库不需要装任何东西」写成了设计前提， 而守卫是每次
      Read 都新起一个进程，每个依赖都要在每一次工具调用上付一次钱。 更直接的是，那些原子写包只在单个进程内部串行化写，而这里的五个写者在五个进程里，
      它们解决的根本不是这个问题；锁包则已经多年没有维护，并且在 Windows 上有记录在案的失败循环。 共同基座的 D30
      已经判过这条分歧：所有生成状态原子写，append log 用进程锁或单次原子追加。 已知边界，写在这里免得以后被当成
      bug：追加的原子性在网络盘上不成立， 本地磁盘且单行远小于一个扇区时才是安全的 —— 这里存的是文件路径，远远够。
    code:
      - file: archive/claude-companion/ideas.ts
        symbol: strike
        lines: "359-381"
      - file: archive/claude-companion/ideas.ts
        symbol: doneFile
        lines: "312-329"
      - file: archive/claude-companion/ideas.ts
        symbol: readWorklist
        lines: "331-335"
      - file: archive/claude-companion/ideas.ts
        symbol: writeWorklist
        lines: "337-343"
      - file: archive/claude-companion/ideas.ts
        symbol: save
        lines: "95-121"
      - file: archive/claude-companion/guard.ts
        symbol: ruleRecord
        lines: "289-303"
      - file: archive/claude-companion/guard.ts
        symbol: decide
        lines: "177-190"
      - file: ideas/.gitignore
    verify:
      command: "npx vitest run .devcompanion/tests/test_ideas_scan_concurrency.test.ts"
      pass: "exit 0"
    future: >
      R7 的数字只有在这条修好之后才真的是「事实而不是估计」。

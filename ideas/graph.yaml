    how: >
      手工删掉 .claude/settings.json 里那两个挂着 packages/hook/dist 的 hook 分组对象，
      本轮不做卸载功能。两个事件的数组都不会因此变空，所以不需要任何清理空对象的逻辑。 删完之后要保持安装器生成的那种形状（两个空格缩进、结尾一个换行），
      否则下次跑安装器会凭空产生一次整文件的改动。 同时补一条回归测试：把 settings.json 里每条 hook 命令中看起来是脚本的那个词
      （结尾是 .js/.ts/.mjs/.cjs/.py，去掉引号，相对路径按项目根解析）取出来，
      断言它指向的文件真实存在。这条测试现在就是红的，删完变绿。 再补一条断言：四个事件（PreToolUse / PostToolUse / Stop
      / UserPromptSubmit）各自至少还留着 一条命令里含 guard.ts 的 hook。少了这条，把守卫整段删掉也能让第一条断言变绿
      —— 一个「删干净就通过」的测试，正好奖励了这条想法最不该引发的那种失败。
    why_this_way: >
      先说为什么是「删」而不是「关掉」：Claude Code 没有关闭单条 hook 的开关， 唯一的开关会把所有 hook 一起关掉、包括守卫自己；而
      settings.local.json 里的 hook 是叠加合并的， 没有「否定掉上一层某一条」的写法。所以删除是唯一不会误伤守卫的做法。
      再说为什么不顺手做一个卸载功能：共同基座的 D14 已经裁决过 install.ts 的职责范围 ——
      本地开发、旧安装迁移、以及查看和刷新已安装仓库；正式的分发和卸载走各家 agent 自己的
      插件层。现在做一个卸载子命令，等于建一个共同基座明确决定不拥有的东西。 这个仓库的历史里其实有过一个卸载脚本（在 ca7e956
      的父提交里），它的做法是按命令里的 特征子串筛掉自己的条目、再把空掉的分组一起去掉 —— 这也正是整个生态的通行解法。
      但它依赖另一种注册表格式和几个已经不存在的文件，整份搬回来就是被否掉的那种扩范围。 真要做的时候，它是 installHooks
      里那四行过滤逻辑的十几行反转，不是新东西。 最后，为什么是人读一遍的手删而不是再造一个机制：ca7e956 的提交信息白纸黑字写着
      「顺带删掉了归档动作打断的引用：指向 packages/hook/dist 的 hook」， 而那次提交对 settings.json
      的改动只是把这两条从单行重排成了缩进 JSON，一条都没删。 原因就是 installHooks
      的过滤器只认自己那条命令的名字，结构上就删不掉别人的。 这个文件已经被一次「看起来成功了」的自动修复糊弄过一次了，不该再来第二次。
      还有一条要写明的风险：这是 agent 在修改「决定 agent 是否受管」的那个文件。 Cursor 那套规范直接禁止这件事（它把 hook
      配置列为锁定文件，理由就是不许 agent 卸掉自己的约束）， 而共同基座的 D24 没有把 hook
      配置放进保护名单。缓解手段就是人读一遍改动再提交。
    code:
      - file: .claude/settings.json
        symbol: hooks
        lines: "21-64"
    verify:
      command: "npx vitest run .devcompanion/tests/test_settings_hooks.test.ts"
      pass: "exit 0"
    future: >
      有了卸载路径，这套东西装进别人的仓库才算真的可逆。
    log:
      - date: 2026-08-31
        by: ccbuild
        note: 删掉两条指向已删除的 packages/hook/dist 的 hook；新增 test_settings_hooks.test.ts（3
          个断言：脚本文件必须存在、四个事件各留一条 guard.ts hook），先红后绿


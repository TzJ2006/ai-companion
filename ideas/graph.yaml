        symbol: buildMermaidSource
        lines: "516-583"
      - file: archive/claude-companion/ideas.ts
        symbol: render
        lines: "591,740"
    verify:
      command: "npx vitest run .devcompanion/tests/test_mermaid_source.test.ts"
      pass: "exit 0"
    future: >
      以后任何需要把图画出来的地方 —— 别的 agent 的网页、命令行预览、导出图片 —— 调的都是这一份，不会再出现两处画法不一致。

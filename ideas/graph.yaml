version: 1
agent: cursor
project: ai-companion
overview: >
  这个仓库里有三条可以单独交付的产品线。一条是函数级变更追踪器：装进仓库后捕获
  Claude/Codex 的编辑，按函数归因、写入 JSON 历史、渲染自包含 HTML 报告。一条是
  Cursor 想法图 harness：ideas/graph.yaml 是唯一账本，写闸门 fail-closed，五个
  /idea-* 技能驱动 onboard/discuss/build/debug/record。一条是本机 Dashboard，
  浏览各仓库已经渲染好的报告。Claude 侧的想法图（claude-companion）和旧 ECL
  规划流水线仍在仓库里，但 2026-08-24 的 /idea-onboard 没有把它们选成交付终点。

# 写代码闸门（cursor-companion 的 gate 读这两个键；claude-companion 的引擎会忽略它们）。
# 这个仓库本身就是 companion，锁住自己的源码没有意义 —— 保留原有意图并加上 claude-companion。
enforce: true
exempt:
  - cursor-companion/**
  - claude-companion/**
  - .devcompanion/tests/test_companion_*

# 终点：什么叫「这个项目做完了」。四个都是人在 2026-08-24 的 /ccscan 里亲自选的。
endpoints: [I-026, I-025, I-017]

ideas:
  # ─── claude-companion：想法图引擎 ──────────────────────────────
  - id: I-001
    name: "八问的想法节点格式"
    status: doing
    needs: []
    what: >
      一个想法节点的格式：八个必答问题（是什么／为什么有这个想法／预期结果／如何实现／
      为什么这样实现／代码在哪个文件的哪几行／如何验证／未来怎么用），加上一种边 needs 表示前置。一种节点、一种边，全部放在一个 YAML 文件里。
    why: >
      AI 会产生幻觉、一句 prompt 对不齐真实需求、返工之后连自己都看不懂项目框架 ——
      这三件事的根因是同一个：想法从来没有被写下来，只有代码被写下来了。
    expected: >
      任何一个想法，人和 AI 读同一份记录得到同一个理解；一个没有上下文的 agent 冷启动读这个文件就能接着干。
    how: >
      YAML，一个扁平的 ideas 列表。规格写在 claude-companion/FORMAT.md，问题 1-5、7、8 在写代码之前回答，问题
      6 回答两次（计划时写 file/symbol，实现后补 lines）。
    why_this_way: >
      选一层扁平结构而不是需求／特性／模块／函数四层 —— README 里写明了理由：四层结构
      本身就是「看不懂项目框架」的那种复杂度，而人的心智模型是「所有想法都变成一个个模块」， 模块不是分类法。用 YAML 而不是
      JSON，因为八个回答都是成段散文，JSON 写多行散文没法读。
    code:
      - file: claude-companion/FORMAT.md
        lines: "1-123"
    verify:
      manual: "拿一个真实想法填一遍八问，看有没有哪个问题填不进去、或者填完还是说不清这个想法"
      signed_off: null
    future: >
      引擎、守卫、五条命令全部只读写这一个格式；加一个字段的成本是一个 YAML key。

  - id: I-002
    name: "图的解析与校验"
    status: done
    needs: [ I-001 ]
    what: >
      读 graph.yaml 并检查它没有烂掉：id 唯一、needs 指向存在的想法、图无环、 done 的节点必须有 code 和
      verify、code 指的文件真的存在、人工验证必须有人签字； 八问里没填的字段作为警告列出来。
    why: >
      没有校验，图会安静地烂掉：done 却没有代码、code 指向已经删掉的文件、两个想法互相依赖。 烂掉的图比没有图更糟，因为它看起来是完整的。
    expected: >
      健康的图 check 通过、退出码 0；每一种烂法都被指出来并说明是哪个 id； 未回答的八问以 warning 出现，不阻塞。
    how: >
      DFS 三色标记查环（findCycle）；从 endpoints 沿 needs 反向遍历找出不通向任何终点的
      想法（orphans）；existsSync 验证 done 节点的 code 路径。
    why_this_way: >
      把「done 必须有 code + verify」做成硬错误而不是警告 —— 这是整套东西成立的前提：
      如果「完成」可以没有证据，这张图就只是一份愿望清单。反过来，八问没填只做警告， 因为机器判不了回答的质量，硬拦一个判不准的东西比不拦更糟。
    code:
      - file: claude-companion/ideas.ts
        symbol: check
        lines: "192-259"
      - file: claude-companion/ideas.ts
        symbol: findCycle
        lines: "81-99"
      - file: claude-companion/ideas.ts
        symbol: orphans
        lines: "102-116"
    verify:
      command: "npx vitest run .devcompanion/tests/test_ideas_graph.test.ts"
      pass: "exit 0"
    future: >
      /ccbuild 动手前先跑它；/ccgraph 用它的输出告诉人接下来该做什么；R5 用它拦住回合结束。

  - id: I-003
    name: "前沿查询"
    status: done
    needs: [ I-002 ]
    what: >
      算出「现在可以做哪些想法」：状态是 todo、并且所有前置都已经 done 的节点。
    why: >
      「接下来做什么」应该是图算出来的，不该是另一份要手动同步的 TODO 列表 —— 两份清单一定会不一致。
    expected: >
      next 打出来的就是可以立刻动手的想法；一个都没有的时候，说清楚是全做完了还是全被挡住了。
    how: >
      一次过滤：status === "todo" 且 needs.every(前置已 done)。做完一个再算一次。
    why_this_way: >
      不做拓扑排序 —— 前沿只需要一次过滤就够了。少一个可能出错的地方。 （旧的 ECL 执行器 packages/exec 里确实做了 Kahn
      拓扑排序，那是因为它要一次 吐出可并行的整层；这里不需要。）
    code:
      - file: claude-companion/ideas.ts
        symbol: frontier
        lines: "73-78"
    verify:
      command: "npx vitest run .devcompanion/tests/test_ideas_graph.test.ts"
      pass: "exit 0"
    future: >
      /ccbuild 的入口；互不相干的前沿想法可以并行交给多个 subagent。

  - id: I-004
    name: "可点击的图"
    status: done
    needs: [ I-002 ]
    what: >
      渲染成一个自包含网页：上面是只显示想法名称的完整项目图，每个节点可以点，
      点进去是八问的全部回答，加上它的前置想法和「它是哪些想法的前置」，两个方向都能继续点。
    why: >
      看不见形状的项目，最后一定会被重写。图是给人看的，不是给机器看的 —— 让遗漏「可见」是这套工具唯一能对抗编造的防线。
    expected: >
      打开 ideas/graph.html 能一眼看出项目形状；点任意节点能看到它的完整想法； 按状态着色，终点单独高亮。
    how: >
      Mermaid flowchart TD 做布局，节点标签只放 name，click 回调跳到下面的详情卡片； 前置方向读
      needs，后继方向反向扫一遍 needs。
    why_this_way: >
      用 Mermaid（CDN）而不是 d3 或 cytoscape：静态 HTML、没有构建步骤、不用起服务器，
      双击就能打开。代价是超大的图会挤，到那时再分页 —— 旧的 scripts/render-dag.ts 已经踩过这条路并做了分页版，可以直接借。
    code:
      - file: claude-companion/ideas.ts
        symbol: render
        lines: "296-419"
    verify:
      command: "npx vitest run .devcompanion/tests/test_ideas_graph.test.ts"
      pass: "exit 0"
    future: >
      /ccthink 在拆分之后用它让人审核形状，动手之前就能发现拆错了。

  - id: I-005
    name: "状态写回与记录"
    status: done
    needs: [ I-002 ]
    what: >
      改一个想法的状态，同时在它自己的 log 里追加一条；写回时保留 YAML 注释； 拒绝没有 code / verify 的
      done，拒绝没签字的人工验证。
    why: >
      改了什么代码、什么文档、什么想法要有详细记录，而且原因要放在想法旁边而不是 另一个文件里 —— 放远了就没人读。
    expected: >
      set 之后重新读，状态变了、log 多了一条、原来的注释还在； 对一个没有代码的想法 set done 会失败并说明原因。
    how: >
      yaml 的 parseDocument 保留注释和格式，setIn 定点修改，写临时文件再 rename。
    why_this_way: >
      走 Document 而不是 parse → 改 → stringify：后者会把整个文件的注释和排版全部抹掉，
      而注释正是人留给自己的东西。rename 是原子的，写到一半崩溃不会毁掉原图。
    code:
      - file: claude-companion/ideas.ts
        symbol: setStatus
        lines: "263-287"
    verify:
      command: "npx vitest run .devcompanion/tests/test_ideas_graph.test.ts"
      pass: "exit 0"
    future: >
      五条命令都通过它写状态，所以不存在「忘了记一笔」这条路径。

  - id: I-006
    name: "扫描覆盖率清单"
    status: doing
    needs: [ I-002 ]
    what: >
      把 /ccscan 的「我读完了每个文件」从承诺变成倒计时：先列出全部待读文件写进 ideas/.scan-todo，每次真的 Read
      一个文件就划掉一个，check 把剩余数量报出来。
    why: >
      /ccscan 最大的失败模式是声称读完了但其实是抽样的 —— 一张从局部读出来的图 看起来是完整的，比没有图更糟。
    expected: >
      scan 建出清单并报出「已读 N/M」；agent 不 Read 就划不掉任何一个； 清单没清空时 check 一直警告。
    how: >
      listProjectFiles 用 git ls-files -z 列文件（-z 是为了非 ASCII 路径不被 octal 转义），
      过滤掉二进制和 lock 文件；strike 在 PostToolUse 收到 Read 时把对应行删掉； check 读剩余数量并作为警告输出。
    why_this_way: >
      guard.ts 顶部写明了这条设计的理由，和 R6 是同一个把戏：把主张绑定在 「agent 不干活就产生不了的事件」上 —— 文件只能被一次真实
      Read 划掉， 任何 agent 自己写得出的标记，agent 就能伪造。
    code:
      - file: claude-companion/ideas.ts
        symbol: listProjectFiles
        lines: "131-142"
      - file: claude-companion/ideas.ts
        symbol: strike
        lines: "175-184"
      - file: claude-companion/guard.ts
        symbol: ruleRecord
        lines: "276-283"
    verify:
      manual: >
        跑一遍 /ccscan：确认 .scan-todo 会随着 Read 变短，并且里面包含未被 git 追踪的目录 （目前两条都不成立，见
        log.md 的两个缺口）
      signed_off: null
    future: >
      /ccscan --refresh 只需要看剩余清单就知道上次读到哪；覆盖率变成一个数字而不是一句话。

  - id: I-007
    name: "强制层：七条 hook 规则"
    status: doing
    needs: [ I-002, I-005, I-006 ]
    what: >
      七条跑在 harness 层、agent 绕不过去的规则：R1 每次编辑自动记录；R2 已有想法的 status 只能通过 set 改；R3
      测试文件不存在就不准写实现；R4 how／why_this_way 没填就不准动它的代码；R5 图有错误就不准结束回合；R6
      没有人批准过的图不准开始实现； R7 扫描清单只能被真实 Read 划掉。
    why: >
      五条命令都只是 prompt —— agent 可以跳过调研、编造 why_this_way、直接用 Edit 把 status 改成 done
      绕过所有校验。写在提示词里的纪律，到了第三十轮对话就不算数了。
    expected: >
      跳过测试写实现会被拒绝并告诉它先写哪个文件；手改 status 会被拒绝并给出该跑的 set 命令；没人批准过的图上动手会被拒绝；每次编辑都在
      ideas/log.md 里留一行。
    how: >
      一个 guard.ts 挂在 PreToolUse / PostToolUse / Stop / UserPromptSubmit 四个事件上， 按
      hook_event_name 分派；退出码 2 + stderr 表示「拦下并把原因告诉 Claude」。 批准绑定在图的 sha256 前 12
      位上，改一个字就失效。
    why_this_way: >
      只强制机器判得了的事：文件存不存在、字段填没填、状态变没变、check 过不过、 人有没有亲口批准。批准挂在 UserPromptSubmit
      上，因为那是唯一 agent 造不出来的事件； 判定要求整条消息就是「批准」，否则「我不批准」会被算成批准。 所有异常路径一律 fail open
      —— 守卫自己崩了不能把人锁在外面。
    code:
      - file: claude-companion/guard.ts
        symbol: decide
        lines: "155-174"
      - file: claude-companion/guard.ts
        symbol: graphHash
        lines: "89-115"
      - file: claude-companion/install.ts
        symbol: installHooks
        lines: "33-64"
    verify:
      command: "npx vitest run .devcompanion/tests/test_ideas_guard.test.ts"
      pass: "exit 0"
    future: >
      要加新纪律，就在 decide 里加一条规则加一个测试 —— 前提是它机器判得了。

  # ─── claude-companion：五条命令 ────────────────────────────────
  - id: I-008
    name: "/ccscan — 通读项目建图"
    status: doing
    needs: [ I-001, I-002, I-006 ]
    what: >
      读完整个项目的每个文件、每份文档、每行代码和注释，问人终点是什么， 抽出所有想法连成图，渲染出来，并诚实报告读了多少、跳过了什么、哪些问题没答上。
    why: >
      接手一个自己已经记不住的项目时，第一件事是重新看清它的形状。
    expected: >
      跑完得到一张图，加上一份诚实的清单：读了多少文件、跳过了哪些、 哪些节点的 why_this_way 或 verify 没能找到答案。
    how: >
      按「意图 → 结构 → 代码 → 历史」的顺序读；用 AskUserQuestion 问终点； 从代码结构、注释、commit message
      和设计文档里抽想法；找不到理由就写 null 并列进报告。
    why_this_way: >
      明确禁止编造 why_this_way —— 编出来的理由会被下一个 agent 当成事实并且一直
      维护下去，这是这条命令能造成的最大伤害。所以宁可留空并列进报告，让下一次 /ccthink 去补。
    code:
      - file: claude-companion/commands/ccscan.md
        lines: "1-124"
    verify:
      manual: "在一个自己熟悉的仓库上跑一遍，看抽出来的想法是不是自己心里的那些想法"
      signed_off: null
    future: >
      每个新仓库的第一步；代码走远了之后用 --refresh 重新对齐。

  - id: I-009
    name: "/ccthink — 对齐、拆分、调研、排期"
    status: doing
    needs: [ I-004, I-008 ]
    what: >
      三个高层问题对齐 → 拆成小想法 → 渲染出图让人审核 → 调研（仓库内 + 联网， 能借就借）→ 回答如何实现和为什么这样实现 → 设计测试方案
      → 按周排出完整计划。
    why: >
      一句 prompt 对不齐需求。返工的成本远高于先花二十分钟对齐的成本。
    expected: >
      拿到一份可以直接交给别人执行的计划：图审过了、借用的东西列清楚了、 每个节点的测试要断言什么说明白了、按周排好了。
    how: >
      六步，顺序固定。第 2 步之后必须停下来等人审图；第 3 步的调研必须在回答 「如何实现」之前完成；第 5 步只设计测试不写测试文件。
    why_this_way: >
      「能借就借」设成这条命令里优先级最高的规则：除非人明确禁止某个项目， 只要存在可用的东西就借，自己造需要一个经得起追问的理由。顺序上把调研放在
      「如何实现」之前，否则调研只会变成给已有答案找依据。
    code:
      - file: claude-companion/commands/ccthink.md
        lines: "1-152"
    verify:
      manual: "拿一个真实的新需求走一遍，看第 2 步的图有没有真的改变拆分方式"
      signed_off: null
    future: >
      产出的图直接就是 /ccbuild 的执行计划，中间不需要再转一次格式。

  - id: I-010
    name: "/ccbuild — 先测试后实现"
    status: doing
    needs: [ I-003, I-005, I-007, I-009 ]
    what: >
      按拓扑序推进前沿：先写测试并确认它失败，再实现，再验证，填上真实行号， 标记完成；失败三次转 /ccfix。
    why: >
      「假设这个节点已经被实现了，如何知道它和预期一致」—— 这个问题必须在实现之前 回答，否则答案会被写成「反正现在这样」。
    expected: >
      每个 done 的想法背后都有一个先写、先失败、后通过的测试。
    how: >
      next 拿前沿 → show 读八问 → 写测试跑到失败 → 实现 → 验证 → set done。 code 指向同一个文件的想法不并行。
    why_this_way: >
      「测试必须先失败」是刻意的：一个从来没红过的测试，可能根本没在测它声称测的东西。
      「永远不改测试让它通过」也是刻意的：测试是第七问，改它就是改这个想法的含义。
    code:
      - file: claude-companion/commands/ccbuild.md
        lines: "1-121"
    verify:
      manual: "让它建一个真实想法，检查测试文件的提交时间确实早于实现"
      signed_off: null
    future: >
      互不相干的前沿节点可以并行，图本身就说明了哪些互不相干。

  - id: I-011
    name: "/ccfix — 先查一致性，再查想法"
    status: doing
    needs: [ I-005, I-010 ]
    what: >
      第一步：对照 code 指的行，逐条找出实现和想法不一致的地方，带行号引用，交人审核后再改。 第二步：如果一致，那就是想法本身错了 ——
      摆出真实的输入输出和完整八问，让人来改想法。
    why: >
      大部分 bug 是代码和想法不一致，剩下的是想法本身错了。跳过第一步直接改想法， 会把对的代码改坏。
    expected: >
      每一条发现都带文件和行号；没有行号的不算发现。
    how: >
      读 code 指的每一段，逐项对照 what / how / why_this_way / expected / needs；
      列出全部不一致后停下来，一条条问人：是代码错了，还是想法过期了。
    why_this_way: >
      故意不让 AI 自己判断哪边对 —— 它恰恰是判断不了的那一方，这就是这一步以人审收尾
      的原因。第二步要求摆真实值而不是举例值，因为这一步的全部意义就是让人看见现实。
    code:
      - file: claude-companion/commands/ccfix.md
        lines: "1-109"
    verify:
      manual: "制造一处文档与实现的偏差，看它是否报出准确的行号而不是泛泛而谈"
      signed_off: null
    future: >
      改完的想法回到 /ccbuild，因为 verify 变了，测试要重写。

  - id: I-012
    name: "/ccgraph — 看图"
    status: doing
    needs: [ I-004 ]
    what: >
      渲染 + 校验 + 报告：项目现在什么状态、哪些想法可以做、哪里出了问题， 最后给一句「接下来该跑哪条命令」。
    why: >
      随时能问一句「我到哪了」，而不用自己去读 YAML。
    expected: >

  - id: I-065
    name: "一条指令把改动文件写回想法图，注释原样保留"
    status: done
    needs: [ I-077, I-078, I-044 ]
    what: >
      引擎新增一个子命令：读改动文件，把每一处修改写进 ideas/graph.claude.yaml —— 文字改动定点写入，状态改动走既有的「set
      + 自动留记录」逻辑， 新建删除想法和边按格式规则执行；写完自动校验并重新渲染网页，改动记进记录文件。
    why: >
      写回如果靠 agent 手工编辑 YAML，注释会被抹掉、状态可能绕过 set、格式可能写坏 ——
      这些正是这套工具当初要防住的事。写回必须是一条确定性的指令，不是一次自由发挥。
    expected: >
      对一个带注释的图应用改动文件之后：每处改动都生效，注释和没动过的部分逐字保留， 校验通过，记录文件里多了对应条目，网页已重新渲染；
      同一个改动文件应用第二次不会再产生任何变化。
    how: >
      引擎新增 apply 子命令，核心是一个可单独测试的纯函数：读改动文件 → 在内存里 应用全部改动并跑完整
      check，任何一步失败整体放弃、磁盘不动 → 才原子写盘、 重新渲染、记录日志。要点：baseDigest 不等于当前图指纹时整体拒绝（乐观锁）；
      操作按「先改字段、后删节点」排序，每个结构操作后重建内存快照——否则按旧下标写
      会把状态落到错误的想法上（对抗审查实测过这个静默污染）；状态操作转调既有 setStatus 的证据校验，说明文字也从那里进
      log，不重复记；新增操作强制 status 为 todo、剥掉 payload 里的 log 和人工签字字段——否则改动文件能凭空造出
      「已完成已签字」的想法；删除操作要求已没有别的想法依赖它，并把挂在被删节点上的 分节注释搬给下一个节点；新增节点用 doc.createNode
      且散文字段设块折叠样式 （裸对象塞进 yaml 文档后续就改不动了，实测）；凡是被改了行为字段 （what / expected / how /
      why_this_way / verify）的已完成想法，自动降回 doing 并留
      log——让测试先行、想清楚、人批准三条规则对它重新生效。成功后把改动文件 改名为
      changes.applied-<日期>.json，输出末尾固定提醒「回浏览器刷新页面再做 下一轮」；set
      子命令落盘后也顺手重新渲染，让磁盘上的网页永远新鲜。 **编号在这里统一发放**：页面来的临时号，在应用之前一次性全部换成真编号（从取号计数器取，
      取一个加一个），前置关系里引用临时号的地方同步替换；替换完还剩任何一个临时号，整体拒绝落盘。 **三条保住 diff
      的写法，都是在真实的图上量出来的，缺一条就会把改动变成一次全文件重排**： 一、把文档转回文本时不能传任何参数 ——
      传了「不折行」那个选项会重排全部折叠段落， 实测在这张图上会动 1274/1301 行、文件缩短 291 行；不传参数则是逐字节不变。
      二、写前置关系必须先造一个节点再把它标成单行样式，直接塞一个普通数组进去会把单行的 `needs: [ I-042 ]` 变成三行的列表，实测动
      444 行；标了样式只动 1 行。 三、删掉的如果是**第一个**想法，那条分节标题并不挂在它身上，而是挂在整个想法序列上 ——
      只搬「被删节点的注释」会把标题孤儿化到新的第一个节点头上。这一条要有它自己的测试。
    why_this_way: >
      写回必须是确定性指令而不是 agent 自由发挥——注释、格式、校验都会在自由发挥里丢。 全部校验内置在引擎里而不是指望 hook：apply 走
      Bash，hook 根本看不见它。这条 信任边界要诚实写明：apply 守住的是「状态有证据、图不写坏、改动有记录」，
      守不住「改动一定来自人」（那是 I-066 的事）。 这里还要收回一句说满了的话：原文写「状态操作转调既有 setStatus 的证据校验」， 而
      Claude 这边的 setStatus 其实只挡「done 缺 code / verify」和「人工验证没签字」两件事 ——
      它不检查八个问题齐不齐、不检查前置是否完成、也不看批准。Cursor 那个版本才是真的按 readiness 闸的，
      这条分歧规范里已经记过。所以诚实的说法是：状态操作复用 setStatus 是为了让日志只有一个写入口， 并且继承它那两条检查；不是「继承了一整套
      readiness 校验」。要更严就得先加强 setStatus 本身， 那是另一个想法。 写回不借现成的补丁库：调研查过一个专门做「按补丁改
      YAML 还保注释」的包，它自己就是搭在 同一个 yaml 库加一个补丁库上的 —— 而这个引擎已经有那个 yaml 库了，也已经有
      load/save 这对 读写函数。我在真实的 50,352 字节的图上验过：解析再转回文本，逐字节相同。
      也就是说这条最硬的约束是白捡的，装那个包只是把已经有的东西再要一遍，还多带一种 「差异太大就打不上」的失败方式 ——
      而这里根本不需要模糊匹配，编号就是精确地址。check 挪到写盘之前，因为这套工具
      自己的底线就是坏图不落盘；「已完成想法自动降级」是对抗审查发现的最大流程漏洞的 最小修法——guard
      对已完成想法的代码文件直接放行，不降级的话改了图之后代码 不经批准就能改。改动格式不借 JSON Patch（RFC
      6902，按下标定位不认编号）也不借 JSON Merge Patch（RFC 7396，数组只能整体替换）：保注释要求应用端逐条走 yaml 的
      Document 接口，任何现成补丁库的应用引擎都是死重；自定义按编号的操作清单， 语义对齐 Kubernetes strategic merge
      patch 的 merge-by-key 先例。

  - id: I-078
    name: "把取号计数器和改动文件格式写进格式规范"
    status: done
    needs: [ I-041 ]
    what: >
      格式规范里补两件事。一是图文件顶层的取号计数器：一个只增不减的数， 新编号由引擎在写回改动时统一发放，网页只发临时号、不碰它。
      二是改动文件的格式：信封里有什么、六种操作各自长什么样。
    why: >
      「编号永不复用」是格式的硬规定，而网页看不见历史。让网页按当前图算「最大编号加一」， 删掉编号最大的那个想法之后，下一次新建就会拿到刚被删掉的号；
      两个人各自开着一份网页，也会同时算出同一个新编号，而合并之后没有人会发现。 改动文件则是网页和写回指令之间的唯一接口，一个跨组件的格式却不写进规范，
      下一个接手的人只能去读实现。
    expected: >
      连着做「新建、删除、再新建」，拿到的编号严格递增，从不重复； 两份互不知情的改动文件先后写回，各自拿到不同的编号。
      规范里能查到计数器字段和改动文件的完整格式，不用读代码。
    how: >
      计数器写成图文件顶层的一个字段，只由会发编号的命令递增，任何其它地方只读。 **初值写成一条规则，不写成一个数**：图里还没有这个字段时，一次性算成
      「这张图里出现过的最大编号 + 1」并写入。原来这里写的「最大编号是 I-075，所以初值是 76」 已经作废 —— 写下那句话的时候图还没长到
      I-080，照着 76 初始化会把 I-076 到 I-080 重发一遍，正好是这个字段要防的事。一个写死的数，只要图还在长就一定会过期。
      规范里同时写清两条硬规矩：网页只发临时号；真编号在写回时一次性发放并把所有临时号替换掉，
      替换不完就整体拒绝落盘。改动文件的格式按信封加六种操作逐条写出来，每种给一个例子。
    why_this_way: >
      计数器放进图文件而不是让网页算：编号永不复用是格式规定，而被删掉的编号页面根本看不见。 顺带纠正一条之前写在图里的错误理由 —— 原文说「旧图
      I-001~I-040 已退役，页面按当前图算 max 会撞上它们」，这是错的：活着的编号是 I-041～I-075，max+1 得
      I-076，撞不上任何退役编号。 真正的漏洞在删除之后：把编号最大的想法删掉，max 就退回去了，下一次新建拿到的正是刚被删掉的号。
      两份网页同时算出同一个号，是同一个毛病的并发版本 —— 这也正是 Rails 当年放弃顺序编号迁移的原因。
      两件事合在一个节点里，是因为它们是同一件事的两半：都是「这条链路新增的东西，规范里必须查得到」，
      而且都要动同一个受管的文件。分成两个节点会让同一份规范被批准两次。

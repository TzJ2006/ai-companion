  - id: I-084
    name: "图下面一个能收起的索引：列出正在进行中的想法，以及每个在等谁"
    status: done
    needs: [ I-083 ]
    what: >
      和上面那个索引同一套做法，列的是状态为「进行中」的想法。每一行显示名字， 以及它还在等哪些前置想法（只列那些还没做完的）。点一行跳到卡片。
    why: >
      进行中的想法是「已经动了手但还没完」的那些，最容易被忘掉。现在要找它们同样得翻卡片， 而且翻到了也看不出它到底卡在等什么。
    how: >
      和上一个索引同一套做法、同一个折叠元素、同一种「零条就不出现」的规则， 只是换一个判断和一个行内容：状态是「进行中」的想法，行里显示名字，
      以及它的前置里**还没做完的**那些。 「还没做完」要写成「不等于已完成」，**不能写成「等于待办」**——
      一个前置如果是受阻或者进行中，它同样挡着路，而按「等于待办」筛会把它漏掉， 于是页面会说「没有前置挡着它」，而实际上有。
      一个前置都不挡的时候，写一句明白话，不要用现成那个表示「无」的破折号 —— 破折号在这里读起来像「没有信息」，而这里要说的是一件确定的事。
    why_this_way: >
      **为什么和上一个索引共用一套做法而不是各写各的**：两个索引除了判断和行内容之外
      完全一样。分开写会得到两份几乎逐字相同的代码和两份几乎相同的测试， 而它们迟早会有一处被改、另一处忘了改。这也是这两个想法之间那条前置边的理由。
      **为什么「还没做完」要写成「不等于已完成」**：调研点出的坑 ——
      按「等于待办」筛，一个受阻的前置会被当成不挡路，页面于是说出一句和事实相反的话。 这类错误在今天这张图上还不会显形（进行中的三个都不等前置），
      所以它只能靠测试抓，不能靠肉眼。 **为什么「没有前置挡着它」这句话要小心措辞**：原来这个想法的预期结果里写的是
      「那说明它是真的在做，不是卡着」—— 实测推不出来：三个进行中的想法里有两个

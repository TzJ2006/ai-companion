  - id: I-080
    name: "根目录放一个双击就能打开想法图的入口"
    status: doing
    needs: [ I-079 ]
    what: >
      仓库根目录放一个文件，双击它就启动本地小服务并在浏览器里打开想法图。 同时给一条等价的 npm 命令，供不方便双击的场合用。
    why: >
      「像网页一样一打开就能用」是这个功能会不会真被用起来的前提。 如果要人先开终端、切到仓库目录、再背一条命令，那这个功能实际上只有写它的人会用。
    expected: >
      在文件管理器里双击根目录那个文件，浏览器出现想法图，可以直接编辑和提交； 不想双击的人跑一条 npm 命令，得到完全一样的结果。
    how: >
      根目录放一个 Windows 批处理文件（双击直接能跑），内容是调用引擎的服务子命令， 并且**先把工作目录切到脚本自己所在的目录** ——
      否则从别处双击时相对路径全是错的。 同时在 package.json 的 scripts 里加一条等价命令。非 Windows 的场合再放一个同名的
      shell 脚本。
    why_this_way: >
      选批处理文件，是因为它是 Windows 上唯一「双击就能跑」的形式，而人用的就是 Windows。
      不做成打包好的桌面应用：那要引入一整套构建和分发流程，收益仅仅是一个图标， 而这个引擎的设计前提是装到别的仓库不需要装任何东西。
      切工作目录那一句不是可选项：双击时的工作目录是不确定的，少了它在一部分机器上直接跑不起来， 而这种失败只会在别人的机器上出现，本机永远测不到。
      明确划到范围外的一件事：把这个入口也交给安装器、分发到别的仓库。 那个文件由另一个想法认领着、而且还没做完，顺手改它就是替别人建前置。
      本仓库先用起来，分发等那个想法收掉再说。

  - id: I-066
    name: "人批准自己在网页上做的修改，而批准机制不被削弱"
    status: todo
    needs: [ I-065, I-048 ]
    what: >
      设计并实现：改动写回之后，这张新图如何获得「人已批准」的地位 —— 同时保持既有底线：批准只能来自人亲手的动作，agent 自己造不出来。
    why: >
      图一改，旧批准就失效，这是刻意的特性；但这次改图的人恰恰就是批准人自己。 如果网页上改完还要按原样再走一遍全图审查和批准，这个功能就没有省下任何步骤。
    expected: >
      人在网页上改完、改动写回之后，用一步人亲手的动作（不是 agent 的动作） 就能让新图进入已批准状态；agent 依然没有任何办法伪造这一步。
    how: >
      三件事。一，先堵已有的旁路：guard 新增一条对 Bash 的规则——命令文本触及
      .approved、.scan-todo、.applied、图文件或改动文件、或直接调用 guard.ts 的一律 拦下，只放行 ideas.ts
      子命令形式的调用；同时把设置里的 Bash 允许列表从 「任何 npx tsx」收窄到「npx tsx <引擎路径>」。二，apply
      写盘后把（写盘前指纹、 写盘后指纹、改动文件的哈希、逐字段改动清单）写进受同等保护的 ideas/.applied 回执，并把逐字段 diff
      打印给人看。三，批准词扩展：整句「批准 <12位指纹>」只在 参数 == 当前图指纹 == 回执里的写盘后指纹 时生效——apply 之后
      agent 对图的任何 一次改动都让三者失配，快速通道自动失效、退回全图审查；指纹不符时当场明确报错
      拒绝这条消息，不许静默失败——静默失败会训练人不看内容只粘指纹。
    why_this_way: >
      对抗审查推翻了原设计的两个假设。其一「agent 造不出批准」现状就是假的：guard 只挂 在 Edit / Write 上，Bash
      从来不经过它，而允许列表放行任何 npx tsx——agent 写个 脚本跑一下就能直接写
      .approved。先堵这扇门，别的都谈不上；堵门顺带关掉 README 里如实记录的「用 Bash 喂假事件给
      guard.ts」的已知天花板。其二「指纹相等 = 人看过 这张图」不成立：指纹证明新鲜度不证明来源，agent 可以在 apply
      之后夹带私货再打印 真实指纹——所以快速通道必须绑定 apply 的受保护回执，不能只绑指纹。诚实的边界：
      这套机制把伪造成本提高到「必须经过人的权限提示」，不是数学上不可伪造。 明确否决的方案：headless 管道喂「批准」（claude
      -p），任何脚本都能跑，等于把门拆了。
    code:
      - file: archive/claude-companion/guard.ts
        symbol: decide
      - file: archive/claude-companion/guard.ts
        symbol: isApproval
      - file: archive/claude-companion/guard.ts
        symbol: recordApproval
      - file: .claude/settings.json
    verify:
      command: "npx vitest run .devcompanion/tests/test_ideas_guard.test.ts"
      pass: "exit 0"
    future: >
      任何「人自己发起的修改」以后都能用同一条通道快速获得批准。

  - id: I-067
    name: "提交之后，人敲一条指令，agent 就把代码对齐到新图"
    status: todo
    needs: [ I-065, I-066, I-049 ]
    what: >
      人敲一条指令，agent 读当前的想法图，找出「想法说的」和「代码做的」不一致的地方，
      按测试先行的纪律把代码调整到符合图：先写测试、确认失败、再实现、验证通过才标完成。
    why: >
      完整诉求是「改图即改项目」：改动写回 YAML 只是中转，最终交付物是符合新想法的代码。 这一步不接上，人还是要自己去发起实现，链路就断在最后一米。
    expected: >
      图里某个想法被改过之后敲这条指令，agent 自动开始工作； 结束时被改想法的验证命令通过、代码与八个问题的回答一致； 图里没被改过的部分不被乱动。
    how: >
      新斜杠命令 /ccapply（命令文件正文含 ideas.ts 字样——安装器靠这个字样识别自家 文件，缺了会被判为外来文件、永不更新；用
      install.ts --update 分发到已装仓库）。 流程：在 ideas/ 里找 baseDigest
      等于当前图指纹的改动文件（陈旧的逐个报出并忽略； 一个都找不到时提醒「检查是否存进了下载目录」）→ 跑 apply → 把逐字段 diff、
      check 结果、新指纹、以及「哪些想法八问未齐、本轮不实现（网页新建的三问想法都在 此列，先跑 /ccthink
      补齐再批准可省一次重复批准）」逐项报给人 → 人敲「批准」或 「批准 <指纹>」→ agent 只对本次改动触到、且八问齐全的想法按
      /ccbuild 纪律实现 （测试先行、状态走 set、verify 通过才标完成）→ 结束报告固定提醒刷新浏览器页面。
      指纹失配的改动文件有明确重放路径：agent 把每条改动（含旧值）对着新图逐条向人 确认，确认后以当前指纹重新生成改动文件再 apply。
    why_this_way: >
      交互式斜杠命令而不是 headless 管道：人敲 /ccapply 本身就是真实的 UserPromptSubmit 事件，hook
      全部照常生效，批准环节留在人手里。实现范围限定在本次改动触到的想法， 全图对齐是 /ccfix
      的事——一次提交不该引发全仓库漫游。轻量修改的分工也写进命令： 改一个错别字直接在对话里说更快（改散文字段本来就允许 agent 用 Edit
      做）， 网页链路的价值在批量散文修改和增删节点边的结构变更。
    code:
      - file: archive/claude-companion/commands/ccapply.md
    verify:
      manual: "真实走一遍：网页改字段 + 新建一个三问想法、提交、/ccapply——报告里 diff
        完整、新想法被列为「未齐不实现」、批准后被改想法实现完成且 verify 通过"
      signed_off: null
    future: >
      「网页上改一句话，代码跟着变」从此是一条指令的事。


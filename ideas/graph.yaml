  - id: I-096
    name: "把引擎、守卫和依赖打进一个单文件程序，装到哪里只要有 node 就能跑"
    status: done
    needs: [ I-070, I-071 ]
    what: >
      一个构建脚本把 companion 的引擎、守卫和 yaml 解析依赖打包成 dist/companion.mjs 一个文件；运行它只需要系统里有
      node，不需要 npx、不需要 tsx、目标仓库不需要 npm install。源码仍然只有 TypeScript 一份。
    why: >
      今天三家三种跑法：Claude 用绝对路径 npx tsx 跑源码（换台机器就断），Cursor 往 目标仓库复制源码再 npm
      install（会过期），Codex 是另一门语言的完整副本（漂移 之源）。裁决表 D34 裁定单文件产物。
    expected: >
      把 dist/companion.mjs 单独拷进一个没有 node_modules 的空目录，校验、渲染、守卫
      判断都能运行；产物可由构建脚本重复生成。
    how: >
      companion/build.mjs 十来行：调 esbuild --bundle --format=esm --platform=node
      --target=node20 输出 companion/dist/companion.mjs，banner 注入两样东西 —— 首行
      shebang 和 createRequire 垫片。垫片不可省：yaml 包的 CJS 构建里有
      require('process')，没有垫片则构建全绿、第一次解析当场崩 —— 本次调研在本机复现过失败并验证过修法。入口
      companion/cli.ts 同时挂引擎 命令和 guard 子命令。
    why_this_way: >
      esbuild 直用，不用 tsup（已停维护，其仓库自己指向继任者）、不用 rollup （要三四个插件才等效，产物只小几十 KB）、不用
      bun（有把构建机绝对路径写进 产物的已知缺陷，正中「可移植单文件」的要害）、不用 node 单可执行文件 （百兆二进制、还得先过一遍
      esbuild）。这是唯一在本机对这套依赖实测通过 的路径。

  - id: I-064
    name: "网页上的「提交」：有本地服务器就直接存盘，没有就下载成一个改动文件"
    status: done
    needs: [ I-063, I-079 ]
    what: >
      网页上有一个「提交」动作，把人这一次做的全部改动（改文字、改状态、新建删除想法、增删前置关系）
      打包成一份改动记录送出去。页面先探一下有没有本地服务器：有，就直接发过去、由服务器落盘；
      没有（比如直接双击打开的那一份），就退回下载成一个文件，并明确告诉人要把它放到哪里。
    why: >
      浏览器里的网页写不了项目里的文件 —— 这是整条链路里唯一跨不过去的墙。本地服务器是翻过这堵墙的正门，
      下载是没有服务器时的备用门。两条路送出去的必须是同一份东西，否则写回那端要认两种格式。
    expected: >
      有服务器的时候：点「提交」→ 页面列出逐条改动 → 人点确认 → 改动落进图，页面显示新图， 全程不碰文件系统。没有服务器的时候：点「提交」→
      拿到一个改动文件，外加一句 「把它放到 <绝对路径>，然后跑这条指令」。两种情况下什么都没改时按钮都是不可点的。
    how: >
      探测就是对服务器的健康检查地址发一次请求，超时设得很短，失败就当没有 —— 探测失败绝不能让页面卡住或者弹错。
      **有服务器**：把账本那个信封（含图指纹和页面里的一次性令牌）发过去；服务器先回一份逐条改动的
      对照给人确认，人点了确认才真正落盘；成功之后页面用服务器返回的新图重画，并把账本清空。 **没有服务器**：同一个信封序列化成文本，走两级降级 ——
      先试触发下载（把文本包成一个临时对象、 造一个临时链接、点一下、延后回收），不行就显示一个可以全选复制的文本框； 两种情况都同时显示 ideas/
      的绝对路径（渲染时嵌进页面）和该跑的那条指令。 提交成功不清草稿，只标记「已提交」—— 等改动真的落进图之后再由人丢弃。
    why_this_way: >
      服务器优先而不是永远走文件：人的原话是「不好同步」，而中间插一个需要手动搬运的文件， 正是那个不同步。保留降级是因为直接双击打开的那一份也要能提交
      —— 同一份代码、 一次特性探测、一条降级分支，成本很小，换来的是这个网页仍然能进 git、能发给别人、 能在没装 Node 的机器上打开。
      **否掉 showSaveFilePicker 当第一级**：原文写的是「file:// 下实测可用」，而规范里
      「检查当前环境是否允许弹出文件选择器」的第一步就拒绝 opaque origin，file:// 文档正是 opaque
      origin，三份独立调研都指向这个结论。那次手测很可能是在别的上下文里做的。不把它当第一级，
      是因为一个时灵时不灵的路径会让另外两级永远缺乏真实使用、也就永远没被验证过。
      如果复测确认它在你的浏览器里真能用，它可以作为「探测到就顺手用」的锦上添花，但不能写成承诺。 **最后一级必须是文本框而不是剪贴板**：剪贴板接口在
      file:// 下同样经常不可用， 而一个能全选的文本框在任何浏览器里都不会失败 —— 兜底那一级的唯一要求就是不会失败。
      每条改动带旧值，是给写回端做逐条比对和冲突展示用的：只带新值的改动记录一遇冲突只能整体作废。 成功不清草稿：写回一旦被拒（图在编辑期间被别的会话改过
      —— 调研当天就真实发生过一次）， 人的改动不能一份都不剩。

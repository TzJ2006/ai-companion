  - id: I-077
    name: "改动记账本：字段改动和结构改动用同一种格式，浏览器草稿和磁盘文件也用同一种"
    status: done
    needs: [ I-062 ]
    what: >
      页面记录「人这一次改了什么」的那本账，从「想法编号 + 字段名 → 新值」的表，
      换成一串有先后顺序的操作记录：改一个字段、改一个状态、新建一个想法、删掉一个想法、
      连一条前置箭头、断一条前置箭头。这串记录同时就是浏览器草稿的格式， 也是后面提交到磁盘的那个改动文件的格式 —— 一种格式，不是三种。
    why: >
      现在这本账只能表达「某个想法的某个字段变成了什么」。新建一个想法时还没有编号可以当键， 删掉一个想法时没有字段名，而前置关系是一个列表 ——
      现在的账本比较新旧值时会把列表 当成一句话来比，于是「把两条前置删成一条」会被判成「没有改动」，然后被直接丢掉。
      结构编辑在现在的格式上根本无处落脚。
    expected: >
      六种操作都能被记下来、存进草稿、读回来，一条不少；把一个想法的前置从两条改成一条，
      账上出现的是「断了哪一条」，而不是「没有改动」；页面重开之后结构操作和字段改动一样 能逐条恢复。
    how: >
      账本从一张表换成一串有先后顺序的操作，六种：改字段（带旧值和新值）、改状态（带原状态和新状态）、
      新建（页面只给一个临时号和前三问的内容）、删除（带编号）、连一条前置箭头、断一条前置箭头。
      连边断边写成「从哪个到哪个」的一对，而不是整个前置列表的新值。 整串操作外面套一个信封：格式版本号、项目路径、以及页面上已经嵌好的那个图指纹 ——
      指纹原样带回，页面绝不自己算。 这个信封同时就是浏览器草稿的格式和磁盘上改动文件的格式：一种格式，不是三种。
      顺带修掉一个现存的相邻缺陷：草稿写进去的时候存了指纹，读回来的时候却从不比较它，
      于是一份对着旧图写的草稿会被无声地拿出来恢复。等「删除某个想法」这种操作存在之后， 这就不再是无害的了。
    why_this_way: >
      现有账本扩不动，这是实测出来的，不是推测：它比较新旧值用的是把两边都转成字符串再比， 而一个只有一个元素的列表转成字符串，恰好等于那个元素本身 ——
      所以「把两条前置删成一条」 会被判成「没有改动」，然后从账上删掉。裸字符串也表达不了「不存在」（空串的意思是空，不是删掉），
      而恢复草稿时按分隔符切键的写法，碰到结构操作会切出垃圾。 所以这是重建不是扩展。这句话必须写在节点里，因为它正是「两行改动」和「一个新模块」的区别，
      也是原来那句「删除做成标记待删」读起来轻飘飘的原因。 选有序列表而不是并列的几张表：「新建一个临时号」和「连一条边到那个临时号」，
      只有在有先后顺序的时候才有确定含义。 边写成一对而不是整个列表：同一个想法上的两处边改动才不会互相覆盖。 不借 JSON
      Patch：它按数组下标定位，而这条链一旦能加节点，下标就全错了 —— 这也正是配置类工具普遍放弃它的原因。不借 JSON Merge
      Patch：它对数组只能整体替换， 而且它用 null 表示删除，和这张图里真实存在的「人工签字：尚未签」直接冲突。
      自定义的、按编号寻址的操作清单，语义上对齐 Kubernetes 那套按键合并的先例，实现只有约三十行。
      版本号那一位借流程图在线编辑器的做法：加一个前缀，好让写回端能明确拒绝一份旧格式， 而不是似是而非地读进去。

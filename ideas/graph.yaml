  - id: I-076
    name: "把「一张图画成流程图」这段算法抽成网页和引擎共用的一份源码"
    status: done
    needs: [ I-062 ]
    what: >
      现在「一张想法图 → 流程图的源文本」这段算法只活在生成网页的那个函数里，
      而且它引用了函数外面的好几个变量。把它抽成一个独立的、不引用任何外部变量的函数， 让引擎侧和浏览器侧跑的是同一份源码 ——
      文字净化、长名折行、按状态上色、 点击绑定，全都搬进这个函数里面。
    why: >
      结构一旦能改（加了个想法、断了条箭头），浏览器就必须能自己重新算出流程图的源文本再重画。
      而做法只有两种：把这段算法在网页里再手抄一份，或者让两边共用同一份。 手抄的第二份一定会漂移 ——
      改了折行规则只改一边，同一张图就在两个地方长得不一样， 而且没有任何测试会发现。
    expected: >
      同一张图，引擎调这个函数和网页调这个函数，得到逐字相同的流程图源文本； 现有网页的外观、连线和点击行为一个像素都没变。
    how: >
      把生成流程图源文本的那段循环整体搬进一个新函数，它只接收一张图，不引用任何函数外的东西 ——
      现在被它用到的编号查找表、终点集合、编号转节点名、按状态分类、长名折行、文字净化， 六样全部搬进函数体内部。
      然后把这个函数的函数体以**一个字符串常量**的形式嵌进网页脚本，而不是在运行时用 Function.prototype.toString
      去取它的源码。引擎侧直接调用这个函数，网页侧执行同一段文本。 锁住「同一份源码」的办法是一条测试：同一张图，两边各算一次，断言输出逐字相同。
    why_this_way: >
      原计划写的是「渲染时用 Function.prototype.toString 注入页面」。这条路在这个仓库里是坏的， 我实测过：tsx 把
      esbuild 的 keepNames 硬编码成开启（装好的包里搜得到，且没有关掉它的环境变量）， 于是函数体里任何一个具名的 const
      都会被编译成对 __name(...) 的调用，而 __name 是编译器注入的 自由变量 ——
      也就是说「零闭包」这个前提，恰恰被编译器亲手破坏了。我拿真的 tsx 跑过一个同形状的 函数，把注入结果求值，报的就是 __name 未定义。
      比这更要命的是它抓不住：跑测试的那套转换不依赖 esbuild，所以测试会全绿，而双击打开的页面直接报错。
      一个测试永远发现不了的失败方式，不该被选中。 补救不是没有 —— 注入前先写一行 __name 的垫片，再加一条真起子进程的测试来盯住它 ——
      但那是为了保住一个在这里没有任何收益的机制，凭空多出两处新东西。而生成页面脚本本来就是用模板
      字符串手写的（这个文件里已经这么干了），把函数体写成字符串常量是零额外机制。
      代价要说清楚：字符串常量那一份失去类型检查。所以那条「两边输出逐字相同」的测试不是锦上添花， 它就是这条决定的安全网，缺了它这个选择就不成立。

version: 1
project: ai-companion
overview: >
  三套「想法图」开发工作流，一个仓库里并排住着，各服务一个 agent： claude-companion（TypeScript，五个斜杠命令 + 七条
  hook 规则）、 cursor-companion（TypeScript，靠「写代码之前先拦一道闸门」来强制流程）、
  codex-companion（Python）。 共同的核心是一句话：项目里的每一个想法都是图上的一个节点，前置关系是唯一的边，
  每个节点必须回答八个问题。所有东西存在 ideas/graph.yaml 一个文件里。 它要解决的是同一个根因：想法从来没被写下来过，只有代码被写下来了。

  2026-08-25 重建：commit ca7e956 把旧的 monorepo（packages/ scripts/ skills/ docs/，
  即函数级变更追踪那一整套）移进 gitignore 的 archive/ 并从工作树上删除，只留在 git 历史和 tag
  pre-archive-2026-08-24 里。旧图的 I-001~I-019 描述的就是那批代码， 已经不是本仓库的活代码，因此整张图按人的决定重建，新
  id 从 I-041 起 （FORMAT.md 规定 id 永不复用）。

# 什么叫「这个项目做完了」（2026-08-25 由人在 /ccscan 第 2 步选定；
# 2026-08-29 /ccthink 新增 I-068「改图即改项目」；
# 2026-08-29 /ccthink 新增 I-075「共同基座：改一处三边生效」）
endpoints: [ I-057, I-058, I-059, I-068, I-075 ]
next_id: 102

ideas:

  # ─────────────────────────────────────────────────────────────
  # 地基：格式与引擎
  # ─────────────────────────────────────────────────────────────

  - id: I-041
    name: "想法节点的记录格式：每个想法必须回答八个问题"
    status: done
    needs: []
    what: >
      一个想法节点的格式：id / name / status / needs，加上八个必答问题
      （是什么、为什么有它、预期结果、如何实现、为什么这样实现、代码在哪几行、 如何验证、未来怎么用），外加一条 append-only 的 log。
    why: >
      AI 出幻觉、prompt 对不齐需求、返工之后自己也看不懂项目框架 —— 这三件事的 根因是同一个：想法从来没被写下来，只有代码被写下来了。
    expected: >
      同一个想法，人和 AI 读同一份记录得到同一个理解；一个冷启动的陌生 agent 读这个文件就能接着干，不需要额外上下文。
    how: >
      YAML，一个扁平的 ideas 列表，一种节点、一种边。规格写在 FORMAT.md： companion/FORMAT.md 是三个 agent
      共用的那一份，claude-companion/FORMAT.md 是迁移完成之前 Claude
      这一侧还在跑的那一份，两份的节点模板、八个问题的表和「如何验证」的两种写法必须字字对得上。 原来这里写的「三个 companion
      各有一份基本一致的副本」已经作废：各写各的正是措辞漂移的来源， 而且它与事实不符 —— codex 那边根本没有这份文件，cursor 那份是
      2026-08-28 之前的旧版、 缺「怎么写这张图」一整节。现在八个问题的措辞只有共同规范里那一张表算数。
    why_this_way: >
      选一层扁平结构而不是需求／特性／模块／函数四层 —— FORMAT.md 结尾写明：
      诉求是「所有想法都变成一个个模块」，模块不是分类法，四层结构本身就是让人 看不懂项目的那种复杂度。YAML 而不是
      JSON，因为八个回答都是成段散文。
    code:
      - file: archive/claude-companion/FORMAT.md
        lines: "1-160"
    verify:
      manual: "拿一个真实想法填一遍八问，看有没有哪个问题填不进去、或者填完还说不清这个想法"
      signed_off: "Zijia Tang 2026-08-31 —— 人的原话：「八问够用，40 个想法都填进去了，没有填不进去的」；由 ccbuild
        代录，原话见 ideas/log.claude.md"
    future: >
      整套工具的其它部分都只读写这一个格式；加字段的成本是一个 YAML key。
    log:
      - date: 2026-08-25
        by: ccscan
        note: 重建后的第一个节点；人工验证未签字，所以不是 done
      - date: 2026-08-29
        by: ccbuild
        note: FORMAT.md 新增「怎么写这张图」一节（四条写作规则），节点模板示例同步换成新风格；文件从 143 行长到 160 行，当时这个节点的
          lines 没跟着改
      - date: 2026-08-31
        by: ccbuild
        note: 三处过期数据已改 —— lines 143→160；how 里「三个 companion 各有一份基本一致的副本」作废（实测：codex
          那边根本没有 FORMAT.md，cursor 那份是 08-28 之前的旧版、缺「怎么写这张图」一节，而共同基座那份 545
          行压根不在这个节点的 code 里）；补记本条与上一条
      - date: 2026-08-31
        by: ccbuild
        note: 人已签字：「八问够用，40 个想法都填进去了，没有填不进去的」（signed_off 已录，原话在 log）；同轮修掉三处过期数据：lines
          143→160、how 里「三个 companion 各有一份副本」作废、补两条节点记录

  - id: I-042
    name: "读取想法图，并检查它有没有坏掉"
    status: done
    needs: [ I-041 ]
    what: >
      读 graph.yaml，检查 id 唯一、needs 指向存在的想法、图无环、done 的节点必须有 code 和 verify、done 的
      code 路径真的存在、人工验证必须有人签字； 八问里没填的字段报成警告。
    why: >
      没有校验，图会安静地烂掉：done 却没有代码、code 指向已删掉的文件、两个想法 互相依赖。烂掉的图比没有图更糟，因为它看起来是完整的。
    expected: >
      健康的图 check 通过、退出码 0；每一种烂法都能被指出来并说明是哪个 id。
    how: >
      DFS 三色标记查环；从 endpoints 反向遍历 needs 找出通不到任何终点的孤儿； existsSync 验证 done 节点的
      code 路径（todo 的不查 —— 那是计划中的位置）。
    why_this_way: >
      把「done 必须有 code + verify」做成硬错误而不是警告 —— 代码注释写明这是整套
      东西成立的前提：如果「完成」可以没有证据，这张图就只是一份愿望清单。 todo 的 code 路径刻意不查，否则计划本身会被当成错误。
    code:
      - file: archive/claude-companion/ideas.ts
        symbol: check
        lines: "260-327"
      - file: archive/claude-companion/ideas.ts
        symbol: findCycle
        lines: "119-137"
      - file: archive/claude-companion/ideas.ts
        symbol: orphans
        lines: "140-154"
    verify:
      command: "npx vitest run .devcompanion/tests/test_ideas_graph.test.ts"
      pass: "exit 0"
    future: >
      /ccbuild 动手前先跑它；/ccgraph 用它的输出告诉人接下来该做什么； guard 的 R5 用它拦住「回合结束时图是坏的」。

  - id: I-043
    name: "算出现在可以立刻动手做的想法有哪些"
    status: done
    needs: [ I-042 ]
    what: >
      算出现在可以做哪些想法：status 是 todo、且所有前置都已 done 的节点。
    why: >
      「接下来做什么」应该是图算出来的，不该是另一份要手动同步的 TODO 列表 —— 两份清单一定会不一致。
    expected: >
      next 打出来的就是可以立刻动手的想法；一个都没有时说清是全做完了还是全被挡住了。
    how: >
      一次过滤：status === todo 且 needs.every(前置已 done)。
    why_this_way: >
      不做拓扑排序 —— 代码注释写明「现在可以做什么」只需要一次过滤，做完一个再算一次即可， 少一个可能出错的地方。
    code:
      - file: archive/claude-companion/ideas.ts
        symbol: frontier
        lines: "111-116"
    verify:
      command: "npx vitest run .devcompanion/tests/test_ideas_graph.test.ts"
      pass: "exit 0"
    future: >
      /ccbuild 的入口；互不相干的、都可以立刻动手的想法可以并行交给多个 subagent。

  - id: I-044
    name: "修改想法状态时，自动留下一条修改记录"
    status: done
    needs: [ I-042 ]
    what: >
      改一个想法的状态，同时在它自己的 log 里追加一条记录；写回时保留 YAML 注释； 拒绝没有 code / verify 的
      done，拒绝没签字的人工验证。
    why: >
      改了什么代码、什么文档、什么想法要有详细记录，而原因要放在想法旁边， 不是另一个文件里 —— 放远了就没人读。
    expected: >
      set 之后重新读：状态变了、log 多了一条、原来的注释还在；对一个没有 code 的 想法 set done 会失败并说明原因。
    how: >
      yaml 的 parseDocument 保留注释和格式，setIn 定点修改，写临时文件再 rename。
    why_this_way: >
      走 Document 而不是 parse → 改 → stringify：后者会抹掉整个文件的注释和排版， 而注释正是人留给自己的东西。rename
      是原子的，写到一半崩溃不会毁掉原图 （代码注释：a crash mid-write leaves the old graph intact）。
    code:
      - file: archive/claude-companion/ideas.ts
        symbol: setStatus
        lines: "331-355"
      - file: archive/claude-companion/ideas.ts
        symbol: save
        lines: "95-99"
    verify:
      command: "npx vitest run .devcompanion/tests/test_ideas_graph.test.ts"
      pass: "exit 0"
    future: >
      五个命令都通过它写状态，所以不存在「忘了记一笔」这条路径。

  - id: I-045
    name: "把想法图渲染成一个可以点击、缩放的网页"
    status: done
    needs: [ I-042 ]
    what: >
      渲染成一个自包含网页：上面是只显示想法名称的完整项目图，可平移缩放； 点任意节点跳到下面的详情卡片，卡片里是八个问题的全部回答，以及它的前置想法和
      「它是哪些想法的前置」，两个方向都能继续点。
    why: >
      看不见形状的项目最后一定会被重写。图是给人看的，不是给机器看的， 而人要判断的三件事（节点做得太多、缺边、通不到终点）只有画出来才判断得了。
    expected: >
      双击打开 graph.html 就能一眼看出项目形状；缩放之后线条依然锐利； 拖拽不会被误判成点击节点。
    how: >
      Mermaid flowchart TD（CDN）做布局，节点标签只放 name，click 回调跳详情。 缩放靠改 SVG 自身的
      width/height 让矢量重画，平移靠 wrapper 的 translate。
    why_this_way: >
      用 Mermaid 而不是 d3 / cytoscape：静态 HTML，没有构建步骤也不用起服务器。 缩放刻意不用 CSS scale() ——
      代码注释写明 scale 会把图层栅格化一次再拉伸， 那正是之前看起来发虚的原因；fit 只缩不放，因为把一张小图放到 235% 不是
      任何人说「适应窗口」时想要的。
    code:
      - file: archive/claude-companion/ideas.ts
        symbol: render
        lines: "364-605"
    verify:
      command: "npx vitest run .devcompanion/tests/test_ideas_graph.test.ts"
      pass: "exit 0"
    future: >
      /ccthink 第 2 步用它让人在动手之前就看出拆分错了；/ccscan 用它交付结果。

  - id: I-046
    name: "用一张文件清单证明项目真的被读完了"
    status: done
    needs: [ I-042 ]
    what: >
      /ccscan 开始时把项目里值得读的文件列成一张清单（ideas/.scan-todo）， 每 Read 一个文件由 hook
      划掉一个；check 在清单没清空时持续警告。 ideas/.scanignore 可以按路径前缀排除（第三方包、别的 agent 的并行版本）。
    why: >
      「我读完了」是一句 agent 随口就能说的话。一张图如果是从半个项目上建起来的， 它看起来和完整的一模一样 —— 这比没有图更糟。
    expected: >
      扫描进度是「已读 37/42」这样的数字而不是一句保证；Grep / Glob 不算， 因为它们不把文件内容放进上下文。
    how: >
      git ls-files -z --cached --others --exclude-standard 生成清单 （拿不到 git
      时退化成目录遍历），按扩展名和 .scanignore 过滤； strike() 按大小写不敏感的相对路径划掉一行。
    why_this_way: >
      用 git ls-files 而不是自己遍历，因为它已经懂 .gitignore、子模块和大小写； 加 -z 是因为不加时 git 会把非
      ASCII 路径转义成八进制，那些文件就永远划不掉 （代码注释明确写了这一点）。node_modules 显式排除，因为仓库可能真的把它提交了。
    code:

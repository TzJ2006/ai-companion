  - id: I-100
    name: 切换收尾：修掉归档造成的失效断言，以及 2 大于 1 被当成写文件误拦
    status: done
    needs: []
    what: >
      2026-09-02 把三套旧实现搬进 archive/、把本仓库切到共同基座之后，留下两处需要收尾。 一处是三条测试断言：它们要求
      claude-companion/FORMAT.md 躺在仓库根目录，理由是 「七个仓库里已安装的五个命令文件按名字指着它」——
      那些命令文件也一起归档了，六个 外部仓库现在装的是技能，所以这个前提本身已经不成立，断言要跟着搬到 archive/ 下面。 另一处是守卫的
      shell 闸门把 2>&1 判成了写文件：它只看见那个大于号，看不出这是把 标准错误并进标准输出的文件描述符操作，落地的不是文件。
    why: >
      第二处是每天都会碰到的：一条最普通的 npx vitest run ... 2>&1 | grep 会被拒， 而拒绝话术还教人「把重定向去掉」——
      那是一句没法照做的建议，因为要看的正是标准 错误。守卫拦住正当工作的次数一多，人就会开始整段关掉 AIDEV_GUARD，那才是真正的
      损失：一个被绕过去的闸门比没有闸门更糟，因为它还让人以为有保护。 第一处不修则是留着三条红的测试，而这个仓库刚刚才把「文档和代码不许说反话」写成
      规矩，红着的断言就是最刺眼的反例。
    expected: >
      npx vitest run --dir .devcompanion/tests 全绿； node .companion/companion.mjs
      allow 对一条带 2>&1 的只读命令回答放行； 同时 printf ... > src/x.ts 这类真正落地成文件的重定向仍然被拒。
    how: >
      守卫那半边：companion/guard.ts 里的 REDIRECT 现在是 /(?:^|[^<])(<>|>{1,2})/。
      要把「文件描述符复制」从「写文件」里摘出来 —— 形如 数字>&数字 和 >&数字 的写法
      落地的是描述符不是文件，先把它们从命中里排除掉，再判剩下的重定向。2>/dev/null 和 2>NUL
      同理：目标是空设备，不是产品文件，按目标判而不是按符号判。 测试那半边：test_base_skills.test.ts 里 the frozen
      twin spec 一节，twin() 指向
      archive/claude-companion/FORMAT.md，并把「必须在根目录存在」这条断言反过来 ——
      根目录下不许再有第二份，archive/ 里必须有一份。
    why_this_way: >
      不直接把 2>&1 整串加进白名单，是因为白名单只认得这一种拼法，而 2>&1、1>&2、 >&2、3>&1
      是同一件事的四种写法，一条一条加迟早漏。按「重定向的目标是不是一个 文件」来判，才是这条规则本来想问的问题 —— 这和这一轮把受保护证据改成「按目标
      防守而不是按动词防守」是同一个思路，那次也是枚举漏了 dd、install、tar 才补上的。
    code:
      - file: companion/guard.ts
        symbol: NON_FILE_REDIRECT, mutatingShell
        lines: 731-742,832-838
      - file: .devcompanion/tests/test_base_skills.test.ts
        symbol: the frozen twin spec (H25)
        lines: 109-143
    verify:
      command: npx vitest run --dir .devcompanion/tests test_base_guard_shell_targets
        test_base_skills
      test_files:
        - .devcompanion/tests/test_base_guard_shell_targets.test.ts
        - .devcompanion/tests/test_base_skills.test.ts
      pass: exit 0
    future: >
      这是切换当天的收尾，做完就没有后续。它留下的那条经验写进 FORMAT.md 的 D21 里： shell
      闸门每一次误拦，都是「按符号判」而不是「按落地结果判」造成的。
    log:
      - date: 2026-09-02
        by: new
        note: 创建
      - date: 2026-09-03
        by: claude
        note: 两道批准已到，开工

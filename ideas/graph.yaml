  - id: I-014
    name: "函数级变更追踪核心"
    status: done
    needs: []
    what: >
      把一次 git diff 解析成「哪些函数改了、改了什么、为什么改」：tree-sitter 解析 Python/TypeScript
      出函数，给每个函数算一个不随行号变动的身份哈希，把 diff hunk 归因到函数，存成 JSON 历史，再渲染成自包含 HTML 报告。
    why: >
      在 git blame 的「谁改了什么」之上，补上「为什么改」和「改了哪个函数」这一层语义。
    expected: >
      给定一个 git diff，得到函数级别的变更清单并存进历史；同一个函数在文件里上下移动， 算出来的哈希完全相同。
    how: >
      六个包单向串成一条链：types（只有接口）→ ast（wasm-resolver 定位 .wasm、 parseFileAuto
      按扩展名分发、identity 算哈希）→ core（diff 解析 + annotateChanges 归因）→ history（JSON 存储
      + index.json）→ render（HTML）→ cli（aidev 八条子命令）。 身份 =
      sha256(文件路径::类名::函数名::参数 name:type)[0:16]。
    why_this_way: >
      用代码结构而不是行号算身份，函数被反复编辑、挪动位置，历史仍然连贯； 用 WASM 解析器免去本地编译原生模块；存 JSON 不依赖数据库，因为这个
      companion 要能直接塞进任何仓库，而且存下来的东西人可以直接打开看。 （理由取自
      docs/ecl/dag/ai-companion.ecl.yaml 的 Foundation 层记录。）
    code:
      - file: packages/ast/src/identity.ts
        symbol: computeFunctionIdentity
        lines: "4-32"
      - file: packages/core/src/diff/annotator.ts
        symbol: annotateChanges
        lines: "28-78"
      - file: packages/history/src/store.ts
        symbol: HistoryStore
        lines: "305-710"
    verify:
      command: "npx vitest run
        .devcompanion/tests/test_ast_computeFunctionIdentity.test.ts
        .devcompanion/tests/test_diff_annotateChanges.test.ts
        .devcompanion/tests/test_store_HistoryStore.test.ts"
      pass: "exit 0"
    future: >
      任何想「按函数问历史」的东西都读它：报告、dashboard、/ccfix 的历史追溯。


  - id: I-091
    name: "吸收 Codex 版的测试先行证据：先留下一次真实失败的测试记录，完成时必须有最新的通过记录"
    status: done
    needs: [ I-090 ]
    what: >
      run-check 命令替 agent 跑验证命令，把退出码、输出末尾和测试文件的内容指纹记进
      ideas/.runtime/：实现之前必须有一次「测试真的失败了」的记录（叫 RED）；实现文件 每写一次，旧的通过记录（叫
      GREEN）就过期；标 done 必须有当前有效的 GREEN 或人 签过字的人工验收。测试还没实现就意外通过的，要人批一次豁免才能继续。
    why: >
      只检查「测试文件存在」分不清真失败的测试和一个空文件（Claude 版现状）；Cursor 版对测试先行完全不设防。Codex
      已经证明「测试先于实现」可以用证据落实；裁决表 D8/D20 裁定共同基座不许比它弱。
    expected: >
      没有 RED 记录时，写实现文件被拒；GREEN 之后又改了实现、不重跑就标 done，被拒；
      改了测试文件，旧证据立刻作废；意外先绿不经人批豁免就无法推进。
    how: >
      run-check 子命令带 --phase red|green：在项目根跑 verify.command（沿用 Cursor 版的 120
      秒超时和 Windows 找不到命令时的重试），把退出码、输出末尾 两千字、verify.test_files 每个文件的 sha256 存进
      ideas/.runtime/ 的每想法 记录；守卫的写后记录对产品文件写入递增一个单调计数器，GREEN 记录存它运行 时的计数器值；set
      done 时重新校验 GREEN 存在、计数器未落后、测试哈希未变。 red 阶段退出码为 0 记成「意外先通过」，此后必须有 I-090
      的豁免回执才放行 实现写入。
    why_this_way: >
      备选是保留 Claude 版「测试文件存在即可」—— 分不清真失败的测试和空文件， D8 裁决明确不回退 Codex
      的证据链。用单调计数器而不是时间戳判「过期」， 因为时间戳分辨率低还可能回拨，计数器只由 hook 驱动；测试文件哈希绑定防 「事后改测试」。机制照
      codex-companion 已验证的行为移植，它的相应 Python 测试改写成 vitest 作为移植清单。
    code:
      - file: companion/ideas.ts
        symbol: runCheck / redGateReady / greenCurrent / recordChange 与 set 的 GREEN 门
        lines: "710-836"
    verify:
      command: "npx vitest run .devcompanion/tests/test_base_evidence.test.ts"
      test_files: [ .devcompanion/tests/test_base_evidence.test.ts ]
      pass: "exit 0"
    future: >

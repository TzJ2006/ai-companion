  - id: I-079
    name: "本地小服务：当场把想法图渲染给浏览器，并接住浏览器发回来的改动"
    status: done
    needs: [ I-065 ]
    what: >
      引擎新增一个子命令，启动一个只监听本机的小服务：当场把当前的图渲染成网页送给浏览器，
      接住浏览器发回来的改动记录，先回一份逐条对照给人确认，人确认之后调用写回逻辑落盘， 再把新的图送回页面。人关掉它就结束。
    why: >
      浏览器里的网页写不了磁盘，所以改完之后要人手动搬一个文件、再敲一条指令 ——
      这是整条链路里最别扭的一段，也是「改了图不好同步」的真正来源。一个本机小服务 能把这一段变成「点一下就存好了」。
      顺带治好另一个一直存在的毛病：磁盘上那份网页是生成出来的，会过期； 服务模式下根本不存在那个文件，看到的永远是当前的图。
    expected: >
      跑起来之后浏览器能打开图；在页面上改一处、提交，图文件真的变了，而且页面上显示的是改完之后的新图；
      图在这期间被别的会话改过时，整体拒绝并说清楚为什么； 服务只接受来自本机的请求，并且写操作必须带上本次启动生成的那个令牌。
    how: >
      用 Node 自带的 http 模块，不引任何框架。只绑本机回环地址，不是绑到所有网卡上。
      启动时生成一个一次性令牌，只写进当场渲染出去的那份页面里；任何写操作没带对令牌一律拒绝。
      三条路径：一条返回当场渲染的页面，一条健康检查（供页面探测有没有服务），一条接收改动。
      接收那条分两步：先只算不写，把逐条对照回给页面；人点了确认，再带着同一份记录调用写回逻辑。 写回复用同一个 apply 核心，绝不另写一份 ——
      所以指纹校验、坏图不落盘、写日志全部照旧。 端口给一个默认值，被占用就往上加一，把最终地址打印出来并尝试打开浏览器。 人按 Ctrl-C
      或者关掉窗口就结束。
    why_this_way: >
      这是这类工具的行业标准形状（本地内容管理工具的 local backend 就是这么做的）。 调研里我一开始否掉了它，理由是「会破坏双击即用」——
      而人要的正是「双击即用的那种服务」， 所以那个理由不成立了，这里如实记下来。 用 Node 自带的 http
      而不是任何框架：路由只有三条，框架是纯负担；而且这个引擎的设计前提就是 装到别的仓库不需要装任何东西。 写回必须复用 apply
      而不是自己再写一遍：两个写入口意味着两套校验，迟早分叉， 而分叉的那一天是「网页存进去的图和命令行存进去的图不一样」。
      安全边界要写明白：这个服务对图文件有写权限，而图正是守卫在保护的账本。判断是可以接受， 因为它没有给出 agent 现在拿不到的任何能力 ——
      守卫只挂在 Edit / Write 上，Bash 从来不经过它， agent 现在就能直接跑引擎的 set
      子命令。这是仓库里已经如实记录过的天花板，堵它是另一个想法的事。 所以这个服务不是新开一扇门，是在已经开着的那扇门边上加一个好用得多的把手。
      防护做三件便宜的事：只绑本机、一次性令牌、写入永远走 apply 的完整校验。
      被参考的那个工具自己的文档也警告它的服务是无鉴权的、只该本地开发用；这里比它多一层， 因为写入要过校验 ——
      而且最关键的一点没有被触碰：批准仍然只能由人亲手打字产生， 服务碰不到那条路径。

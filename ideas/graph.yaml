      pass: "exit 0"
    future: >
      任何「必须由人点头」的关卡都可以用同一招：绑到 agent 造不出来的事件上。

  # ─────────────────────────────────────────────────────────────
  # 工作流：五个命令
  # ─────────────────────────────────────────────────────────────

  - id: I-049
    name: "五个斜杠命令，覆盖从建图到实现的完整工作流"
    status: doing
    needs: [ I-041, I-043, I-044, I-045 ]
    what: >
      /ccscan 通读项目建图、/ccthink 对齐→拆分→调研→设计测试→按周排期、 /ccbuild 测试先行地实现、/ccfix
      先查代码与想法是否一致再查想法本身、 /ccgraph 只看不改。每个都是一份 markdown 提示词。
    why: >
      引擎只是数据结构，真正决定产出质量的是「按什么顺序做事」。 一句 prompt 对不齐需求，返工的成本远高于先花二十分钟对齐。
    expected: >
      每个命令在真实项目上跑一遍，产出的是它承诺的东西： /ccscan 给出诚实的覆盖数字和一份「我也不知道」的清单， /ccfix
      给出带行号的不一致而不是泛泛而谈。
    how: >
      纯 markdown，步骤固定不可跳；关键处停下来等人（ccthink 第 2 步审拆分、 ccfix 第 1
      步审不一致、所有命令的最后等「批准」）。
    why_this_way: >
      /ccthink 把「能借就借」设成命令里优先级最高的规则，并把调研放在回答 「如何实现」之前 —— 否则调研只会变成给已有答案找依据。
      /ccfix 刻意不让 AI 自己判断代码和想法哪边对：它恰恰是判断不了的那一方。 /ccscan 明确禁止编造
      why_this_way，因为编出来的理由会被下一个 agent 当成 事实并一直维护下去，这是这个命令能造成的最大伤害。
    code:

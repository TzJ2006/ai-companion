          属性、每行带真锚点地址（跳转函数在联网取画图库的模块里，断网时不执行）、行上不带签字标记（否则会静默劫持签字测试的五处定位）、零条时整块不出现。判断条件复用签字按钮那一个，不另写。test_render_worklist.test.ts

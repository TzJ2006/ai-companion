prompt_calibration:
  raw_input: |
    最近 Claude Code 有一个新功能就是它可以把 effort 设置成 ultracode，
    这样它可以启动多任务并行。我认为这个项目的 onboarding 非常适合用这个来做。
    研究一下怎么把它改成这个。
    (User also pasted a claude-code-guide explainer distinguishing effort=max from
    ultracode: ultracode = effort xhigh + standing permission to orchestrate
    multi-agent Workflows / spawn parallel subagents.)
  status: completed

  intent_decomposition:
    total_intents: 1
    total_tracks: 1
    tracks:
      - track_id: T1
        name: "Parallelize onboarding via multi-agent workflow"
        priority: 1
        intents:
          - raw: "把项目的 onboarding 改成 ultracode 多任务并行"
            type: refactor

  tracks:
    T1:
      calibrated_scenario: |
        Re-architect the AI Dev Companion onboarding so its embarrassingly-parallel
        but currently-sequential LLM work fans out across concurrent subagents —
        using Claude Code's ultracode / Workflow multi-agent orchestration — instead
        of running in a single sequential context (the /cconboard 8-phase skill) or a
        concurrency=4 subprocess pool (scripts/lib/onboarding-pipeline.ts).
        Parallelizable units: per-function analysis, per-module/directory ECL feature
        inference, per-function test generation, and (optionally) per-modification code
        restructuring. Goal: large wall-clock reduction on big codebases while
        preserving correctness (git-commit cache, adaptive throttle, characterization-
        test safety net, feature guards).
      intent_dimensions:
        task: { status: present, value: "Convert onboarding to multi-agent parallel workflow" }
        input: { status: enriched, value: "Existing onboarding-pipeline.ts (analysis+ECL+tests) + cconboard 8-phase skill (full refactor)" }
        output: { status: implicit, value: "Parallel onboarding architecture; this ECL plan handed to /ccedit" }
        constraints: { status: enriched, value: "Workflow tool is IN-SESSION ONLY; a headless npx tsx script can only spawn `claude -p` subprocesses, not call Workflow" }
        context: { status: enriched, value: "callClaude() spawns Claude CLI subprocess (packages/llm/src/caller.ts); only analyzeAllFunctions parallel (concurrency 4, adaptive→2)" }
        audience: { status: implicit, value: "Developers onboarding large/legacy codebases; possibly CI" }
        memory: { status: present, value: "onboarding-llm-analysis.yaml = current serial pipeline (phase-5); ccedit-skill.yaml = planned DAG/parallel-subagent executor (phase-10)" }
        success_criteria: { status: missing, resolved: "To be defined in Phase 2 (wall-clock target + correctness invariants)" }
        examples: { status: missing, deferred: true }

  anti_patterns_found:
    - category: scope
      raw: "把它改成这个 / 'the onboarding'"
      fix: "Ambiguous surface (script pipeline vs cconboard skill vs unified). Disambiguated by Q1 (execution model) + Q2 (scope)."
    - category: scope
      raw: "ultracode 多任务并行 (must use ultracode)"
      fix: "Technology-prescriptive. Verified PARTIAL fit: the true Workflow tool runs in-session only; a headless script can only emulate fan-out via concurrent `claude -p` subprocesses. Surfaced as Q1 so the user chooses knowingly."
    - category: task
      raw: "研究一下 (research how)"
      fix: "Deliverable scoped: an ECL plan (this document) handed to /ccedit. ccplan plans, it does not implement."

  context_enrichment:
    codebase: |
      - LLM calls route through packages/llm/src/caller.ts::callClaude() which SPAWNS the
        Claude Code CLI: `claude -p --output-format text --model {model}` (per-call subprocess).
      - onboarding-pipeline.ts::runOnboardingAnalysis is SERIAL except analyzeAllFunctions
        (enhanced-analyzer.ts) which uses chunked Promise.allSettled, concurrency=4, adaptive→2.
      - Hard serial deps: projectContext → function analysis; Opus understanding → Opus ECL;
        all → ECL write / test gen. Two Opus calls (120s + 180s) ≈ 45% of wall-clock.
      - Unrealized parallelism: per-directory generateFeatureDescription (semantic-ecl-inferrer,
        not currently called); per-function test-skeleton gen (heuristic, fast). Duplicate
        collectProjectMetadata() call.
      - cconboard SKILL (8 phases) is fully sequential, single context. Phase 5 (execute)
        modifies code → would need worktree isolation if parallelized.
    git: "claude-caller.ts DELETED (commit 38a8f44), replaced by packages/llm/src/caller.ts (CLI subprocess)."
    conversation: "User pasted claude-code-guide explainer: ultracode = effort xhigh + standing Workflow-orchestration permission; distinct from effort=max (deep single-context)."

  questions_asked: 2
  questions_skipped: "Fan-out granularity (function vs module vs file) deferred to Phase 3 divergent exploration."


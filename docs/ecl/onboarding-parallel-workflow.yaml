# ─── Decisions Log ─────────────────────────────────────────────
decisions:
  - id: DEC-001
    date: "2026-05-31"
    phase: 0
    decision: "Execution model = in-session Workflow (true ultracode). /cconboard authors & runs a Workflow that fans out subagents."
    rationale: "User explicitly wants the ultracode multi-agent mechanism, which is in-session only."
    alternatives_considered:
      - "Headless multi-process (claude -p DAG) — not the Workflow tool; emulated fan-out."
      - "Both dual-path — deferred to Q1 (headless fate)."
    reversible: true
  - id: DEC-002
    date: "2026-05-31"
    phase: 0
    decision: "Scope = full onboarding incl. the code-modification execute phase (cconboard Phase 5), not analysis-only."
    rationale: "User chose maximum scope. Requires worktree/partition isolation + DAG ordering for parallel edits."
    alternatives_considered:
      - "Analysis-only — safer/easier; rejected by user."
      - "Phased analysis-first — may re-emerge in Q3 (execute-safety)."
    reversible: true
  - id: DEC-003
    date: "2026-05-31"
    phase: 2
    decision: "Keep the headless pipeline (onboarding-pipeline.ts) as a fallback for CI/batch/dashboard; add the in-session Workflow as a NEW fast path built on the SAME per-unit functions."
    rationale: "Existing consumers (run-onboarding.ts, batch-overview.ts, dashboard) call runOnboardingAnalysis() programmatically; Workflow can't run headless. Shared building blocks prevent the two paths from diverging."
    alternatives_considered: ["Deprecate headless — breaks batch/dashboard.", "Parallelize headless too via claude -p DAG — two orchestrators to maintain."]
    reversible: true
    resolves: REQ-006
  - id: DEC-004
    date: "2026-05-31"
    phase: 2
    decision: "Success = wall-clock target: a ~500-function repo onboards in roughly 1/3 of current sequential time (~10-11 min -> ~3-4 min). Characterization tests + feature guards are ABSOLUTE non-regressions."
    rationale: "User selected a concrete wall-clock target over a loose 'faster' gate or pure scale ceiling."
    reversible: true
    resolves: REQ-004
    superseded_by: DEC-011   # ~1/3 target revised to Amdahl-derived >=2x speedup
  - id: DEC-005
    date: "2026-05-31"
    phase: 2
    decision: "Parallel-execute isolation = partition by module into disjoint file sets (no two agents touch the same file -> no merge step). Edits within an agent stay sequential under the char-test+revert guard; dependency-crossing / high-risk items run serially after the parallel tier."
    rationale: "Conflict-free by construction; avoids git-worktree merge complexity. Matches the aggregateFunctionsByDirectory grouping already in the codebase."
    alternatives_considered: ["Worktree-per-agent + merge — merge-conflict resolution complexity.", "Keep execute serial — walks back DEC-002."]
    reversible: true
    resolves: REQ-002
  - id: DEC-006
    date: "2026-05-31"
    phase: 3
    decision: "Architecture = Composite: two-phase (analysis fan-out -> batched gate -> partitioned execute) + module-sharded no-barrier pipeline + subagents that shell the existing pipeline functions + execute-DAG aligned with ccedit ExecutionLayer."
    rationale: "Best balance of speed, safety, and reuse. Adversarial verify kept as an optional toggle (FEAT-008)."
    alternatives_considered:
      - "Two-phase-only — less reuse, no ccedit unification."
      - "Reuse-ccedit-DAG — hard-couples to ccedit which is itself unbuilt (phase-10)."
      - "Map-reduce+verify — +tokens; demoted to optional FEAT-008."
    reversible: true
  - id: DEC-007
    date: "2026-05-31"
    phase: 3
    decision: "Fan-out granularity = ADAPTIVE by repo size/budget for the read-only ANALYSIS phase (function | module | package). The EXECUTE phase stays partition-by-MODULE regardless (disjoint files) for conflict-free safety."
    rationale: "User chose adaptive. Reconciliation: analysis granularity is elastic; execute granularity is FIXED at module for safety (DEC-005). Analysis shards and execute shards are computed independently via buildShards(unit)."
    reversible: true
  - id: DEC-008
    date: "2026-05-31"
    phase: 5
    decision: "Collapse the claude-in-claude nesting (F-01). A Workflow analysis subagent does the LLM analysis DIRECTLY in its own context (reads the shard's function bodies, returns schema-validated FunctionAnalysis[]). The shard CLI (analyze-shard.ts) becomes DATA-PREP ONLY (parse + extract function bodies -> emit AnalysisInput[] JSON); it does NOT call callClaude(). Removes the inner `claude -p`, ~halving LLM cost/latency per unit."
    rationale: "The wrapping subagent was paying for two LLM context-windows to do one LLM's job, plus a `npx tsx` cold start per shard."
    reversible: true
    resolves: F-01
    refines: [MOD-003, FN-006, FN-007]
  - id: DEC-009
    date: "2026-05-31"
    phase: 5
    decision: "Execute isolation unit = the modification's EDIT-SET (target file + its import-closure), not the single source file (F-02). Shards are disjoint by edit-set. split_module / move_file / cross-module inject_dependency are NEVER parallel-safe -> always run in the serial dependency-crossing tail. Only low-risk in-file edits (add_types, add_docstring, local extract_function) parallelize; the plan must report the parallelizable %."
    rationale: "Realistic structural refactors mutate importers in other shards; 'disjoint files' was false."
    reversible: true
    resolves: F-02
    supersedes_part_of: DEC-005
    refines: [REQ-002, FN-005, FN-010]
  - id: DEC-010
    date: "2026-05-31"
    phase: 5
    decision: "Gate ownership (F-06): WF1 and WF2 are TWO SEPARATE Workflow invocations with a SESSION-LEVEL barrier. WF1 terminates -> returns Modification[] to the cconboard session -> the SESSION runs the single AskUserQuestion batch gate -> authors WF2 from the approved subset -> launches WF2. The analysis-cache git_commit is re-validated at WF2 launch; stale -> re-analyze affected shards."
    rationale: "A plain-JS Workflow cannot call AskUserQuestion; the gate must live in the session between two workflow runs."
    reversible: true
    resolves: F-06
    refines: [FEAT-004, FN-013]
  - id: DEC-011
    date: "2026-05-31"
    phase: 5
    decision: "Scaling + target (F-04/F-08/F-09): concurrency cap = the Workflow tool's per-workflow cap (min(16, cores-2)); selectGranularity targets ~2-3x cap shards. Global throttle/backpressure lives in the Workflow ORCHESTRATOR (reduce next-wave concurrency on shard failures), not per-shard. Wall-clock target RE-DERIVED by Amdahl: with the Opus reduce tail parallelized (FEAT-009), target >=2x speedup (<=~0.5x baseline) on a ~500-fn repo — NOT 1/3. Correctness invariants remain absolute."
    rationale: "Cap was undefined though load-bearing; per-shard throttle gave no global backpressure; ~1/3 was below the Amdahl floor (~0.45x) set by the serial Opus tail."
    reversible: true
    resolves: [F-04, F-08, F-09]
    supersedes: DEC-004
    refines: [REQ-001, REQ-004, FN-004, FN-016]
  - id: DEC-012
    date: "2026-05-31"
    phase: 5
    decision: "Decouple from ccedit (F-07): onboarding defines its OWN minimal execute-DAG contract (topo order + edit-set-disjoint partition + char-test guard). 'Align with ccedit ExecutionLayer' is downgraded to a NON-BLOCKING future-unification note, not an implementation dependency."
    rationale: "ccedit is unbuilt (phase-10); DEC-006 had reintroduced a coupling it had itself rejected — internal contradiction."
    reversible: true
    resolves: F-07
    refines: [DEC-006, FEAT-005, MOD-007]
  - id: DEC-013
    date: "2026-05-31"
    phase: 9
    decision: "User APPROVED the plan at the Phase 9 review gate. Handoff to /ccedit; ccplan writes no implementation code."
    rationale: "Validated through adversarial filtering (14 findings) + red-blue confrontation (12 attacks), all resolved/mitigated; RISK-004 (low speedup on cyclic-legacy repos) accepted with REQ-014 mitigation."
    reversible: false


# ─── Functions (Phase 4 — key atomic items) ───────────────────
functions:
  - id: FN-001
    name: "analyzeShard"
    parent: MOD-001
    visibility: public
    description: "Analyze all functions in one shard via analyzeSingleFunction; preserve adaptive throttle + heuristic fallback."
    side_effects: ["network (claude -p subprocess)"]
    dependencies: ["analyzeSingleFunction"]
    constraints: ["Throttle on repeated failure; fall back to heuristic; deterministic shard boundaries."]
  - id: FN-002
    name: "inferModuleEcl"
    parent: MOD-001
    visibility: public
    description: "Per-module ECL feature description (reuse generateFeatureDescription) + verification commands."
    dependencies: ["generateFeatureDescription", "generateVerificationCommands"]
  - id: FN-003
    name: "genShardCharTests"
    parent: MOD-001
    visibility: public
    description: "Generate characterization-test skeletons + LLM assertions for a shard's functions."
    dependencies: ["generateFunctionTestSkeleton"]
  - id: FN-004
    name: "selectGranularity"
    parent: MOD-002
    visibility: public
    description: "Choose fan-out unit (function|module|package) from function count + optional token budget (DEC-007)."
    constraints: ["Bounded agent count; large repos -> coarser unit so agents stay <= useful concurrency."]
    test_cases:
      - { input: "fnCount=40", expected: "'function'" }
      - { input: "fnCount=600", expected: "'module'" }
      - { input: "fnCount=5000", expected: "'package'" }
  - id: FN-005
    name: "buildShards"
    parent: MOD-002
    visibility: public
    description: "Partition inputs into shards with DISJOINT file sets so parallel execute never conflicts (DEC-005)."
    constraints: ["Every file in exactly one shard; a function's file stays within its shard."]
  - id: FN-006
    name: "analyzeShardCli"
    parent: MOD-003
    visibility: public
    description: "DATA-PREP CLI (DEC-008): read project + shard id -> parse + extract function bodies -> print AnalysisInput[] JSON. NO LLM call. The subagent does analyzeShard/inferModuleEcl/char-test-assertion work in-context from this JSON."
    side_effects: ["filesystem (read source; write .devcompanion/shards/<id>.json)"]
  - id: FN-007
    name: "onboardAnalyzeWorkflow"
    parent: MOD-004
    visibility: public
    description: "Workflow script: pipeline(shards, analyze->ecl->charTests); agent() shells analyze-shard CLI; returns merged analysis."
    constraints: ["Plain JS, no fs/Node API; schema-validated agent output; .filter(Boolean) for skipped agents; respect concurrency cap."]
  - id: FN-008
    name: "buildRestructurePlan"
    parent: MOD-005
    description: "From analyses, generate modification items with risk levels + depends_on DAG (cconboard Phase 4 rules)."
  - id: FN-009
    name: "partitionByRisk"
    parent: MOD-005
    description: "Split modifications into auto (low-risk) vs gated (medium/high) for the single batched gate."
  - id: FN-010
    name: "applyModificationGuarded"
    parent: MOD-006
    visibility: public
    description: "char test before -> apply -> char test after; PASS = log ChangeRecord + update hash; FAIL = PATH-SCOPED revert + escalate risk."
    constraints:
      - "Mirrors cconboard Phase 5 protocol; per-modification atomicity; edit only within the shard's edit-set (DEC-009)."
      - "Revert = restore the recorded before_content to the exact file (F-10); NO repo-wide git checkout/stash/index ops in shard processes."
  - id: FN-011
    name: "executeShardCli"
    parent: MOD-006
    description: "CLI: apply one shard's approved modifications via applyModificationGuarded; emit per-mod status JSON."
    side_effects: ["filesystem (edits scoped to the shard's disjoint files only)"]
  - id: FN-012
    name: "onboardExecuteWorkflow"
    parent: MOD-007
    description: "Workflow script: parallel(shards shelling execute-shard CLI) then serial cross-dep/high-risk tail."
  - id: FN-013
    name: "cconboardParallelMode"
    parent: MOD-008
    description: "Skill logic: detect Workflow availability; author/run WF1, present batch gate, run WF2; else sequential fallback."
  - id: FN-014
    name: "runOnboardingAnalysisOnUnits"
    parent: MOD-009
    description: "Refactor runOnboardingAnalysis to delegate to MOD-001 units (headless path keeps current behavior; dedup metadata)."
  - id: FN-015
    name: "generateFeatureGuards"
    parent: MOD-010
    description: "Generate feature_guard entries from refactored modules' invariants + verification (reuse existing guard schema)."
  - id: FN-016
    name: "verifyWallClock"
    parent: MOD-010
    description: "Compare run duration vs sequential baseline for fn-count; report pass/fail vs DEC-011 (>=2x speedup) target."
  - id: FN-017
    name: "summarizeModuleForOpus"
    parent: MOD-011
    description: "Per-module Opus pre-summary, fanned out during WF1 (replaces part of the monolithic generateOpusProjectUnderstanding)."
  - id: FN-018
    name: "mergeOpusSummaries"
    parent: MOD-011
    description: "One cheap merge call combining module pre-summaries into the final OpusEclResult; replaces the 2 big serial Opus calls. MUST try/catch + fallback (2-call path or deterministic assembly) and cap+validate output to survive a malformed/truncated merge (ATK-05)."


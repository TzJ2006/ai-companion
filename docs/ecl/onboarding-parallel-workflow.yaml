# ─── Requirements (hypotheses — validated in Phase 2) ──────────
requirements:
  - id: REQ-001
    text: "Fan out read-only analysis (per-function analysis, per-module ECL inference, characterization/skeleton test generation) across concurrent subagents via an in-session Workflow."
    status: validated
    confidence: 0.85
    source: user-stated
    priority: must
    acceptance_criteria:
      - "Per-function/per-module analysis runs concurrently up to the Workflow concurrency cap."
      - "Adaptive-throttle + heuristic fallback behavior preserved."
    challenges: ["Fan-out granularity (function vs module vs file) — open, Phase 3 selection."]
  - id: REQ-002
    text: "Parallelize the code-modification execute phase with partition-by-module isolation + dependency-DAG ordering, preserving per-modification char-test + revert safety."
    status: validated
    confidence: 0.75
    source: user-stated
    priority: must
    acceptance_criteria:
      - "Agents own disjoint file sets — no two concurrent agents modify the same file (DEC-005)."
      - "Every modification: char test before + after; fail -> revert; log ChangeRecord."
      - "Dependency-crossing / high-risk items execute serially after the parallel tier."
    challenges: ["Medium-risk confirmation gates vs autonomous fan-out — see REQ-005."]
  - id: REQ-003
    text: "Preserve all correctness invariants under parallelism: char-test safety net, feature guards, git-commit analysis cache, adaptive throttle."
    status: validated
    confidence: 0.85
    source: inferred
    priority: must
    acceptance_criteria: ["Parallel run yields same or better correctness than serial; no guard bypass."]
  - id: REQ-004
    text: "Meet the wall-clock success target for large codebases (DEC-004)."
    status: validated
    confidence: 0.8
    source: user-stated
    priority: should
    acceptance_criteria:
      - "~500-function repo: parallel wall-clock <= ~1/3 of sequential baseline (~10-11 min -> ~3-4 min)."
      - "Correctness invariants (char tests, guards) never regress vs serial — absolute."
  - id: REQ-005
    text: "Reconcile interactive gates (medium-risk confirmations, Phase-9 review) with autonomous parallel fan-out."
    status: validated
    confidence: 0.8
    source: inferred
    priority: should
    acceptance_criteria: ["All medium/high-risk modifications batched into ONE human gate BEFORE the parallel execute tier (proposed — confirm Phase 4)."]
    challenges: ["Workflow agents run autonomously; cannot pause per-item mid-fan-out."]
  - id: REQ-006
    text: "Keep the headless pipeline as fallback (CI/batch/dashboard); add the in-session Workflow fast path on shared per-unit functions (DEC-003)."
    status: validated
    confidence: 0.9
    source: inferred
    priority: must
    acceptance_criteria: ["runOnboardingAnalysis() still works headless; Workflow path reuses the same per-unit functions, not a fork."]
  - id: REQ-007
    text: "Isolate test output per shard: each shard writes char/skeleton tests under .devcompanion/tests/<shardId>/ and runs only its own tests; no two shards write the same path (or: shards only WRITE tests, suite runs once in the serial tail)."
    status: validated
    confidence: 0.8
    source: critic-proposed
    priority: must
    acceptance_criteria: ["No two shards write the same test path.", "Each runner executes only its shard's tests; fileParallelism:false single-runner assumption not violated."]
    history: [{ phase: 5, action: "Created from F-03", date: "2026-05-31" }]
  - id: REQ-008
    text: "Global throttle/backpressure across shards — the Workflow orchestrator reduces concurrency on aggregate failures; no per-shard runaway under rate-limiting."
    status: validated
    confidence: 0.8
    source: critic-proposed
    priority: must
    acceptance_criteria: ["Aggregate shard-failure signal lowers the next-wave concurrency (DEC-011)."]
    history: [{ phase: 5, action: "Created from F-04", date: "2026-05-31" }]
  - id: REQ-009
    text: "Shard-keyed analysis cache + deterministic merge into the legacy commit-keyed analysis.json, with a defined key bridging adaptive-analysis-shards -> module-execute-shards; headless reuse (REQ-006) preserved."
    status: validated
    confidence: 0.75
    source: critic-proposed
    priority: must
    acceptance_criteria: ["Per-shard cache carries its own input hash; merge yields the same analysis.json the headless path expects.", "A module-execute-shard can look up its inputs regardless of the analysis granularity used."]
    history: [{ phase: 5, action: "Created from F-05", date: "2026-05-31" }]
  - id: REQ-010
    text: "Robust analysis-cache keying: never treat git 'unknown' as a cache hit; fall back to a content/tree hash; namespace cache by repo path (no cross-repo/branch reuse)."
    status: validated
    confidence: 0.8
    source: probe-result
    priority: must
    acceptance_criteria: ["A non-git or commit-less tree never reuses another tree's cache.", "Cache key distinguishes different trees."]
    history: [{ phase: 8, action: "Created from ATK-03", date: "2026-05-31" }]
  - id: REQ-011
    text: "Typed rate-limit detection + non-silent heuristic fallback: callClaude surfaces 429/quota distinctly; heuristic fallbacks are counted/reported and feed the orchestrator throttle; degraded (all-heuristic) runs are flagged, not silent."
    status: validated
    confidence: 0.8
    source: probe-result
    priority: must
    acceptance_criteria: ["Rate-limit != parse error.", "Fallback rate is observable; >threshold throttles the next wave and warns the user."]
    history: [{ phase: 8, action: "Created from ATK-04", date: "2026-05-31" }]
  - id: REQ-012
    text: "Durable per-modification execute journal + idempotent resume: persist before_content to disk BEFORE editing; per-mod idempotency key; resume after orchestrator death reads the journal, not just the aggregate OL status."
    status: validated
    confidence: 0.8
    source: probe-result

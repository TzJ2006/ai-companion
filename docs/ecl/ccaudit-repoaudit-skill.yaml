adversarial_findings:
  critic_summary: "15 findings: F-01..F-15; 2 critical (nested claude -p viability, Windows compat) resolved via probes P1/P2; all others folded into acceptance criteria (stdin/shell=False, commit pin, codex descope, language-aware bug types, .devcompanion/audit output, setup-state idempotency, tri-state result parsing, thin adapters)."

probes:
  - target: REQ-002
    type: assumption
    question: "Does nested `claude -p` work from a subprocess inside a Claude Code session?"
    method: run-command
    result: "echo prompt | claude -p --output-format json --max-turns 1 -> {result: 'pong'} in ~6s"
    verdict: feasible
    note: "Backend must pass --model explicitly (default model is expensive; hundreds of calls per scan)"
  - target: REQ-003
    type: code-inspection
    question: "Is RepoAudit installable on Windows?"
    result: "tree-sitter <0.22 grammar build needs C compiler; torch/transformers ~2GB; rest has wheels"
    verdict: needs-modification
    note: "Setup checks for compiler, offers WSL fallback; smoke scan gates setup completion"

confrontation:
  red_team:
    - { id: ATK-001, scenario: "Usage-limit exhaustion mid-scan", severity: high }
    - { id: ATK-002, scenario: "Hostile repo source injects shell via prompt", severity: critical }
    - { id: ATK-003, scenario: "Giant repo -> multi-hour scan", severity: medium }
    - { id: ATK-004, scenario: "Upstream refactor breaks patch silently", severity: medium }
  blue_team:
    - { attack: ATK-001, verdict: mitigated, mitigation: "retry/backoff + per-bug-type resumable runs" }
    - { attack: ATK-002, verdict: defended, mitigation: "stdin + argv + shell=False" }
    - { attack: ATK-003, verdict: mitigated, mitigation: "scope estimate + confirmation gate" }
    - { attack: ATK-004, verdict: defended, mitigation: "pinned SHA + marker preflight" }

feature_guard:
  generated: "2026-07-05"
  guards:
    - id: GUARD-001
      feature: FEAT-001
      description: "RepoAudit CLI backend patch"
      key_files:
        - "skills/ccaudit/cli-backend.patch"
      invariants:
        - "Patch applies cleanly to upstream RepoAudit @ 160f5bcd378a02a2417e32e999f93ef5fa0f5e64"
        - "claude-code/codex-cli branch is checked BEFORE the generic 'claude' substring branch"
        - "Prompt passes via stdin with shell=False; never interpolated into a command line"
        - "Retry loop with linear backoff on CLI failures"
      verification:
        command: "grep -q infer_with_cli skills/ccaudit/cli-backend.patch"
        expected: "exit 0"
      status: active
    - id: GUARD-002
      feature: FEAT-003
      description: "ccaudit skill workflow"
      key_files:
        - "skills/ccaudit/SKILL.md"
        - "skills/ccaudit/setup.sh"
        - ".claude/commands/ccaudit.md"
        - ".agents/skills/ccaudit/SKILL.md"
      invariants:
        - "Never scans TypeScript targets; fails fast when no supported language is found"
        - "max-neural-workers capped at 3 for the CLI backend"
        - "Report goes to <target>/.devcompanion/audit/, never the target's docs/"
        - "Setup is idempotent, pinned to a specific upstream SHA, and aborts loudly on patch failure"
      verification:
        command: "grep -q max-neural-workers skills/ccaudit/SKILL.md"
        expected: "exit 0"
      status: active

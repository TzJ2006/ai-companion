prompt_calibration:
  raw_input: "Use RepoAudit (https://github.com/PurCL/RepoAudit) for repo-level audit; create a skill/plugin triggerable in Claude Code and hopefully Codex."
  intent_decomposition:
    total_intents: 1
    total_tracks: 1
    tracks:
      - track_id: T1
        name: "ccaudit skill wrapping RepoAudit"
        priority: 1
        intents:
          - raw: "wrap RepoAudit as a Claude Code + Codex skill"
            type: feature
  tracks:
    T1:
      calibrated_scenario: |
        Create a `ccaudit` skill following this repo's skills convention
        (skills/ccaudit/SKILL.md core + .claude/commands/ccaudit.md +
        .agents/skills/ccaudit/SKILL.md adapters) that runs PurCL/RepoAudit
        (LLM dataflow bug detector: MLK/NPD/UAF for C/C++/Java/Python/Go)
        against a TARGET project path (not ai-companion itself — no TS support).
        One-time setup + preflight: RepoAudit cloned to a tools location with a
        Python env; skill checks presence, guides setup if missing, then invokes
        repoaudit.py and surfaces the JSON results.
      intent_dimensions:
        task: { status: present, value: "ccaudit skill wrapping RepoAudit" }
        input: { status: resolved, value: "target project path, language, bug type" }
        output: { status: implicit, value: "RepoAudit JSON findings surfaced to user" }
        constraints: { status: enriched, value: "Python 3.13 + tree-sitter build + ANTHROPIC_API_KEY; Windows/bash host; conda base per user preference" }
        context: { status: enriched, value: "skills pipeline convention; existing repo-audit skill (structural) is distinct" }
        audience: { status: resolved, value: "user auditing their Python/C++/Go repos" }
        memory: { status: present, value: "PowerShell+conda preference; skills dual-adapter convention" }
        success_criteria: { status: implicit, value: "/ccaudit <path> produces bug findings in Claude Code and Codex" }
        examples: { status: missing, deferred: true }
  anti_patterns_found:
    - category: scope
      raw: "repo level audit"
      fix: "Clarified: RepoAudit has no TS support; skill targets external projects"
    - category: context
      raw: "skill or plugin"
      fix: "Resolved to repo's skill convention (core + thin adapters)"
  questions_asked: 3
  decisions:
    - id: DEC-001
      text: "Skill targets other projects (path arg), not ai-companion itself"
    - id: DEC-002
      text: "One-time setup + preflight check; reuse installed RepoAudit"
    - id: DEC-003
      text: "Name: ccaudit (avoids clash with existing repo-audit skill)"

decisions:
  - id: DEC-004
    text: "Clone upstream + apply patch overlay adding CLI backend (vs fork/proxy/reimplement)"
  - id: DEC-005
    text: "MVP backend: claude-code (claude -p via stdin); codex-cli backend descoped to follow-up, seam left in patch"
  - id: DEC-006
    text: "Bug-type defaults mapped to language: Python/Java/Go -> NPD; C/C++ -> NPD+MLK+UAF (amends 'all 3' answer)"
  - id: DEC-007
    text: "Report to <target>/.devcompanion/audit/, not docs/ (artifact-commit policy)"
  - id: DEC-008
    text: "RepoAudit installed user-global at ~/.devcompanion/tools/RepoAudit, pinned commit SHA"

requirements:
  - id: REQ-001
    text: "/ccaudit <target> [bug-type] [--lang X] triggerable in Claude Code; $ccaudit in Codex via thin adapters"
    status: verified
    confidence: 0.9
    acceptance_criteria:
      - "skills/ccaudit/SKILL.md is the single core spec; adapters contain only invocation glue"
      - "Running /ccaudit <path> produces findings summary in chat + report file"
    decomposition: { features: [FEAT-003, FEAT-004] }
  - id: REQ-002
    text: "RepoAudit LLM calls route through claude CLI subprocess (subscription, no API key)"
    status: verified
    confidence: 0.9
    acceptance_criteria:
      - "infer_with_cli: prompt via stdin, argv array, shell=False, --output-format json, --model flag, timeout+retry"
      - "Model name 'claude-code' selects the backend; workers capped at 3"
      - "No source code ever interpolated into a command line"
    decomposition: { features: [FEAT-001] }
  - id: REQ-003
    text: "Idempotent one-time setup + per-run read-only preflight"
    status: verified
    confidence: 0.8
    acceptance_criteria:
      - "Setup: clone pinned SHA -> conda env py3.13 -> pip install -> lib build -> git apply patch -> smoke scan on fixture; setup-state.json records progress; --force-reinstall escape hatch"
      - "Preflight (every run): env exists, infer_with_cli marker present, claude -p responds, target language supported; fail fast with actionable message"
      - "Native build failure -> suggest WSL fallback"
    decomposition: { features: [FEAT-002] }
  - id: REQ-004
    text: "Language-aware defaults; structured report + chat summary"
    status: verified
    confidence: 0.85
    acceptance_criteria:
      - "Language auto-detect: majority-by-LOC among C/C++/Java/Python/Go; --lang override; no supported language -> fail fast"
      - "Bug types per DEC-006; pre-scan scope estimate shown, user confirms before long scans"
      - "Result parsing distinguishes crash | zero findings | findings; report has per-finding file:line + trace"
      - "Chat summary: counts per bug type, top findings with file:line, report path, duration"
    decomposition: { features: [FEAT-003, FEAT-005] }

features:
  - { id: FEAT-001, name: "CLI backend patch (skills/ccaudit/cli-backend.patch)", parent: REQ-002, dependencies: [], complexity: medium }
  - { id: FEAT-002, name: "Setup + preflight script (skills/ccaudit/setup.sh)", parent: REQ-003, dependencies: [FEAT-001], complexity: medium }
  - { id: FEAT-003, name: "Core skill spec skills/ccaudit/SKILL.md", parent: REQ-001, dependencies: [FEAT-002], complexity: small }
  - { id: FEAT-004, name: "Adapters (.claude/commands/ccaudit.md, .agents/skills/ccaudit/SKILL.md)", parent: REQ-001, dependencies: [FEAT-003], complexity: trivial }
  - { id: FEAT-005, name: "Report generation spec (section of SKILL.md)", parent: REQ-004, dependencies: [FEAT-003], complexity: small }


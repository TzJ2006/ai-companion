# Evolving Constraint Language: Onboarding LLM Analysis
# 在 onboarding 时用 Claude Code CLI 做语义级函数分析 + ECL 推断 + 测试生成

ecl_version: "1.0"
feature: "onboarding-llm-analysis"
status: phase-5-adversarial-filtering
created: "2026-05-18"
updated: "2026-05-18"

prompt_calibration:
  raw_input: "在 onboarding 过程中，使用 Claude Code CLI 根据函数的作用推测出整个项目的 overview（包括 ECL），并为每个函数和 ECL 写测试"
  intent_decomposition:
    total_intents: 1
    total_tracks: 1
    tracks:
      - track_id: T1
        name: "Onboarding LLM 分析增强"
        priority: 1
        intents:
          - raw: "onboarding 时用 LLM 分析函数 + 推断 ECL + 生成测试"
            type: feature

decisions:
  - id: DEC-001
    phase: 0
    decision: "分析深度：函数级别 + Evolving Constraint Language + 测试骨架"
    date: "2026-05-18"
  - id: DEC-002
    phase: 0
    decision: "测试在 onboarding 时一起生成"
    date: "2026-05-18"
  - id: DEC-003
    phase: 0
    decision: "全部用 LLM 分析，不限时间"
    date: "2026-05-18"
  - id: DEC-004
    phase: 2
    decision: "两步走：先复用现有 analyzeBatch 再迭代"
    date: "2026-05-18"
  - id: DEC-005
    phase: 2
    decision: "ECL 推断：目录结构 + 函数分析结合"
    date: "2026-05-18"
  - id: DEC-006
    phase: 3
    decision: "选择方案 B：两阶段 LLM（全局理解 + 局部分析）"
    date: "2026-05-18"

requirements:
  - id: REQ-001
    text: "阶段一：全局项目理解 — 用 LLM 生成项目级语境摘要"
    status: validated
    confidence: 0.85
    acceptance_criteria:
      - "读取项目文件树、package.json/pyproject.toml、README、入口文件头部"
      - "调用一次 LLM 生成结构化的项目语境（目标、技术栈、架构概述、模块职责）"
      - "语境摘要控制在 2000 token 以内，可嵌入后续 prompt"
    decomposition:
      features: [FEAT-001]

  - id: REQ-002
    text: "阶段二：带语境的函数级 LLM 分析 — 每个函数分析时携带全局语境"
    status: validated
    confidence: 0.9
    acceptance_criteria:
      - "去掉 maxLlmCalls 限制，所有函数都走 LLM"
      - "分析 prompt 中包含阶段一生成的全局语境"
      - "返回 why/what/how/inputs/outputs/throws/depends_on"
      - "fallback 到启发式分析（网络失败时）"
    decomposition:
      features: [FEAT-002]

  - id: REQ-003
    text: "ECL 特征聚合 — 基于函数分析结果 + 目录结构生成丰富的 ECL"
    status: validated
    confidence: 0.8
    acceptance_criteria:
      - "保留目录结构作为特征骨架"
      - "用函数分析结果丰富每个特征的 description、purpose"
      - "自动生成有意义的 verification 命令（非仅目录存在性检查）"
      - "输出标准 ECL yaml 格式"
    decomposition:
      features: [FEAT-003]

  - id: REQ-004
    text: "测试骨架生成 — 为每个函数和 ECL 特征生成测试文件"
    status: validated
    confidence: 0.8
    acceptance_criteria:
      - "每个分析过的函数生成对应的测试骨架（describe/it 结构）"
      - "每个 ECL 特征生成集成测试骨架"
      - "测试骨架包含从 LLM 分析中提取的断言提示"
      - "输出到 .devcompanion/tests/ 目录"
    decomposition:
      features: [FEAT-004]

  - id: REQ-005
    text: "流程集成 — 整合到 batch-overview.ts 和 generate-overview.ts"
    status: validated
    confidence: 0.85
    acceptance_criteria:
      - "batch-overview.ts 调用新的 onboarding 分析流程"
      - "generate-overview.ts 使用 LLM 分析结果替换启发式描述"
      - "分析结果持久化到 .devcompanion/analysis.json"
      - "后续运行可读取缓存，不重复分析"
    decomposition:
      features: [FEAT-005]

features:
  - id: FEAT-001
    name: "项目语境生成器"
    parent: REQ-001
    modules: [MOD-001]
    dependencies: []
    complexity: medium
    description: "收集项目元信息并调用 LLM 生成全局语境摘要"

  - id: FEAT-002
    name: "增强型函数分析器"
    parent: REQ-002
    modules: [MOD-002]
    dependencies: [FEAT-001]
    complexity: small
    description: "扩展现有 analyzeBatch 去掉 LLM 调用限制，注入全局语境"

  - id: FEAT-003
    name: "语义 ECL 推断器"
    parent: REQ-003
    modules: [MOD-003]
    dependencies: [FEAT-001, FEAT-002]
    complexity: medium
    description: "基于函数分析结果聚合目录级特征，生成丰富 ECL"

  - id: FEAT-004
    name: "测试骨架生成器"
    parent: REQ-004
    modules: [MOD-004]
    dependencies: [FEAT-002, FEAT-003]
    complexity: medium
    description: "从分析结果和 ECL 生成函数单元测试 + 特征集成测试骨架"

  - id: FEAT-005
    name: "Onboarding 管道集成"
    parent: REQ-005
    modules: [MOD-005]
    dependencies: [FEAT-001, FEAT-002, FEAT-003, FEAT-004]
    complexity: small
    description: "串联所有模块到现有 batch/generate 流程"

modules:
  - id: MOD-001
    name: "project-context-generator"
    parent: FEAT-001
    file_path: "scripts/lib/project-context-generator.ts"
    functions:
      - "collectProjectMetadata(projectPath) → ProjectMetadata"
      - "generateProjectContext(metadata) → ProjectContext (via LLM)"
      - "formatContextForPrompt(context) → string (≤2000 tokens)"

  - id: MOD-002
    name: "enhanced-analyzer"
    parent: FEAT-002
    file_path: "scripts/lib/enhanced-analyzer.ts"
    functions:
      - "analyzeAllFunctions(sourceFiles, projectContext) → FunctionAnalysis[]"
      - "buildEnhancedPrompt(input, projectContext) → string"

  - id: MOD-003
    name: "semantic-ecl-inferrer"
    parent: FEAT-003
    file_path: "scripts/lib/semantic-ecl-inferrer.ts"
    functions:
      - "aggregateFunctionsByDirectory(analyses) → DirectoryGroup[]"
      - "generateFeatureDescription(group, projectContext) → EnhancedFeature (via LLM)"
      - "generateVerificationCommands(feature) → Verification[]"
      - "writeSemanticEcl(projectPath, features) → string"

  - id: MOD-004
    name: "test-skeleton-generator"
    parent: FEAT-004
    file_path: "scripts/lib/test-skeleton-generator.ts"
    functions:
      - "generateFunctionTestSkeleton(analysis) → string"
      - "generateFeatureTestSkeleton(feature) → string"
      - "writeTestFiles(projectPath, skeletons) → string[]"

  - id: MOD-005
    name: "onboarding-pipeline"
    parent: FEAT-005
    file_path: "scripts/lib/onboarding-pipeline.ts"
    functions:
      - "runOnboardingAnalysis(projectPath, options) → OnboardingResult"
      - "loadCachedAnalysis(projectPath) → FunctionAnalysis[] | null"
      - "saveCachedAnalysis(projectPath, analyses) → void"

dependency_graph:
  FEAT-001: []
  FEAT-002: [FEAT-001]
  FEAT-003: [FEAT-001, FEAT-002]
  FEAT-004: [FEAT-002, FEAT-003]
  FEAT-005: [FEAT-001, FEAT-002, FEAT-003, FEAT-004]

pending_input: null

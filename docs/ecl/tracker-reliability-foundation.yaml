    parent: FEAT-005
    config_slot: "tests"
    functions: [ FN-012, FN-013, FN-014, FN-015 ]
    file_path: ".devcompanion/tests/"
    entry_point: "test_reliability_foundation.test.ts"
    source: new
    public_interface: []

    modularity_check:
      single_responsibility: true
      testable_in_isolation: true
      no_shared_state: true
      config_at_boundary: true

functions:
  - id: FN-001
    name: "deriveCorrelationId"
    parent: MOD-001
    visibility: internal
    description: "优先使用 hook tool_use_id，否则对规范化 tool input 计算稳定哈希"
    input_interface:
      - { name: "input", type: "ToolUseInput", source: parameter }
    output_interface: { type: "string", error_cases: [] }
    side_effects: []
    dependencies: [ "node:crypto.createHash" ]
    constraints:
      - "同一 Pre/Post 输入产生相同 ID"
      - "缺失 tool_use_id 时 correlation 只用于查找候选；多个候选不得猜测配对"
    test_cases:
      - {
          input: "相同 Claude Edit pre/post input",
          expected: "相同 correlation id",
          mocks: []
        }
      - { input: "不同 apply_patch command", expected: "不同 correlation id", mocks: [] }
    depends_on: [ FN-013 ]
    enables: [ FN-002, FN-003 ]
    output: { file: "packages/hook/src/tool-event.ts", symbol: "deriveCorrelationId" }
    verify:
      command: "npx vitest run .devcompanion/tests/test_hook_captureSnapshots.test.ts
        -t=FN-001"
      pass_condition: "exit 0"
    status: done

  - id: FN-002
    name: "capturePreEditSnapshots"
    parent: MOD-001
    visibility: public
    description: "PreToolUse 为每个目标保存 before snapshot manifest"
    input_interface:
      - { name: "input", type: "ToolUseInput", source: parameter }
    output_interface:
      type: "SnapshotManifest[]"
      error_cases:
        - { type: "SnapshotDegraded", when: "文件过大、不可读或不存在" }
    side_effects: [ "file-read", "file-write" ]
    dependencies: [ "deriveCorrelationId", "getChangedFilePaths", "readSnapshotTargetSafely" ]
    constraints:
      - "snapshot 仅写入 .devcompanion/queue/snapshots"
      - "changed paths 按各自 canonical projectRoot 分区；无 root 的路径单独 warning"
      - "新增文件使用显式 missing-before 状态"
      - "manifest 使用 Pre 生成 nonce 并写入 per-path FIFO；大文件降级必须记录原因"
    test_cases:
      - {
          input: "existing nested Windows path",
          expected: "repo-relative path + before snapshot",
          mocks: []
        }
      - { input: "new file", expected: "missing-before manifest", mocks: [] }
    depends_on: [ FN-001, FN-013, FN-016 ]
    enables: [ FN-003 ]
    output: { file: "packages/hook/src/snapshot.ts", symbol: "capturePreEditSnapshots" }
    verify:
      command: "npx vitest run .devcompanion/tests/test_hook_captureSnapshots.test.ts
        -t=FN-002"
      pass_condition: "exit 0"
    status: done

  - id: FN-003
    name: "enqueueCapturedEvents"
    parent: MOD-001
    visibility: public
    description: "PostToolUse 保存 after snapshot，并以 one-event-one-file 原子入队"
    input_interface:
      - { name: "input", type: "ToolUseInput", source: parameter }
      - { name: "manifests", type: "SnapshotManifest[]", source: parameter }
    output_interface:
      type: "HookEvent[]"
      error_cases:
        - { type: "HookWarning", when: "pre manifest 不存在或碰撞" }
    side_effects: [ "file-read", "file-write" ]
    dependencies: [ "deriveCorrelationId", "capturePreEditSnapshots" ]

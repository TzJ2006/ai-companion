        先修复 AI Dev Companion 最核心的追踪数据链：每次写操作必须留下
        与稍后 Git 状态无关的证据；队列必须自动消费、崩溃可恢复；历史
        会话必须不会因并发、时间戳冲突或路径解析而丢失。第一批不增加
        dashboard、installer、overview 或新分析功能。
      intent_dimensions:

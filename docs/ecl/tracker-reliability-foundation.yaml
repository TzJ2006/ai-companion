user_scenario: |
  那么，你准备怎么做？

requirements:
  - id: REQ-001
    text: "每个受支持的写操作都保存与稍后 Git 状态无关的变更证据"
    status: verified
    confidence: 0.92
    source: inferred
    priority: must
    acceptance_criteria:
      - text: "Windows 与 POSIX 路径均转换为仓库相对的正斜杠路径"
        kind: hard
      - text: "事件携带编辑前后快照引用；后续 stage、commit、revert 不改变事件内容"
        kind: hard
      - text: "新增、修改、删除均可由快照重建 FileDiff；无法完整快照时生成明确的 file-level 降级事件"
        kind: hard
      - text: "同一工具调用修改多个文件时共享 correlation_id，但每个文件拥有独立快照"
        kind: hard
      - text: "缺少稳定 tool_use_id 且出现多个可匹配 pre manifest 时必须降级并告警，不得猜测配对"
        kind: hard
      - text: "多文件工具调用按每个目标独立发现 canonical projectRoot 并分区入队；不得复用第一个路径的 root"
        kind: hard
    challenges:
      - "Claude/Codex hook 输入未保证总有稳定 tool_use_id"
      - "大文件快照必须保持 hook 低延迟"
    decomposition:
      features: [ FEAT-001 ]
    tags: [ hook, snapshot, data-integrity ]
    history:
      - phase: 2
        action: "由已复现的 staged/committed/reverted/untracked 丢失问题推导"
        date: "2026-08-17"

  - id: REQ-002
    text: "队列无需用户维护常驻服务即可自动消费，并在并发或崩溃后恢复"
    status: verified
    confidence: 0.90
    source: inferred
    priority: must
    acceptance_criteria:
      - text: "PostToolUse 入队后尝试启动短生命周期 worker；启动失败必须写 health marker、输出警告并保留 durable
          event"
        kind: hard
      - text: "每个事件以 temp+rename 写成独立 inbox 文件；worker 通过原子 rename 逐个 claim"
        kind: hard
      - text: "worker 启动时先恢复遗留 claimed 事件，再处理 inbox；损坏事件文件独立进入 rejected"
        kind: hard
      - text: "正常和恢复路径都必须原子 rename 到 working/<owner-token>/；所有 sidecar/ack 前再次验证 owner
          token"
        kind: hard
      - text: "处理失败的批次及快照保留；下一次 worker 可重试且不会重复提交已完成 session"
        kind: hard
      - text: "成功 spawn 时自动 drain；spawn 失败由下一次 hook 或显式 worker 命令重试，不承诺无调度器时的固定延迟"
        kind: hard
      - text: "无新事件时 worker 自动退出，不安装系统服务"
        kind: hard
      - text: "首次启动把旧 events.jsonl 的合法行迁移为 evidence_quality: degraded spool
          events，隔离坏行并保留 .migrated 原文件"
        kind: hard
    challenges:
      - "并发 PostToolUse 可能同时尝试启动 worker"
      - "worker 崩溃点可能位于 session 写入与队列确认之间"
    decomposition:
      features: [ FEAT-003 ]
    tags: [ daemon, queue, recovery ]
    history:
      - phase: 2
        action: "由未安装 daemon、启动不 drain、processing 文件不可恢复问题推导"
        date: "2026-08-17"

  - id: REQ-003
    text: "历史存储以不可变 session 为事实来源，并能安全重建派生索引"
    status: verified
    confidence: 0.94
    source: inferred
    priority: must
    acceptance_criteria:
      - text: "session 文件名包含 session.id；相同时间戳不能覆盖"
        kind: hard
      - text: "同项目写入使用无第三方依赖的跨进程 lockfile，并具有可验证的 stale-lock 恢复"
        kind: hard
      - text: "session 文件通过临时文件加 rename 原子提交；重复 session.id 为幂等操作"
        kind: hard
      - text: "worker 在 journal commit 前原子保存 finalized session sidecar；重试复用完全相同的
          timestamp 与 record IDs"
        kind: hard
      - text: "index 与 file history 是派生数据；缺失、损坏或部分更新时可从 sessions 重建"
        kind: hard
      - text: "派生 manifest 记录 journal 计数与 dirty 状态，使语义上部分但合法的 JSON 可被检测"
        kind: hard
      - text: "派生 manifest 保存 index digest 与排序后的 history path→digest inventory；缺失或合法
          JSON 篡改在 init/read 时触发 repair"
        kind: hard
      - text: "file_path 必须相对 projectRoot 解析并拒绝逃逸 history 根目录"
        kind: hard
      - text: "session.id 必须通过固定安全字符验证；同 ID 不同内容抛出 SessionConflict"
        kind: hard
    challenges:
      - "多文件 JSON 无法提供真正的文件系统事务"
      - "锁必须处理进程异常退出"
    decomposition:
      features: [ FEAT-004 ]
    tags: [ history, locking, recovery ]
    history:
      - phase: 2
        action: "由并发 JSON 损坏、时间戳覆盖和 cwd 路径错误问题推导"
        date: "2026-08-17"

  - id: REQ-004
    text: "集成测试证明真实 hook→queue→history 链路，而不是只验证 mock"
    status: verified
    confidence: 0.96
    source: critic-proposed
    priority: must
    acceptance_criteria:
      - text: "Windows 分隔符、nested path、add/modify/delete、stage/commit/revert 均有回归测试"
        kind: hard
      - text: "并发 worker、并发 saveSession、损坏 event file、遗留 claimed event 均有回归测试"
        kind: hard
      - text: "hook、spool/worker、journal/projector 各有先于实现节点创建的组件测试；测试节点用 vitest list
          验证可收集"
        kind: hard
      - text: "测试使用真实临时 Git 仓库和真实 HistoryStore；不永久 mock getGitDiff"
        kind: hard
      - text: "npm run build 与 npx vitest run 全量通过"
        kind: hard
      - text: "Windows 本地与 Linux CI/人工 runner 均执行 subprocess 集成矩阵后才可合并"
        kind: soft
        signed_off_by: null
      - text: "fault injection 覆盖 stale worker 抢占、symlink swap、spawn-then-exit、spool
          temp rename、PID reuse/EPERM 与 multi-repo patch"
        kind: hard
    challenges: []
    decomposition:
      features: [ FEAT-005 ]
    tags: [ tests, integration ]
    history:
      - phase: 4
        action: "补齐当前被 skip 的 daemon relevant-diff 集成覆盖"
        date: "2026-08-17"

  - id: REQ-005
    text: "快照必须限制在仓库边界内，并具有明确的大小、权限与清理生命周期"
    status: verified
    confidence: 0.90
    source: critic-proposed
    priority: must
    acceptance_criteria:
      - text: "existing path 使用 realpath containment；new path 验证最近存在父目录，不跟随仓库外
          symlink/junction"
        kind: hard
      - text: "projectRoot/.devcompanion 及 queue/reviews/history 根必须 lstat+realpath 位于
          canonical projectRoot，拒绝 root symlink/junction 重定向"
        kind: hard
      - text: "只捕获声明支持的文本扩展；binary 或超过 2 MiB 的文件产生 evidence_quality: degraded 事件"
        kind: hard
      - text: "validation 与 read 使用同一 fd：lstat→open/no-follow where
          available→fstat→bounded read→identity recheck；变化时降级且不持久化内容"
        kind: hard
      - text: "当前平台允许时快照以 owner-only 权限创建；内容不写日志或错误消息"
        kind: hard
      - text: "成功 ack 后删除事件快照与 sidecar；失败证据保留最多 7 天并由 worker 清理"
        kind: hard
      - text: "queue 具有低/高/硬水位（默认 128/256/512 MiB 与 5k/10k/20k 文件）；高水位降级，硬水位合并 overflow
          marker 并告警但不阻断源码编辑"
        kind: hard
      - text: "2 MiB 以内文件的 Pre/Post capture 在本地基准 p95 小于 100ms"
        kind: hard
    challenges:
      - "Windows ACL 只能使用继承权限，mode 0600 是 best-effort"
    decomposition:
      features: [ FEAT-001, FEAT-003 ]
    tags: [ snapshot, security, lifecycle ]
    history:
      - phase: 5
        action: "由 critic 从 REQ-001 拆出，补齐信任边界和磁盘生命周期"
        date: "2026-08-17"


confrontation:
  red_team:
    - {
        id: ATK-001,
        scenario: "stale lease 抢占时旧 worker 恢复，两个 worker 同时处理同一 claimed event",
        severity: critical,
        targets: [ FEAT-003 ]
      }
    - {
        id: ATK-002,
        scenario: ".devcompanion/queue/reviews/history 本身是指向仓库外的 symlink/junction",
        severity: critical,
        targets: [ FEAT-001, FEAT-003, FEAT-004 ]
      }
    - {
        id: ATK-003,
        scenario: "realpath validation 后、read 前交换 source symlink/junction，泄露仓库外内容",
        severity: critical,
        targets: [ FEAT-001 ]
      }
    - {
        id: ATK-004,
        scenario: "clean manifest 下删除/合法篡改某个 projection JSON，journal count 不变",
        severity: high,
        targets: [ FEAT-006 ]
      }
    - {
        id: ATK-005,
        scenario: "预植 semantic-valid 恶意 event/sidecar，引用仓库外或超大 artifact",
        severity: critical,
        targets: [ FEAT-003 ]
      }
    - {
        id: ATK-006,
        scenario: "大量小事件或 worker 不可用导致磁盘/inode 耗尽",
        severity: high,
        targets: [ FEAT-001, FEAT-003 ]
      }
    - {
        id: ATK-007,
        scenario: "Windows burst hooks 产生 spawn storm，child spawn 成功后立即退出造成 false health",
        severity: high,
        targets: [ FEAT-003 ]
      }
    - {
        id: ATK-008,
        scenario: "event temp fsync 后 rename/掉电失败，留下既非 inbox 又非 claimed 的 orphan",
        severity: high,
        targets: [ FEAT-003 ]
      }
    - {
        id: ATK-009,
        scenario: "HistoryStore owner PID reuse 或 EPERM 导致永久锁，旧 owner 恢复后继续写",
        severity: high,
        targets: [ FEAT-004 ]
      }
    - {
        id: ATK-010,
        scenario: "一次 apply_patch 跨两个 repo，Pre 阶段错误复用第一个 projectRoot",
        severity: high,
        targets: [ FEAT-001 ]
      }
  blue_team:
    - attack: ATK-001
      verdict: mitigated
      mitigation: "所有 normal/recovery claim 原子进入
        working/<owner-token>；sidecar/save/ack 使用 fencing token"
      new_requirements: []
    - attack: ATK-002
      verdict: mitigated
      mitigation: "hook、worker、HistoryStore 独立 canonicalize storage roots 并拒绝 root
        redirect links"
      new_requirements: [ REQ-005 ]
    - attack: ATK-003
      verdict: mitigated
      mitigation: "fd-backed lstat/open/fstat/bounded-read/identity-recheck；变化时不持久化内容"
      new_requirements: [ REQ-005 ]
    - attack: ATK-004
      verdict: mitigated
      mitigation: "projection manifest 加 index/history digests 与 inventory，init/read
        验证并 repair"
      new_requirements: []
    - attack: ATK-005
      verdict: mitigated
      mitigation: "worker-side bounded artifact reader、derived
        paths、schema/count/project binding validation"
      new_requirements: []
    - attack: ATK-006
      verdict: mitigated
      mitigation: "aggregate byte/file watermarks；高/硬水位降级与 overflow health，fail-open
        保留源码编辑"
      new_requirements: [ REQ-005 ]
    - attack: ATK-007
      verdict: mitigated
      mitigation: "atomic launch gate/cooldown；明确 Windows spawn flags；child-owned
        started/heartbeat/final health"
      new_requirements: []
    - attack: ATK-008
      verdict: mitigated
      mitigation: "directory fsync where supported；startup bounded-recover aged temp files"
      new_requirements: []
    - attack: ATK-009
      verdict: mitigated
      mitigation: "heartbeat TTL 而非 PID 决定 stale；每次 rename/release 前 owner-token fencing"
      new_requirements: []
    - attack: ATK-010
      verdict: mitigated
      mitigation: "每个 changed path 独立 root discovery 并按 canonical root 分区
        manifest/spool/worker"
      new_requirements: []

risks:
  - id: RISK-001
    description: "缺失 tool_use_id 时相同并发工具输入发生 correlation collision"
    probability: medium
    impact: high
    mitigation: "per-path FIFO manifest + Pre nonce；多个候选时不猜测，生成 degraded 独立事件并保留
      post evidence"
    status: mitigated
    related: []
  - id: RISK-002
    description: "大文件 snapshot 超过 hook 100ms 目标"
    probability: medium
    impact: medium
    mitigation: "设置可测试的大小阈值；超过阈值生成 file-level event，不静默跳过"
    status: mitigated
    related: []
  - id: RISK-003
    description: "worker 在 journal commit 后、event ack 前崩溃"
    probability: low
    impact: medium
    mitigation: "session id 由 correlation/event 内容稳定派生，saveSession 幂等"
    status: mitigated
    related: []
  - id: RISK-004
    description: "best-effort worker spawn 失败后，在没有下一次 hook/手工 drain 时事件延迟无限"
    probability: low
    impact: medium
    mitigation: "durable inbox + health marker + stderr warning + next-hook/manual
      retry；不虚假承诺固定 drain SLA"
    status: accepted
    related: []
  - id: RISK-005
    description: "Linux 行为尚未在当前 Windows 审计环境执行"
    probability: medium
    impact: high
    mitigation: "合并前由 Linux runner 执行相同 subprocess integration suite 并人工签署 REQ-004"
    status: open
    related: []
  - id: RISK-006
    description: "实施文件与当前非本规划产生的未提交修改重叠，错误基线可能覆盖并行工作"
    probability: high
    impact: high
    mitigation: "用户已批准以当前 worktree 为基线；/ccedit 每个 FN 先读取现有 diff，禁止
      reset/checkout，按当前内容增量修改"
    status: mitigated
    related: []

decisions:
  - id: DEC-001
    date: "2026-08-17"
    phase: 0
    decision: "先交付追踪可靠性基础，其他审计项拆成后续 ECL"
    rationale: "可追踪性是产品核心；数据链不可信时扩展功能没有价值"
    alternatives_considered: [ "一次性修完全部审计项", "继续新增功能" ]
    reversible: false
  - id: DEC-002
    date: "2026-08-17"
    phase: 3
    decision: "采用 snapshots + one-shot worker + immutable session journal"
    rationale: "不增加依赖或系统服务，同时消除对稍后 Git 状态的依赖并支持崩溃重放"
    alternatives_considered:
      - "继续读取稍后的 git diff — 已证实丢数据"
      - "在 PostToolUse 同步完成 AST/历史处理 — 增加代理编辑延迟"
      - "SQLite event store — 当前规模下增加依赖和迁移成本"
      - "常驻 OS service — 安装与跨平台生命周期过重"
      - "退回手动 aidev review — 破坏自动追踪产品承诺"
    reversible: true
  - id: DEC-003
    date: "2026-08-17"
    phase: 4
    decision: "session journal 是唯一事实来源；index/file history 都可重建"
    rationale: "文件系统无法对多个 JSON 文件提供事务；不可变主记录 + 可重建派生数据更简单可靠"
    alternatives_considered: [ "多文件伪事务与回滚", "引入数据库" ]
    reversible: true
  - id: DEC-004
    date: "2026-08-17"
    phase: 5
    decision: "用 immutable one-event spool files 取代共享 events.jsonl"
    rationale: "消除 append/rename 跨平台竞态、行级交错和单个坏行拖垮整批的问题"
    alternatives_considered: [ "继续 JSONL 加锁", "数据库队列" ]
    reversible: true
  - id: DEC-005
    date: "2026-08-17"
    phase: 5
    decision: "组件 contract tests 先于实现节点创建，最终 E2E 留到所有实现完成后"
    rationale: "使 /ccedit 的每个实现节点都有已存在、可运行的 focused verification"
    alternatives_considered: [ "一个后置 mega-suite", "实现后再补测试" ]
    reversible: true
  - id: DEC-006
    date: "2026-08-17"
    phase: 5
    decision: "finalized session sidecar 固化非确定性 record IDs/timestamps"
    rationale: "重试必须复用完全相同 payload；强行把所有下游 ID 改成确定性会扩大 core 改动"
    alternatives_considered: [ "修改 toChangeRecords 全部 ID 生成", "同 ID 忽略 payload 差异" ]
    reversible: true
  - id: DEC-007
    date: "2026-08-17"
    phase: 8
    decision: "queue 达到硬水位时 fail-open：源码编辑继续，追踪降级并明确告警"
    rationale: "追踪系统故障不应扣留用户源码变更；产品承诺改为不静默失败，而非牺牲源码可用性"
    alternatives_considered: [ "PreToolUse 阻断所有受支持写操作", "静默丢弃新事件" ]
    reversible: true
  - id: DEC-008
    date: "2026-08-17"
    phase: 8
    decision: "第一版 limits 使用保守常量，不新增配置 schema"
    rationale: "当前没有证据需要用户调节；先用测试锁定安全上限，出现真实需求再开放配置"
    alternatives_considered: [ "新增 queue-config.json", "无限制" ]
    reversible: true
  - id: DEC-009
    date: "2026-08-17"
    phase: 9
    decision: "批准以当前未提交 worktree 为实施基线，并保留所有既有修改"
    rationale: "用户在审计复核后明确要求继续；现有修改包含已实现但待验证的 installer、overview 与 dashboard 修复"
    alternatives_considered: [ "等待工作区清理后再实施" ]
    reversible: false


  - id: PROBE-002
    target: FEAT-003
    question: "现有 git 依赖能否跨平台从两个 snapshot 生成 unified diff？"
    method: integration-test
    code_path: null
    result: "Windows Git 的 diff --no-index 对修改、新增（/dev/null → file）和删除（file →

      - "已投影 session.id 不重复累计"
      - "失败不影响已提交 journal"
    test_cases:
      - {
          input: "same session projected twice",
          expected: "counts increment once",
          mocks: []
        }
      - {
          input: "fault after index before history",
          expected: "manifest remains dirty",
          mocks: []
        }
    depends_on: [ FN-015 ]
    enables: [ FN-009, FN-010, FN-012 ]
    output: { file: "packages/history/src/projector.ts", symbol: "projectSession" }
    verify:
      command: "npx vitest run .devcompanion/tests/test_history_durableSession.test.ts
        -t=FN-018"
      pass_condition: "exit 0"
    status: done

  - id: FN-019
    name: "readValidatedQueueArtifact"
    parent: MOD-002
    visibility: internal
    description: "在解析前对 event/session sidecar/snapshot 做 bounded schema 与 queue-root
      trust validation"
    input_interface:
      - { name: "queueRoot", type: "string", source: parameter }
      - { name: "artifactPath", type: "string", source: parameter }
      - { name: "kind", type: "event | sidecar | snapshot", source: parameter }
    output_interface:
      type: "Promise<ValidatedQueueArtifact>"
      error_cases:
        - {
            type: "QueueArtifactRejected",
            when: "root/path/type/size/schema/project binding 无效"
          }
    side_effects: [ "file-read", "file-realpath" ]
    dependencies: [ "node:fs.open", "node:fs.fstat", "JSON.parse" ]
    constraints:
      - "canonical queueRoot 必须位于 canonical projectRoot，且 queueRoot 自身不得是
        redirect link"
      - "basename/event_id 使用安全固定字符；artifact path 由 ID 推导，不信任 JSON 内绝对路径"
      - "event/sidecar 最大 256 KiB，snapshot 最大 2 MiB；先 fstat 再 bounded read/parse"
      - "只接受 regular non-symlink file；字段类型、数组数量、repo-relative path 与 project
        binding 必须验证"
      - "拒绝内容 quarantine，不在错误消息中输出 snapshot 内容"
    test_cases:
      - {
          input: "valid JSON naming outside snapshot",
          expected: "QueueArtifactRejected",
          mocks: []
        }
      - { input: "300 KiB event", expected: "rejected before JSON.parse", mocks: [] }
    depends_on: [ FN-014 ]
    enables: [ FN-005, FN-006, FN-007, FN-012 ]
    output: { file: "packages/daemon/src/worker.ts", symbol: "readValidatedQueueArtifact" }
    verify:
      command: "npx vitest run
        .devcompanion/tests/test_daemon_recoverableQueue.test.ts -t=FN-019"
      pass_condition: "exit 0"
    status: done

  - id: FN-020
    name: "extendChangeEvidenceMetadata"
    parent: MOD-007
    visibility: public
    description: "为 full/degraded 与 file-level tracking 增加向后兼容的结构化证据字段"
    input_interface: []
    output_interface: { type: "ChangeRecord type extension", error_cases: [] }
    side_effects: [ "type-definition-change" ]
    dependencies: []
    constraints:
      - "现有 ChangeRecord JSON 保持可读；新增字段必须 optional"
      - "evidence_quality 仅为 full|degraded；degradation_reason 使用封闭 union"
      - "file-level record 使用稳定 synthetic function_hash，不伪装成 AST function"
    test_cases:
      - {
          input: "legacy ChangeRecord fixture",
          expected: "仍通过 TypeScript build",
          mocks: []
        }
      - {
          input: "degraded file-level fixture",
          expected: "包含 event_id/operation/reason",
          mocks: []
        }
    depends_on: [ FN-013, FN-014 ]
    enables: [ FN-003, FN-007, FN-012 ]
    output: { file: "packages/types/src/history.ts", symbol: "ChangeRecord" }
    verify:
      command: "npm run build"
      pass_condition: "exit 0"
    status: done


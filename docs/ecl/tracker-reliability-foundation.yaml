      - name: "HistoryStore.saveSession"
        signature: "(session: ReviewSession) => Promise<string>"
        description: "幂等提交不可变 session，并更新或重建派生数据"
    dependencies:
      - module: node-fs
        imports: [ "open", "rename", "stat", "unlink" ]
        why: "原子文件提交与 lockfile，无需新依赖"
    internal_only:
      [
        "withProjectLock",
        "writeJsonAtomic",
        "fileHistoryPath",
        "validateSessionId"
      ]
    modularity_check:
      single_responsibility: true
      testable_in_isolation: true
      no_shared_state: false
      config_at_boundary: true

  - id: MOD-004

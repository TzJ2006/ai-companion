    dependencies:
      - module: node-fs
        imports: [ "readFile", "rename", "readdir" ]
        why: "通过注入的 ProjectionStorage 操作派生数据"
    internal_only: [ "projectSession", "readProjectionManifest", "writeProjectionManifest" ]
    modularity_check:
      single_responsibility: true

modules:
  - id: MOD-001
    name: "Hook event capture"
    parent: FEAT-001
    config_slot: "modules.hook"
    functions: [ FN-001, FN-002, FN-003, FN-016 ]
    file_path: "packages/hook/src/"
    entry_point: "index.ts"
    source: extend
    public_interface:
      - name: "capturePreEditSnapshots"
        signature: "(input: ToolUseInput, projectRoot: string) => SnapshotManifest"
        description: "在编辑发生前保存受支持文件内容"
      - name: "enqueueCapturedEvents"
        signature: "(input: ToolUseInput, manifest: SnapshotManifest) => HookEvent[]"
        description: "编辑完成后保存 post snapshot 并原子追加事件"
    dependencies:
      - module: node-fs
        imports: [ "readFileSync", "writeFileSync", "renameSync" ]
        why: "hook 路径需保持短小、同步、无新依赖"
    internal_only:
      [
        "deriveCorrelationId",
        "normalizeRepoPath",
        "snapshotPathFor",
        "readSnapshotTargetSafely"
      ]
    modularity_check:
      single_responsibility: true
      testable_in_isolation: true
      no_shared_state: true
      config_at_boundary: true

  - id: MOD-002
    name: "Recoverable queue worker"
    parent: FEAT-003
    config_slot: "modules.daemon"
    functions: [ FN-005, FN-006, FN-007, FN-017, FN-019 ]
    file_path: "packages/daemon/src/"
    entry_point: "index.ts"
    source: extend
    public_interface:
      - name: "runQueueWorker"
        signature: "(projectRoot: string) => Promise<WorkerSummary>"
        description: "获取单项目 lease，恢复 claimed events 并处理至 inbox 为空"
      - name: "buildSnapshotDiffs"
        signature: "(events: QueueEvent[]) => Promise<FileDiff[]>"
        description: "只根据事件快照构建 diff，不读取稍后的工作树状态"
    dependencies:
      - module: MOD-001
        imports: [ "HookEvent", "SnapshotManifest" ]
        why: "消费 hook 写入的事件格式"
      - module: MOD-003
        imports: [ "HistoryStore.saveSession" ]
        why: "持久化处理结果"
      - module: core
        imports: [ "parseUnifiedDiff", "annotateChanges", "toChangeRecords" ]
        why: "复用现有 diff 与函数归因逻辑"
    internal_only:
      [
        "claimSpoolEvent",
        "quarantineMalformedEvent",
        "acknowledgeEvent",
        "cleanupExpiredSnapshots"
      ]
    modularity_check:
      single_responsibility: true
      testable_in_isolation: true
      no_shared_state: true
      config_at_boundary: true

  - id: MOD-003
    name: "Durable history store"
    parent: FEAT-004
    config_slot: "modules.history"
    functions: [ FN-008, FN-009, FN-011 ]
    file_path: "packages/history/src/"
    entry_point: "index.ts"

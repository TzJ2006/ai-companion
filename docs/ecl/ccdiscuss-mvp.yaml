ecl_version: "1.0"
feature: "ccdiscuss-mvp"
status: completed
# MVP FNs all done; /ccdiscuss hard-gate (FEAT-aic-23) is blocked, not in this DAG
created: "2026-06-01"
updated: "2026-08-17"
related_features: [ "five-question-alignment-protocol" ] # design, decisions, findings live there
note: |
  Execution DAG for the /ccdiscuss MVP. Rationale, decisions (DEC-001..017) and the two
  adversarial passes live in docs/ecl/five-question-alignment-protocol.yaml (mvp_build /
  mvp_fn_dag). This file is formatted in the @aidev/exec FN schema so /ccedit can run it.
  Each verify is a `vitest run` (exit 0 = pass); each FN's subagent writes BOTH the artifact
  and its asserting test. The enforcement layer (gate / value-verification / parser changes)
  is BLOCKED / deferred (FEAT-aic-23) and is NOT in this DAG. /ccdiscuss remains best-effort,
  not a hard gate (skills/ccdiscuss/SKILL.md).

functions:
  - id: MVP-SCHEMA
    name: "ecl-schema.md: why_this_way field + hard|soft tag (doc-only)"
    description: >-
      Document a per-node why_this_way field (NL rationale for the CHOSEN
      approach) and a kind:hard|soft tag on existing
      acceptance_criteria/verification entries. Do NOT modify ecl-parser.ts; do
      NOT add a parallel 'expected' field (BF-06).
    depends_on: []
    output: { file: "skills/ccplan/ecl-schema.md", symbol: "why_this_way" }
    verify:
      command: "npx vitest run .devcompanion/tests/mvp_schema_doc.test.ts"
      pass_condition: "Test asserts ecl-schema.md documents why_this_way (>=2
        mentions) AND a kind hard/soft tag; scripts/lib/ecl-parser.ts
        unchanged."
    status: done

  - id: MVP-SKILL
    name: "skills/ccdiscuss/SKILL.md — best-effort 6-step alignment loop"
    description: >-
      Create the /ccdiscuss SKILL.md: the 6-step loop (conflict-check -> human
      writes expected FIRST -> AI emits 5 questions + flags divergence ->
      resolve -> verification(value+code | soft) -> split into ECL node(s)).
      Frame EXPLICITLY as best-effort conversational discipline (no always-on /
      enforced / gate claims, BF-01). Handoff: /ccdiscuss writes an aligned ECL
      that /ccplan reads if present (BF-10).
    depends_on: []
    output: { file: "skills/ccdiscuss/SKILL.md", symbol: "ccdiscuss" }
    verify:
      command: "npx vitest run .devcompanion/tests/mvp_ccdiscuss_skill.test.ts"
      pass_condition: "Test asserts SKILL.md exists, has all 6 step markers, the
        'best-effort' framing, and the read-if-present handoff; contains no
        'always-on'/'enforced'/'gate' claim."
    status: done

  - id: MVP-HOOK-REC
    name: "hook: file-level recording for .yaml/.md (+ no-regression test)"
    description: >-
      Extend packages/hook/src/index.ts handlePostToolUse so .yaml/.md edits are
      recorded (file-level degradation — honors the 'unsupported files degrade
      to file-level' rule, BF-09) with a 5Q-placeholder field; preserve .py/.ts
      behavior exactly. Write the asserting test.
    depends_on: []
    output: { file: "packages/hook/src/index.ts", symbol: "handlePostToolUse" }
    verify:
      command: "npx vitest run .devcompanion/tests/mvp_hook_recording.test.ts"
      pass_condition: "Test asserts a .yaml and a .md edit each record 1 event, a .ts
        edit still records 1 event (no regression), and the event carries a
        5Q-placeholder field."
    status: done

  - id: MVP-HOOK-READER
    name: "hook: minimal reader to list recorded events for a path"
    description: >-
      Add a small reader (exported fn or CLI) listing recorded events for a
      given path, so the audit trail is not write-only (answers F-08).
    depends_on: [ "MVP-HOOK-REC" ]
    output: { file: "packages/hook/src/read-events.ts", symbol: "readEvents" }
    verify:
      command: "npx vitest run .devcompanion/tests/mvp_hook_reader.test.ts"
      pass_condition: "Test asserts readEvents(path) returns the events recorded for
        that path (length matches)."
    status: done

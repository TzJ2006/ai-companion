ecl_version: "1.0"
feature: "dag-paged-html-view"
status: "aligned" # /ccdiscuss output — read-if-present by /ccplan
created: "2026-06-21"
source_idea: >-
  Turn the single-graph DAG HTML into an FTB-Quests-style paged view: a left
  sidebar grouped by layer (the high-level pagination), one page per milestone
  (the "small gadget"), each page showing that milestone + its tasks. Keep a
  global Overview page with the full milestone DAG. Visual style unchanged.
reuse: reuse-extend # extends scripts/render-dag.ts (FEAT-aic dag renderer)
extends:
  - "scripts/render-dag.ts"
  - "docs/ecl/dag/ai-companion.ecl.yaml"

ecl_nodes:
  - id: NODE-001
    name: "Paged DAG HTML (sidebar = layers, page = milestone)"
    reuse: reuse-extend
    five_questions:
      what: >-
        Rewrite scripts/render-dag.ts to emit ONE self-contained HTML with a
        left sidebar (layers -> milestone pages) and a right pane that swaps
        between Mermaid graphs: an Overview page (full milestone DAG, current
        view) plus one page per milestone showing that milestone node + its FN
        tasks. Vanilla JS show/hide; dark Mermaid style preserved.
      why: >-
        One big graph does not scale to read. Paging by milestone, grouped by
        layer, makes "where am I / what is in this piece" navigable like a
        tech-tree, which is how the human wants to consume the repo map.
      how: >-
        Add a `layer:` field to each milestone in ai-companion.ecl.yaml (data is
        the source of truth for grouping). render-dag.ts groups sidebar entries
        by layer, generates N+1 .mermaid blocks (Overview + one per milestone),
        and a <nav> that toggles which .page div is visible. Reuse the existing
        click-node -> 5-question-record behavior within each page.
      why_this_way: >-
        Stay data-driven from the YAML (no hand-sync of layers, unlike the .md).
        Plain show/hide over ~24 static pages needs no SPA framework. Mermaid +
        existing CSS keep the visual style identical.
      expected_result: >-
        A paged ai-companion.html: sidebar grouped into 5 layers, an Overview
        page with the full DAG, and one page per milestone (milestone + its
        tasks), visuals matching the current dark style.
    expected_result_human: >-
      类似 FTB-quest 风格的 DAG graph，样式保留当前的。左边是 high-level 分页导航， 按 layer
      分组（Foundation/Capture/Engines/Skills/Endpoints），每个 milestone 是一页（小
      gadget）。点击某页显示该 milestone + 它的 tasks 的 DAG。保留一个全局 Overview 页显示完整 milestone
      DAG。
    alignment:
      what: aligned
      why: aligned
      how: aligned
      why_this_way: aligned
      expected_result: aligned
    resolved_divergences:
      - issue: "Layer grouping does not exist in the YAML data (only in the .md)."
        resolution: "Add a `layer:` field to each milestone in ai-companion.ecl.yaml;
          renderer reads it. Chosen over a hardcoded map (drifts) or topological
          depth (loses semantic layer names)."
    decisions:
      - "Sidebar top-level group = layer
        (Foundation/Capture/Engines/Skills/Endpoints)."
      - "Page = milestone; page graph = milestone node + its FN tasks."
      - "Keep a global Overview page (first sidebar entry) with the full
        milestone DAG."
    verification:
      kind: value
      checks:
        - name: page_count
          type: number
          expected: 24 # 23 milestones + 1 overview
          comparison: "actual === expected"
        - name: sidebar_layer_groups
          type: number
          expected: 5
          comparison: "actual === expected"
        - name: overview_page_present
          type: boolean
          expected: true
          comparison: "actual === expected"
      soft:
        - name: visual_style_preserved
          kind: soft
          rationale: "FTB-tree feel / dark style is human-judged."
          sign_off: { required: true, approver: human, status: pending }

# Implementation note: this is naturally two steps (add `layer:` data, then
# extend the renderer). /ccedit splits it into the FN-DAG below.

# ─── Executable FN-DAG (consumed by @aidev/exec / /ccedit) ─────────
functions:
  - id: FN-001
    name: "Add `layer:` field to every milestone in the DAG YAML"
    depends_on: []
    status: done
    output:
      file: "docs/ecl/dag/ai-companion.ecl.yaml"
      symbol: "layer"
    verify:
      command: "npx tsx scripts/verify-dag.ts layers"
      pass_condition: "exit_zero"

  - id: FN-002
    name: "Rewrite render-dag.ts into the paged sidebar view (export renderDag)"
    depends_on: [ FN-001 ]
    status: done
    output:
      file: "scripts/render-dag.ts"
      symbol: "renderDag"
    verify:
      command: "npx tsx scripts/verify-dag.ts paged"
      pass_condition: "exit_zero"

ecl_version: "2.0"
feature: "ecl-schema-upgrade"
status: completed
created: 2026-05-17
updated: 2026-05-17

prompt_calibration:
  raw_input: "ECL 优化：三层结构 (What/How/Verify)，报告按 feature 组织"
  intent_decomposition:
    total_intents: 1
    total_tracks: 1
    tracks:
      - track_id: T1
        name: "ECL schema 升级"
        priority: 1
        intents:
          - raw: "将 ECL 从纯 feature guard 升级为完整的 feature list，三层结构"
            type: feature
  tracks:
    T1:
      calibrated_scenario: |
        将现有 ECL 格式从仅包含 invariants + verification 的 feature guard，
        升级为三层结构：What（feature 描述）、How（实现方式）、Verify（验证条目）。
        同时将报告从测试平铺改为按 feature 维度组织展示。

requirements:
  - id: REQ-001
    text: "ECL schema 包含三层：What / How / Verify"
    status: validated
    confidence: 1.0
    acceptance_criteria:
      - "每个 feature entry 有 description + purpose 字段 (What)"
      - "每个 feature entry 有 implementation 块含 key_files + approach + constraints (How)"
      - "每个 feature entry 有 verification 列表，每项含 name + command + 可选 expect (Verify)"
    decomposition:
      features: [FEAT-001]

  - id: REQ-002
    text: "现有 6 个 feature guard 迁移到新格式"
    status: validated
    confidence: 1.0
    acceptance_criteria:
      - "wasm-resolver, daemon-processor, hook-extensions, onboard-renderer-split, shared-types, ast-parsers 全部迁移"
      - "原有 invariants 作为 constraints 保留"
      - "原有 verification command 作为 verification 条目保留"
    decomposition:
      features: [FEAT-002]

  - id: REQ-003
    text: "报告按 feature 维度组织展示"
    status: validated
    confidence: 1.0
    acceptance_criteria:
      - "报告展示每个 feature 的 purpose、implementation 概要、验证状态"
      - "验证状态通过运行 verification commands 获得"
      - "不再平铺测试文件列表"
    decomposition:
      features: [FEAT-003]

features:
  - id: FEAT-001
    name: "新 ECL schema 定义"
    parent: REQ-001
    complexity: small
    dependencies: []

  - id: FEAT-002
    name: "迁移现有 guard 到新格式"
    parent: REQ-002
    complexity: small
    dependencies: [FEAT-001]

  - id: FEAT-003
    name: "ECL feature report 渲染"
    parent: REQ-003
    complexity: medium
    dependencies: [FEAT-001, FEAT-002]

decisions:
  - id: DEC-001
    phase: conversation
    decision: "verification 里不区分 test 和 invariant，统一为验证条目"
    rationale: "都是'跑命令看结果'，没有本质区别"
    date: 2026-05-17

  - id: DEC-002
    phase: conversation
    decision: "每新增一个 feature 就新增对应的 ECL entry"
    rationale: "ECL 作为 feature list 的 single source of truth"
    date: 2026-05-17

  - id: DEC-003
    phase: conversation
    decision: "报告只展示 ECL 维度的结果，不再平铺所有内部测试"
    rationale: "用户关心 feature 是否正常工作，不关心内部实现测试细节"
    date: 2026-05-17

dependency_graph:
  FEAT-001: []
  FEAT-002: [FEAT-001]
  FEAT-003: [FEAT-001, FEAT-002]

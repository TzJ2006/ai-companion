      - "isWriteOperation"
      - "isEclWrite"
    modularity_check:
      single_responsibility: true
      testable_in_isolation: true
      no_shared_state: true
      config_at_boundary: true

  - id: MOD-006
    name: "Execution Config"
    parent: FEAT-006
    config_slot: "modules.exec"
    functions: [FN-010]
    file_path: "packages/exec/src/"
    entry_point: "index.ts"
    source: new
    public_interface:
      - name: "loadExecConfig"
        signature: "() => ExecConfig"
        description: "Load execution config from .devcompanion/exec.json"
      - name: "ExecConfig"
        kind: type
        description: "{ maxConcurrency: number }"
    dependencies:
      - module: config
        imports: ["projectRoot"]
        why: "Resolve .devcompanion path"
    internal_only: []
    modularity_check:
      single_responsibility: true
      testable_in_isolation: true
      no_shared_state: true
      config_at_boundary: true

# ─── Functions ─────────────────────────────────────────────────
functions:
  - id: FN-001
    name: "parseEclDag"
    parent: MOD-001
    visibility: public
    description: "Parse ECL YAML file and extract FN nodes into a typed DagGraph"
    input_interface:
      - name: "eclPath"
        type: "string"
        source: parameter
    output_interface:
      type: "Promise<DagGraph>"
      error_cases:
        - type: "EclParseError"
          when: "File not found, invalid YAML, or missing functions section"
    side_effects: [file-read]
    dependencies: []
    constraints:
      - "Must validate FN fields: id, depends_on, output, verify, status are all present"
      - "Return typed structure, not raw YAML"
    test_cases:
      - input: "valid ECL with 3 FNs"
        expected: "DagGraph with 3 nodes and correct edges"
        mocks: []
      - input: "ECL with no functions section"
        expected: "throws EclParseError"
        mocks: []
      - input: "FN missing verify field"
        expected: "throws EclParseError with field name"
        mocks: []
    depends_on: []
    enables: [FN-003, FN-005, FN-007, FN-009]
    output:
      file: "packages/exec/src/parse-ecl-dag.ts"
      symbol: "parseEclDag"
    verify:
      command: "npx vitest run .devcompanion/tests/test_exec_parseEclDag.test.ts"
      pass_condition: "exit 0"
    status: pending

  - id: FN-002
    name: "validateFnFields"
    parent: MOD-001
    visibility: internal
    description: "Validate that a raw FN object has all required fields for DAG execution"
    input_interface:
      - name: "rawFn"
        type: "Record<string, unknown>"
        source: parameter
    output_interface:
      type: "FnNode"
      error_cases:
        - type: "EclParseError"
          when: "Missing required field (depends_on, output, verify, status)"
    side_effects: []
    dependencies: []
    constraints:
      - "Must check: id, name, depends_on, output.file, output.symbol, verify.command, verify.pass_condition, status"
    test_cases:
      - input: "complete FN object"
        expected: "returns typed FnNode"
        mocks: []
      - input: "FN missing output.file"
        expected: "throws with 'missing output.file'"
        mocks: []
    depends_on: []
    enables: [FN-001]
    output:
      file: "packages/exec/src/parse-ecl-dag.ts"
      symbol: "validateFnFields"
    verify:
      command: "npx vitest run .devcompanion/tests/test_exec_validateFnFields.test.ts"
      pass_condition: "exit 0"
    status: pending

  - id: FN-003
    name: "topologicalSort"
    parent: MOD-002
    visibility: public
    description: "Kahn's algorithm: returns execution layers where each layer's nodes can run in parallel"
    input_interface:
      - name: "graph"
        type: "DagGraph"
        source: parameter
    output_interface:
      type: "ExecutionLayer[]"
      error_cases:
        - type: "CycleDetectedError"
          when: "Dependency graph contains a cycle"
    side_effects: []
    dependencies: []
    constraints:
      - "Must detect cycles and report involved FN IDs"
      - "Each layer contains only nodes whose dependencies are in prior layers"
      - "Pure function, no side effects"
    test_cases:
      - input: "linear chain: A→B→C"
        expected: "[[A], [B], [C]]"
        mocks: []
      - input: "diamond: A→B, A→C, B→D, C→D"
        expected: "[[A], [B,C], [D]]"
        mocks: []
      - input: "cycle: A→B→A"
        expected: "throws CycleDetectedError with [A, B]"
        mocks: []
      - input: "no dependencies (all independent)"
        expected: "[[A, B, C]] (single layer)"
        mocks: []
    depends_on: [FN-001]
    enables: [FN-004, FN-009]
    output:
      file: "packages/exec/src/topological-sort.ts"
      symbol: "topologicalSort"
    verify:
      command: "npx vitest run .devcompanion/tests/test_exec_topologicalSort.test.ts"
      pass_condition: "exit 0"
    status: pending

  - id: FN-004
    name: "getReadyNodes"
    parent: MOD-005
    visibility: public
    description: "Convenience wrapper: returns getExecutionState(graph).ready"
    input_interface:
      - name: "graph"
        type: "DagGraph"
        source: parameter
    output_interface:
      type: "FnNode[]"
      error_cases: []
    side_effects: []
    dependencies: ["getExecutionState"]
    constraints:
      - "Delegates to getExecutionState, returns .ready field"
      - "Pure function"
    test_cases:
      - input: "graph with mixed statuses"
        expected: "same as getExecutionState(graph).ready"
        mocks: []
    depends_on: [FN-009]
    enables: []
    output:
      file: "packages/exec/src/session-recovery.ts"
      symbol: "getReadyNodes"
    verify:
      command: "npx vitest run .devcompanion/tests/test_exec_getReadyNodes.test.ts"
      pass_condition: "exit 0"
    status: pending

  - id: FN-005
    name: "buildSubagentContext"
    parent: MOD-003
    visibility: public
    description: "Assemble the minimal context for a subagent to execute one FN"
    input_interface:
      - name: "fnId"
        type: "string"
        source: parameter
      - name: "graph"
        type: "DagGraph"
        source: parameter
      - name: "eclPath"
        type: "string"
        source: parameter
    output_interface:
      type: "Promise<SubagentContext>"
      error_cases:
        - type: "Error"
          when: "FN not found in graph"
    side_effects: [file-read]
    dependencies: ["parseEclDag"]
    constraints:
      - "Must include: FN spec, output location, parent MOD public_interface, completed deps' outputs"
      - "Must NOT include: unrelated FNs, confrontation data, probe history"
      - "Total context size must not exceed 4000 tokens; truncate dep outputs if exceeds"
    test_cases:
      - input: "FN-002 with FN-001 done"
        expected: "context includes FN-002 spec + FN-001 output location"
        mocks: []
      - input: "FN with no dependencies"
        expected: "context with empty completedDeps"
        mocks: []
    depends_on: [FN-001]
    enables: [FN-006]
    output:
      file: "packages/exec/src/build-subagent-context.ts"
      symbol: "buildSubagentContext"
    verify:
      command: "npx vitest run .devcompanion/tests/test_exec_buildSubagentContext.test.ts"
      pass_condition: "exit 0"
    status: pending

  - id: FN-006
    name: "formatSubagentPrompt"
    parent: MOD-003
    visibility: public
    description: "Convert SubagentContext into a formatted prompt string for the Agent tool"
    input_interface:
      - name: "context"
        type: "SubagentContext"
        source: parameter
    output_interface:
      type: "string"
      error_cases: []
    side_effects: []
    dependencies: []
    constraints:
      - "Output must be self-contained: agent can execute from this string alone"
      - "Include verify command so agent knows how to check its work"
      - "Include output file path so agent knows where to write"
    test_cases:
      - input: "SubagentContext for FN-001"
        expected: "string containing FN spec, output path, verify command"
        mocks: []
    depends_on: [FN-005]
    enables: []
    output:
      file: "packages/exec/src/build-subagent-context.ts"
      symbol: "formatSubagentPrompt"
    verify:
      command: "npx vitest run .devcompanion/tests/test_exec_formatSubagentPrompt.test.ts"
      pass_condition: "exit 0"
    status: pending

  - id: FN-007
    name: "updateFnStatus"
    parent: MOD-004
    visibility: public
    description: "Write a FN's status back to the ECL YAML file on disk"
    input_interface:
      - name: "eclPath"
        type: "string"
        source: parameter
      - name: "fnId"
        type: "string"
        source: parameter
      - name: "status"

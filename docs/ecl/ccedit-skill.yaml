  - id: REQ-006
    text: "最大并行数通过 .devcompanion 配置文件可调"
    status: validated
    confidence: 0.90
    source: user-stated
    priority: should
    acceptance_criteria:
      - "配置文件中有 maxConcurrency 字段"
      - "默认值为合理数值（如 3）"
      - "运行时读取配置限制同时 spawn 的 subagent 数量"
    decomposition:
      features: [FEAT-006]
    tags: [config]
    history:
      - phase: 4
        action: "Crystallized from calibrated scenario"
        date: "2026-05-27"


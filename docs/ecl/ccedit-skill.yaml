# ─── Modules ──────────────────────────────────────────────────
modules:
  - id: MOD-001
    name: "ECL DAG Parser"
    parent: FEAT-001
    config_slot: "modules.exec"
    functions: [FN-001, FN-002]
    file_path: "packages/exec/src/"
    entry_point: "index.ts"
    source: new
    public_interface:
      - name: "parseEclDag"
        signature: "(eclPath: string) => Promise<DagGraph>"
        description: "Read ECL YAML and extract FN nodes with dependency edges"
      - name: "DagGraph"
        kind: type
        description: "Typed DAG structure: nodes (FnNode[]) + edges (depends_on)"
      - name: "FnNode"
        kind: type
        description: "Single FN with id, depends_on, output, verify, status"
    dependencies:
      - module: config
        imports: ["tracking.eclDir"]
        why: "Resolve default ECL directory path"
    internal_only:
      - "parseYamlFile"
      - "validateFnFields"
    modularity_check:
      single_responsibility: true
      testable_in_isolation: true
      no_shared_state: true
      config_at_boundary: true

  - id: MOD-002
    name: "Topological Sort"
    parent: FEAT-002
    config_slot: "modules.exec"
    functions: [FN-003, FN-004]
    file_path: "packages/exec/src/"
    entry_point: "index.ts"
    source: new
    public_interface:
      - name: "topologicalSort"
        signature: "(graph: DagGraph) => ExecutionLayer[]"
        description: "Kahn's algorithm — returns layers of parallelizable nodes"
      - name: "getReadyNodes"
        signature: "(graph: DagGraph) => FnNode[]"
        description: "Return nodes whose depends_on are all done"
      - name: "ExecutionLayer"
        kind: type
        description: "One layer of nodes that can execute in parallel"
    dependencies:
      - module: MOD-001
        imports: ["DagGraph", "FnNode"]
        why: "Operates on the parsed DAG structure"
    internal_only:
      - "detectCycle"
      - "computeInDegrees"
    modularity_check:
      single_responsibility: true
      testable_in_isolation: true
      no_shared_state: true
      config_at_boundary: true

  - id: MOD-003
    name: "Subagent Context Builder"
    parent: FEAT-003
    config_slot: "modules.exec"
    functions: [FN-005, FN-006]
    file_path: "packages/exec/src/"
    entry_point: "index.ts"
    source: new
    public_interface:
      - name: "buildSubagentContext"
        signature: "(fnId: string, graph: DagGraph, eclPath: string) => Promise<SubagentContext>"
        description: "Assemble the minimal context a subagent needs to execute one FN"
      - name: "SubagentContext"
        kind: type
        description: "FN spec + output location + MOD interface + completed dep outputs"
    dependencies:
      - module: MOD-001
        imports: ["DagGraph", "FnNode"]
        why: "Reads FN spec and dependency info"
    internal_only:
      - "extractModuleInterface"
      - "collectCompletedDependencyOutputs"
    modularity_check:
      single_responsibility: true
      testable_in_isolation: true
      no_shared_state: true
      config_at_boundary: true

  - id: MOD-004
    name: "Status Manager"
    parent: FEAT-004
    config_slot: "modules.exec"
    functions: [FN-007, FN-008]
    file_path: "packages/exec/src/"
    entry_point: "index.ts"
    source: new
    public_interface:
      - name: "updateFnStatus"
        signature: "(eclPath: string, fnId: string, status: FnStatus) => Promise<void>"
        description: "Write FN status back to ECL YAML file"
      - name: "FnStatus"
        kind: type
        description: "'pending' | 'in-progress' | 'done' | 'blocked'"
    dependencies:
      - module: MOD-001
        imports: ["FnNode"]
        why: "Knows FN structure for status update"
    internal_only:
      - "readAndPatchYaml"
    modularity_check:
      single_responsibility: true
      testable_in_isolation: true
      no_shared_state: true
      config_at_boundary: true

  - id: MOD-005
    name: "Session Recovery"
    parent: FEAT-005
    config_slot: "modules.exec"
    functions: [FN-009]
    file_path: "packages/exec/src/"
    entry_point: "index.ts"
    source: new
    public_interface:
      - name: "getExecutionState"
        signature: "(graph: DagGraph) => ExecutionState"
        description: "Analyze current FN statuses and return what to do next"
      - name: "ExecutionState"
        kind: type
        description: "{ ready: FnNode[], blocked: FnNode[], done: FnNode[], pending: FnNode[] }"
    dependencies:
      - module: MOD-001
        imports: ["DagGraph", "FnNode"]
        why: "Reads node statuses"
      - module: MOD-002
        imports: ["getReadyNodes"]

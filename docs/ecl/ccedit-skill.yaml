# ─── Risk Register ─────────────────────────────────────────────
risks:
  - id: RISK-001
    description: "Concurrent ECL writes from crash/re-invoke could corrupt status"
    probability: low
    impact: high
    mitigation: "Atomic write (temp + rename) + lockfile"
    status: mitigated
    related: [ATK-004]
  - id: RISK-002
    description: "Shell injection via crafted verify command"
    probability: low
    impact: critical
    mitigation: "execFile with argv array, no shell; allowlist regex validation"
    status: mitigated
    related: [ATK-006]
  - id: RISK-003
    description: "Parallel subagents writing same source file"
    probability: medium
    impact: high
    mitigation: "Scheduler serializes FNs targeting same output file"
    status: mitigated
    related: [ATK-009]

# ─── Decisions Log ─────────────────────────────────────────────
decisions:
  - id: DEC-001
    date: "2026-05-27"
    phase: 0
    decision: "Skill named ccedit, separate from ccplan"
    rationale: "ccplan handles planning only (Phase 0-9), execution is a distinct concern"
    alternatives_considered:
      - "ccexec — rejected, less memorable"
      - "cctask — rejected, conflicts with task tracking tools"
    reversible: true
  - id: DEC-002
    date: "2026-05-27"
    phase: 0
    decision: "DAG operates at FN level, not FEAT level"
    rationale: "FN is the atomic unit that satisfies all 5 atomicity conditions"
    alternatives_considered:
      - "FEAT-level DAG — rejected, too coarse for parallel execution"
      - "New TASK layer — rejected, FN already has sufficient granularity"
    reversible: true
  - id: DEC-003
    date: "2026-05-27"
    phase: 0
    decision: "Status persisted by writing back to ECL FN status field"
    rationale: "ECL is single source of truth, no separate progress file needed"
    alternatives_considered:
      - "Separate progress.json — rejected, adds sync complexity"
    reversible: true
  - id: DEC-004
    date: "2026-05-27"
    phase: 0
    decision: "Verification failure routes to ccdebug, not internal retry"
    rationale: "ccdebug has structured debugging methodology; ccedit should not duplicate it"
    alternatives_considered:
      - "Internal retry loop — rejected, duplicates ccdebug"
    reversible: true

  - id: DEC-005
    date: "2026-05-27"
    phase: 3
    decision: "Skill + Library approach: SKILL.md defines workflow, packages/exec/ provides utility functions"
    rationale: "Deterministic DAG computation, testable, correct for large DAGs (20+ FN)"
    alternatives_considered:
      - "Pure Skill (agent does topo-sort mentally) — rejected, unreliable for large DAGs"
    reversible: true
  - id: DEC-006
    date: "2026-05-27"
    phase: 5
    decision: "FN-004 (getReadyNodes) becomes thin wrapper of FN-009 (getExecutionState) to eliminate redundancy"
    rationale: "Critic identified FN-004 as strict subset of FN-009; merged to avoid duplication"
    alternatives_considered:
      - "Delete FN-004 entirely — rejected, convenience API is useful for SKILL.md instructions"
    reversible: true
  - id: DEC-007
    date: "2026-05-27"
    phase: 5
    decision: "Only orchestrator writes ECL status (never subagents) — eliminates write race"
    rationale: "Concurrent subagent writes to same YAML file would corrupt; sequential orchestrator writes are safe"
    alternatives_considered:
      - "File locking — rejected, complex cross-platform, unnecessary with serialized writes"
    reversible: true
  - id: DEC-008
    date: "2026-05-27"
    phase: 5
    decision: "Add /ccedit reset <FN-ID> subcommand to transition blocked → pending after ccdebug fix"
    rationale: "Without this, blocked nodes have no re-entry path except manual YAML editing"
    alternatives_considered:
      - "Auto-detect ccdebug completion — rejected, too coupled"
    reversible: true
  - id: DEC-009
    date: "2026-05-27"
    phase: 8
    decision: "ccplan enters read-only mode (like plan mode) — hook blocks all write operations except ECL"
    rationale: "User requirement: ccplan should only plan, never modify code. Enforced by PreToolUse hook, not agent self-discipline"
    alternatives_considered:
      - "Rely on SKILL.md instructions only — rejected, agent might still write"
      - "Use plan mode directly — rejected, plan mode can't write ECL YAML either"
    reversible: true
  - id: DEC-010
    date: "2026-05-27"
    phase: 8
    decision: "Use marker file (.devcompanion/.ccplan-active) for fast hook detection"
    rationale: "Checking ECL YAML status on every tool call would be too slow; marker file is O(1) stat"
    alternatives_considered:
      - "Parse ECL status field — rejected, too slow for PreToolUse hook"
      - "Environment variable — rejected, not persistent across sessions"
    reversible: true


# ─── Prompt Calibration (Phase 0) ─────────────────────────────
prompt_calibration:
  raw_input: |
    实现 ccedit skill — 独立执行系统，读取 ccplan 产出的 ECL 中的 FN DAG，
    拓扑排序后 spawn subagent 并行执行原子任务，verify 通过标 done 解锁下游，
    fail 进入 ccdebug，状态写回 ECL 持久化。
  status: completed

  intent_decomposition:
    total_intents: 1
    total_tracks: 1
    tracks:
      - track_id: T1
        name: "ccedit execution skill"
        priority: 1
        intents:
          - raw: "实现 ccedit skill — 独立执行系统"
            type: feature

  tracks:
    T1:
      calibrated_scenario: |
        Build a new skill `/ccedit` that acts as the execution engine for
        approved ECL documents produced by /ccplan. It reads the FN-layer DAG
        from an ECL file, performs topological sort, spawns subagents in parallel
        for independent FN nodes, verifies each via its `verify` command, writes
        status back to ECL, and routes failures to /ccdebug. The skill is
        triggered manually and resumes from where it left off across sessions.
      intent_dimensions:
        task: { status: present, value: "Build ccedit skill — DAG-driven execution engine" }
        input: { status: present, value: "Approved ECL document with FN-layer DAG (depends_on, output, verify)" }
        output: { status: present, value: "Implemented code + updated ECL with all FN status: done" }
        constraints: { status: present, value: "Must integrate with existing skill system, ECL schema, ccdebug" }
        context: { status: enriched, value: "TypeScript monorepo, skills in skills/<name>/, ECL in docs/ecl/" }
        audience: { status: present, value: "User invoking /ccedit after /ccplan approval" }
        memory: { status: present, value: "All design decisions confirmed in conversation (see project memory)" }
        success_criteria: { status: present, value: "Skill reads ECL, topo-sorts FN DAG, spawns subagents, tracks progress, handles failures" }
        examples: { status: present, value: "FN-001 (no deps) → execute → verify pass → done → FN-002 (depends FN-001) unlocked" }

  anti_patterns_found: []
  context_enrichment:
    codebase: "skills/ has ccplan, cconboard, ccdebug with SKILL.md + <name>.md pattern"
    git: "Recent commits focus on onboarding and overview translation"
    conversation: "Full design confirmed: DAG engine, subagent execution, progress persistence, ccdebug integration"
  questions_asked: 0
  questions_skipped: "All dimensions fully specified from conversation"

# ─── Original Context ──────────────────────────────────────────
user_scenario: |
  实现 ccedit skill — 独立执行系统，读取 ccplan 产出的 ECL 中的 FN DAG，
  拓扑排序后 spawn subagent 并行执行原子任务，verify 通过标 done 解锁下游，
  fail 进入 ccdebug，状态写回 ECL 持久化。最大并行数通过 .devcompanion config 调整。
  ccplan 止步于规划输出，ccedit 从未完成的 ECL 图继续执行。

# ─── Requirements ──────────────────────────────────────────────
requirements:
  - id: REQ-001
    text: "ccedit 读取 approved ECL 文件并提取 FN 层 DAG 结构"
    status: validated
    confidence: 0.95
    source: user-stated
    priority: must
    acceptance_criteria:
      - "给定 ECL 文件路径，返回所有 FN 节点及其 depends_on 关系"
      - "ECL 中无 functions 或 functions 为空时返回错误"
      - "FN 缺少 depends_on/output/verify 字段时报错并指出缺失字段"
    decomposition:
      features: [FEAT-001]
    tags: [parser, ecl]
    history:
      - phase: 4
        action: "Crystallized from calibrated scenario"
        date: "2026-05-27"

  - id: REQ-002
    text: "DAG 引擎执行拓扑排序，检测环，识别可并行的节点集"
    status: validated
    confidence: 0.95
    source: user-stated
    priority: must
    acceptance_criteria:
      - "拓扑排序后返回分层执行序列（每层内节点可并行）"
      - "存在环时抛出错误并报告环中的 FN IDs"
      - "正确识别入度为零的节点为第一批可执行节点"
    decomposition:
      features: [FEAT-002]
    tags: [dag, algorithm]
    history:
      - phase: 4
        action: "Crystallized from calibrated scenario"
        date: "2026-05-27"

  - id: REQ-003
    text: "为每个 FN 组装 subagent 执行上下文并 spawn 并行执行"
    status: validated
    confidence: 0.90
    source: user-stated
    priority: must
    acceptance_criteria:
      - "上下文包含：FN 规格、产出位置、所属 MOD 接口、已完成依赖的 output"
      - "同层无依赖的 FN 并行 spawn，受 maxConcurrency 限制"
      - "subagent 接收的上下文足以独立完成任务，无需读取整个 ECL"
    decomposition:
      features: [FEAT-003]
    tags: [execution, subagent]
    history:
      - phase: 4
        action: "Crystallized from calibrated scenario"
        date: "2026-05-27"

  - id: REQ-004
    text: "验收通过写 done、失败写 blocked 并路由到 ccdebug"
    status: validated
    confidence: 0.95
    source: user-stated
    priority: must
    acceptance_criteria:
      - "verify command exit 0 → FN status 写为 done"
      - "verify command 非零退出 → FN status 写为 blocked"
      - "blocked 后输出信息指导用户调用 /ccdebug"
      - "done 后检查下游 FN 是否所有前置均 done，若是则加入待执行队列"
      - "verify command timeout 视为 fail（blocked）"
      - "verify command 不存在或格式错误时报告 EclParseError 而非执行"
    decomposition:
      features: [FEAT-004]
    tags: [verification, status]
    history:
      - phase: 4
        action: "Crystallized from calibrated scenario"
        date: "2026-05-27"

  - id: REQ-005
    text: "跨 session 恢复：读 ECL 当前 FN 状态从断点继续"
    status: validated
    confidence: 0.95
    source: user-stated
    priority: must
    acceptance_criteria:
      - "新 session 调用 /ccedit 时，读取 ECL 中所有 FN status"
      - "跳过 status: done 的 FN"
      - "找到 pending 且 depends_on 全部 done 的 FN 作为下一批"
      - "blocked FN 保持 blocked 直到 ccdebug 修复后用户手动 set 回 pending"
      - "ccedit 提供 reset 子命令: /ccedit reset <FN-ID> 将 blocked 改为 pending"
    decomposition:
      features: [FEAT-005]
    tags: [persistence, recovery]
    history:
      - phase: 4
        action: "Crystallized from calibrated scenario"
        date: "2026-05-27"

  - id: REQ-007
    text: "ccplan 执行过程中禁止任何代码修改（read-only mode），类似 plan mode"
    status: validated
    confidence: 0.95
    source: user-stated
    priority: must
    acceptance_criteria:
      - "ccplan 激活期间，所有 Edit/Write/Bash(写操作) 工具调用被 hook 拦截"
      - "只允许读操作：Read, Glob, Grep, WebSearch, WebFetch"
      - "允许写 ECL 文件本身（ccplan 的产出）"
      - "用户明确退出 ccplan 或进入 ccedit 后恢复写权限"
      - "hook 机制保证，不依赖 agent 自觉"
    decomposition:
      features: [FEAT-007]
    tags: [hook, safety, ccplan]
    history:
      - phase: 8
        action: "User added mid-confrontation: ccplan must be read-only like plan mode"

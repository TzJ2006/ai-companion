# ─── Probes ────────────────────────────────────────────────────
probes:
  - id: PROBE-001
    target: FEAT-004
    question: "Can we write a single FN status field in ECL YAML without corrupting comments/formatting?"
    method: code-inspection
    code_path: null
    result: "js-yaml drops comments on round-trip; yaml package (v2+) preserves comments via parseDocument(). No yaml dep exists in project yet — must add."
    verdict: feasible
    date: "2026-05-27"
    impact_if_infeasible:
      invalidates: [FEAT-004]
      alternatives: ["Use regex-based status replacement instead of full YAML parse"]

# ─── Confrontation ─────────────────────────────────────────────
confrontation:
  red_team:
    - id: ATK-004
      scenario: "Crash between ECL read and write allows dual-orchestrator corruption"
      severity: critical
      targets: [FEAT-004]
    - id: ATK-006
      scenario: "Shell injection via malicious verify command in ECL YAML"
      severity: critical
      targets: [FEAT-004]
    - id: ATK-009
      scenario: "Two parallel subagents write to same source file, last-write-wins"
      severity: critical
      targets: [FEAT-003]
    - id: ATK-011
      scenario: "Non-deterministic topo-sort order causes flaky cross-session behavior"
      severity: medium
      targets: [FEAT-002]
  blue_team:
    - attack: ATK-004
      verdict: mitigated
      mitigation: "Atomic write via temp file + rename; lockfile for multi-instance guard"
      new_requirements: []
    - attack: ATK-006
      verdict: mitigated
      mitigation: "Use execFile with argv array (no shell); validate command matches allowlist regex"
      new_requirements: []
    - attack: ATK-009
      verdict: mitigated
      mitigation: "Before dispatching parallel batch, detect same-file FNs and serialize them"
      new_requirements: []
    - attack: ATK-011
      verdict: mitigated
      mitigation: "Lexicographic priority queue in Kahn's frontier for deterministic ordering"
      new_requirements: []


    estimated_remaining_failures: 100
    recommended_approach: "Apply same pattern: export with @internal, delete broken tests, write proper mocks"

verification:
  ts_parser_tests:
    command: "npx vitest run .devcompanion/tests/ts-parser*.test.ts .devcompanion/tests/test_ts-parser*.test.ts"
    result: "4 files, 68 tests passed, 0 errors"

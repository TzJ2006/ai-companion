ecl_version: "1.0"
feature: "wasm-testing-strategy"
status: phase-10-partial
created: 2026-05-16
updated: 2026-05-16

prompt_calibration:
  raw_input: "Design WASM testing strategy for tree-sitter: 116 test failures because vitest cannot load .wasm files via relative imports."
  intent_decomposition:
    total_intents: 1
    total_tracks: 1
    tracks:
      - track_id: T1
        name: "WASM testing strategy"
        priority: 1
        intents:
          - raw: "Fix 116 tree-sitter test failures in vitest"
            type: bugfix
  tracks:
    T1:
      calibrated_scenario: |
        Resolve ts-parser test failures caused by three root causes:
        A) Private functions imported by tests → not a function errors
        B) Global vi.mock("node:fs") breaking wasm-resolver.ts existsSync
        C) AI-generated garbage test files with prose prefixes
      intent_dimensions:
        task: { status: present, value: "Fix ts-parser test failures" }
        constraints: { status: enriched, value: "Don't break public API; minimal source changes" }
        success_criteria: { status: resolved, value: "All ts-parser tests pass; no WASM errors" }

requirements:
  - id: REQ-001
    text: "Pure functions testable without WASM dependency"
    status: implemented
    confidence: 1.0
    acceptance_criteria:
      - "extractTsFunction, extractTsClass, etc. can be tested with mock SyntaxNode"
      - "No vi.mock('node:fs') needed in pure function tests"
    decomposition:
      features: [FEAT-001, FEAT-002]

  - id: REQ-002
    text: "WASM dependency isolated to init layer"
    status: implemented
    confidence: 1.0
    acceptance_criteria:
      - "initTsParser integration test passes with real WASM"
      - "Pure function tests don't trigger WASM loading"

  - id: REQ-003
    text: "Garbage test files removed and replaced"
    status: implemented
    confidence: 1.0

  - id: REQ-004
    text: "All ts-parser tests pass"
    status: implemented
    confidence: 1.0
    acceptance_criteria:
      - "68 ts-parser tests pass across 4 files"
      - "0 unhandled WASM errors"

decisions:
  - id: DEC-001
    phase: 3
    decision: "Use mock SyntaxNode objects instead of mocking web-tree-sitter module"
    rationale: "web-tree-sitter has nested node_modules copy; module-level mocks don't intercept correctly. Mock nodes are simpler and more reliable."
    date: 2026-05-16

  - id: DEC-002
    phase: 3
    decision: "Export internal functions with @internal JSDoc, don't re-export from barrel"
    rationale: "Minimal source change; tests access directly via path; public API unchanged"
    date: 2026-05-16

  - id: DEC-003
    phase: 5
    decision: "Delete and rewrite broken test files rather than patch"
    rationale: "Files contained AI prose, broken mocks, undefined params. Repair cost > rewrite cost."
    date: 2026-05-16

implementation:
  completed:
    - description: "Exported 10 internal functions in ts-parser.ts with @internal JSDoc"
      file: "packages/ast/src/ts-parser.ts"
      status: done

    - description: "Deleted 12 broken/garbage test files"
      files_removed:
        - "test_ts-parser_cleanTypeAnnotation.test.ts"
        - "test_ts-parser_extractArrowFunctions.test.ts"
        - "test_ts-parser_extractTsDecorators.test.ts"
        - "test_ts-parser_extractTsImport.test.ts"
        - "test_ts-parser_findTsWasmPath.test.ts"
        - "test_ts-parser_parseTsFile.test.ts"
        - "test_ts-parser_parseTsSource.test.ts"
        - "test_ts-parser_extractTsFunction.test.ts"
        - "test_ts-parser_extractTsClass.test.ts"
        - "test_ts-parser_extractTsMethod.test.ts"
        - "test_ts-parser_handleExportStatement.test.ts"
        - "test_ts-parser_extractJsDoc.test.ts"
        - "ts-parser-comprehensive-final.test.ts"
        - "ts-parser-comprehensive.test.ts"
        - "ts-parser-complete.test.ts"
      status: done

    - description: "Created ts-parser-internal.test.ts (34 tests, mock SyntaxNode)"
      file: ".devcompanion/tests/ts-parser-internal.test.ts"
      status: done

    - description: "Rewrote test_ts-parser_initTsParser.test.ts (4 integration tests)"
      file: ".devcompanion/tests/test_ts-parser_initTsParser.test.ts"
      status: done

    - description: "Simplified ts-parser.test.ts (4 export verification tests)"
      file: ".devcompanion/tests/ts-parser.test.ts"

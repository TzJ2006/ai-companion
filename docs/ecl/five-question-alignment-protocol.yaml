  by_severity: { critical: 3, high: 4, medium: 4, low: 1 }
  findings:
    - { id: F-01, target: [DEC-002, VC-07], severity: critical, issue: "ALIGNMENT THEATER — AI infers all 5 answers, human just confirms => anchoring + acquiescence => manufactures FALSE consensus. VC-07 samples the same anchored data, cannot detect its own failure.", fix: "Independent elicitation: human commits >=1 answer (esp. expected-result) BEFORE seeing the AI's; diff them; divergence rate = the real alignment metric." }
    - { id: F-02, target: [REQ-007, FEAT-004, VC-02], severity: critical, issue: "UNIVERSAL enforcement at MANUAL edits is impossible — PreToolUse/PostToolUse hooks only see Claude's own tool calls; a human editing outside Claude emits no event. 'No modification bypasses' is false for the one path REQ-007 names.", fix: "Gate Claude-mediated paths; DETECT manual edits post-hoc via a git pre-commit check. Drop 'Universal'." }
    - { id: F-03, target: [DEC-007, DEC-009], severity: critical, issue: "BOOTSTRAP paradox + infinite regress — building the protocol is itself a task-level mod (must follow the unbuilt protocol); this ECL governs ECLs => editing it triggers the protocol on itself, no base case.", fix: "Declare a self-exemption base case: the protocol's own file + the meta-act of editing protocol records are out of scope; bootstrap under ccplan." }
    - { id: F-04, target: [DEC-001, REQ-002, FEAT-002], severity: high, issue: "REDUNDANT with + CONFLICTS ccplan — ~80% is ccplan Phase 0/1/2/4 always-on; and ccplan is READ-ONLY (writes ECL only under .ccplan-active), so its guard would BLOCK this protocol's edit-time ECL writes.", fix: "Fold into ccplan as an always-on micro-mode; reconcile the read-only vs edit-time write-permission model." }
    - { id: F-05, target: [REQ-005, FEAT-003, VC-03], severity: high, issue: "TEST-FIRST degenerates to 'everything soft' — this repo is mostly YAML/markdown/decision artifacts you cannot vitest; step 2 always lands on kind:soft => the 'guarantee' evaporates into manual sign-off. VC-03 trivially satisfied by tagging all soft.", fix: "Test-first applies only to code-producing ideas; for doc/decision ideas use a concrete acceptance check (e.g., a second agent re-derives the same answer)." }
    - { id: F-06, target: [REQ-001, REQ-003, DEC-010], severity: high, issue: "FRICTION does not survive a 20-task day even at task-level: ~40-60 min/day of pure confirmation overhead => rubber-stamping => CAUSES F-01.", fix: "Batch related/low-risk ideas; reserve independent confirm for high-risk/conflict-detected; gate always-on behind a novelty/impact threshold." }
    - { id: F-07, target: [VC-01, VC-02, VC-06], severity: high, issue: "VCs not checkable as written: VC-01's '(not a pure question)' contradicts DEC-008; VC-06 references an undefined 'OL' store; VC-02 false for manual edits.", fix: "Align VC-01 with DEC-008; bind VC-06 to a concrete path (.devcompanion/history/<id>.json); add a NEGATIVE test for VC-02 (inject manual edit, MUST be surfaced)." }
    - { id: F-08, target: [REQ-008, FEAT-005], severity: medium, issue: "Write-only audit — every task records a multi-KB 5-tuple, no reader/query/retention specified; AI-inferred answers recorded as fact create a FALSE trail.", fix: "Specify the reader + the question it answers; add retention; record the CONFIRMATION DELTA (did the human edit the AI's answer?) — the high-signal anti-theater part." }
    - { id: F-09, target: [DEC-012, REQ-001], severity: medium, issue: "'Task-level' is undefined + uncapturable by a per-tool-call hook — no notion of 'cohesive task'; the hook either over-fires per edit (friction) or cannot enforce.", fix: "Task boundary is a conversational/ECL-state concept the human/AI declares; the hook can only do per-edit DETECTION." }
    - { id: F-10, target: [DEC-006, REQ-005], severity: medium, issue: "Reuse of cconboard char-test/revert asserted, not contracted => silent breakage if cconboard changes; done-iff-green + an un-passable soft item => workflow deadlock with no escape hatch.", fix: "Add an interface contract for the reused loop + an explicit override/abandon path with recorded rationale." }
    - { id: F-11, target: [REQ-004, FEAT-001], severity: medium, issue: "Only why_this_way is genuinely new; 'expected-with-test' duplicates ecl-schema-upgrade's existing verification/acceptance_criteria => risks a SECOND divergent verification schema.", fix: "FEAT-001 = add why_this_way (new) + a kind:hard|soft tag on EXISTING verification entries; no parallel 'expected' field." }
    - { id: F-12, target: [DEC-003], severity: low, issue: "Premise 'human & AI routinely diverge' never measured; the chosen mechanism (passive infer + confirm) is the WEAKEST divergence detector — optimizes against its own thesis.", fix: "Capture a baseline divergence rate + post-protocol divergence-at-elicitation; else the value is unfalsifiable." }

# ─── Phase 9: BUILD-plan Adversarial Validation ────────────────
build_validation_findings:
  critic: "context-isolated implementation critic (Opus), grounded in working-tree source"
  verdict: "BUILD PLAN NOT READY as written. 3 of 4 load-bearing claims (always-on trigger, confirmed-node gate, values+code verification 'extend') are grounded in code that does something fundamentally different. 'extend' appears 5x and each hides a from-scratch subsystem or a wrong target. ALL unsolved mechanism risk concentrates in FEAT-004 (enforcement)."
  by_severity: { critical: 3, high: 7, medium: 2 }
  findings:
    - { id: BF-01, target: [FN-001, REQ-001], severity: critical, issue: "ALWAYS-ON is vaporware — a skill is prompt text; the only programmatic always-on surfaces are per-tool-call hooks that fire AFTER the model decides to edit. detectTaskIdea = 'model remembers', not enforcement.", fix: "Drop always-on as a mechanical claim; MVP = per-edit reminder hook; the loop is explicitly best-effort." }
    - { id: BF-02, target: [FN-009, MOD-004, REQ-007], severity: critical, issue: "Gate has NO state to read — pre-tool-use-guard.ts only checks the .ccplan-active marker + ECL path; zero 'confirmed 5Q node' state exists anywhere. 'Extend the gate' hides building a whole confirmation-state subsystem.", fix: "Design a concrete confirmed-state artifact (.devcompanion/.5q-confirmed.json) + a file-to-idea matching rule BEFORE any gate code." }
    - { id: BF-03, target: [FN-009, REQ-003], severity: high, issue: "Confirm-vs-hook race: the AI can write the confirmed-state file + the Edit back-to-back in one turn, self-authorizing — the hook cannot tell human-confirmed from AI-fabricated. Re-introduces F-01 theater at the enforcement layer.", fix: "Confirmation state must be written by a channel the AI cannot forge in-turn (the human's AskUserQuestion answer)." }
    - { id: BF-04, target: [FN-003, F-01], severity: high, issue: "'Human-first' (the flip) is unenforceable — in one autoregressive turn the AI has already inferred; it is only a prompt convention. The real anti-theater signal (confirmation delta) needs two independently-stored strings, unspecified.", fix: "Persist the human's raw expected-result verbatim (AI-untouched) BEFORE revealing the AI's inference; diff mechanically." }
    - { id: BF-05, target: [MOD-003, FN-006, FN-007, DEC-014], severity: critical, issue: "verification-runner.ts 'extend' is a REWRITE — it does substring-matching on shell stdout (greps '无输出'/'≤N'); no value model, no comparison code. DEC-014's values+code is a from-scratch typed evaluator.", fix: "Re-label MOD-003 source:new; use DECLARATIVE comparators (eq/lte/gte/contains), NOT arbitrary code, for the MVP." }
    - { id: BF-06, target: [MOD-002, REQ-004], severity: critical, issue: "Schema 'extend' targets the WRONG parser — ecl-parser.ts only parses '- feature:' guard blocks (1 of 11 ECL files); the REQ/FEAT/MOD/FN NODE schema is parsed by NOTHING. And 'expected' duplicates existing verification (F-11 unaddressed).", fix: "why_this_way = doc-only in ecl-schema.md; reuse acceptance_criteria + a kind:hard|soft tag; NO parallel 'expected' field; node-verification = a NEW parser only if ever needed." }
    - { id: BF-07, target: [REQ-009, FN-012], severity: high, issue: "self_exempt flag is read by NOTHING; and findActiveFeatures (pre-tool-use) currently flags THIS protocol file (status phase-9) as an 'active feature' -> the F-03 recursion is already live.", fix: "Specify the exact reader (gate + detectTaskIdea skip docs/ecl/ + the protocol file + self_exempt nodes); add a negative test." }
    - { id: BF-08, target: [FN-006, FN-007, FN-010], severity: high, issue: "Arbitrary-code + git-hook trust surface undefined — runVerification already execSyncs shell with no sandbox; 'comparison code' = arbitrary code execution; the pre-commit is defeated by --no-verify (REQ-007 concedes); no install/bypass/failure spec.", fix: "MVP = declarative comparators (no eval); pre-commit is ADVISORY (warn, exit 0); specify the install path." }
    - { id: BF-09, target: [MOD-005, FN-011, REQ-008], severity: high, issue: "Recording (index.ts PostToolUse) only fires for .py/.ts files -> silently DROPS .yaml/.md, which is what this protocol mostly produces. VIOLATES the user's own memory rule '不支持AST的文件也应记录事件,退化到文件级'. No reader specified.", fix: "Extend SUPPORTED_EXTENSIONS / add a file-level degradation path for .yaml/.md; the 5Q+delta payload is written by the loop and correlated with the hook diff event; specify the reader." }
    - { id: BF-10, target: [DEC-013, MOD-007, FEAT-006], severity: high, issue: "'/ccdiscuss is a PREREQUISITE of /ccplan' has NO enforcement — skills are invoked independently; 'prerequisite' is pure documentation unless ccplan reads a concrete artifact and degrades when absent.", fix: "Implement the prereq as a CONSUMED ARTIFACT: /ccdiscuss writes the aligned 5Q ECL; ccplan Phase 0 checks for it and falls back if missing. Drop 'prerequisite' framing." }
    - { id: BF-11, target: [DEC-006, REQ-005, F-05], severity: medium, issue: "Test-first still degenerates to all-soft for doc artifacts (value extraction unimplemented BF-05 + recording can't see docs BF-09) -> rubber-stamped soft sign-offs -> re-creates F-01 theater.", fix: "Design the SOFT path to carry signal: require the confirmation-delta even for soft items; gate always-on behind a novelty/impact threshold (F-06)." }
    - { id: BF-12, target: [dependency_graph, DEC-007, F-03], severity: medium, issue: "Bootstrap regime undefined — FEAT-001..006 are themselves modifications that must obey a protocol that does not exist yet; the build order ships enforcement (FEAT-004) on unbuilt state.", fix: "State the regime: build FEAT-001/002/005 under /ccedit with no 5Q-gate; enable FEAT-004 only after FEAT-005 + the self-exempt reader exist." }
  recommended_mvp:
    ship_now:
      - "FEAT-001 DOC-ONLY: add why_this_way to skills/ccplan/ecl-schema.md + a kind:hard|soft tag on EXISTING acceptance_criteria (NOT a new 'expected' field/parser)."
      - "FEAT-005 FILE-LEVEL recording: extend packages/hook/src/index.ts SUPPORTED_EXTENSIONS to include .yaml/.md (honors the '退化到文件级' memory rule) + a 5Q-placeholder event + a reader stub."
      - "/ccdiscuss SKILL.md loop as EXPLICITLY best-effort conversational discipline (no 'always-on/enforced' claims)."
    defer_until_designed:
      - "FEAT-002 parser work; FEAT-003 value-verification (needs a declarative-comparator design); ALL of FEAT-004 (gate + pre-commit) — until BF-02/03/05/08 have a concrete, forge-resistant state-and-trust design."
    note: "MVP touches only ecl-schema.md, index.ts, skills/ — no gate needed, which also cleanly solves the bootstrap (BF-12)."


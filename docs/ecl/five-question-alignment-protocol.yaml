# Maps the 5 questions onto the existing node schema (extends ecl-schema-upgrade's 3-layer)
schema_mapping:
  "是什么 (What)":            "node.description — exists (What layer)"
  "为什么要做 (Why)":         "node.purpose / parent REQ — exists"
  "如何做 (How)":             "implementation.approach — exists (How layer)"
  "为什么要这样做 (Why-this-way)": "NEW — per-node rationale for the CHOSEN approach"
  "期望结果 (Expected)":      "verification + acceptance_criteria — exists, reframed as a PREDICTED outcome backed by a test (test-first)"


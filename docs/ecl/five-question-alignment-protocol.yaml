# This document DOGFOODS the protocol: it describes the protocol itself via the protocol's own 5 questions.
five_question_record:
  subject: "The 5-Question Alignment + Test-First Guarantee Protocol"
  q1_what: |
    是什么 — A lightweight, ALWAYS-ON protocol. Whenever a new idea/proposal appears in
    conversation (not a pure task-question), draft an ECL that captures it through 5 fixed
    questions, and confirm them with the human before work proceeds.
  q2_why: |
    为什么要做 — Because the human's and the AI's understanding of the same idea routinely
    diverge. The 5 questions are an ALIGNMENT CONTRACT that proves shared understanding
    before acting, and leaves a traceable record of how ideas evolved. (Core goal: 对齐理解.)
  q3_how: |
    如何做 — TRIGGER (OQ-1, simplified): ANY thing to be modified IS a new idea — no fuzzy
    idea-vs-question detection needed. For each new idea:
      (1) conflict/dup-check against existing ECLs   (reuse ccplan Phase 1 ECL Reuse Discovery)
      (2) split the idea into one or more ECL nodes   (reuse ccplan Phase 4 crystallization)
      (3) create/modify each ECL node, GUARANTEEING all 5 questions are present
      (4) confirm EACH idea INDEPENDENTLY (OQ-3) before work proceeds
    ALWAYS-ON + UNIVERSAL: enforced at every ECL touchpoint and every modification point (OQ-2).
  q4_why_this_way: |
    为什么要这样做 — Passive drafting spares the human from writing (low authoring burden);
    but EVERY idea is confirmed because we'd rather over-confirm than miss an alignment. The
    5-question structure is the explicit contract; the on-disk ECL makes it version-controlled
    and auditable; the human confirm closes the understanding gap.
  q5_expected: |
    期望结果 — Every idea reaches PROVABLE shared understanding before work proceeds; the
    actual outcome is GUARANTEED to match the expected outcome via a test-first next step
    (see protocol_sequence step 2); a version-controlled trail of (5 answers + test + diff +
    actual-vs-expected) exists; fewer "that's not what I meant" moments.
    >> This expected result is itself operationalized as verification_conditions below
       (dogfooding the "write tests first" step).

protocol_sequence:
  - step: 1-align
    name: "Capture & Align"
    detail: "New idea → draft 5 questions → human confirms → shared understanding locked."
  - step: 2-test-first
    name: "Write tests from the expected result — THE GUARANTEE STEP"
    detail: |
      From the confirmed 期望结果, write the test/check FIRST. Writing the test IS the probe:
      · can write it  → guarantee secured (expected == actual  ⟺  test passes)
      · cannot write it → expectation is too fuzzy → sharpen it (re-align) OR explicitly tag
        it soft/human-judged. NEVER silently drop.
  - step: 3-implement
    name: "Implement; done iff tests pass"
    detail: "A change is 'done' only when its expected-result test passes → actual == expected, pinned by the test."
  - cross_cutting: "Passively record all diffs + the 5 answers + the test + actual-vs-expected for version-controlled review."

# ── The expected result, made TESTABLE (the 'write tests first' step applied to THIS protocol) ──
verification_conditions:
  # Checkable acceptance conditions that would prove the protocol is actually in effect.
  - id: VC-01
    proves: "q1_what / q3_how — idea becomes a 5-question draft"
    check: "Given a conversation turn with a new idea (not a pure question), the system produces an ECL draft with all 5 question fields non-empty."
    kind: hard
  - id: VC-02
    proves: "q2_why — alignment happens BEFORE work"
    check: "No recorded implementation change exists without a linked, human-CONFIRMED 5-question record."
    kind: hard
  - id: VC-03
    proves: "q5_expected — every expectation has teeth"
    check: "Every 期望结果 field carries EITHER an executable test/command OR an explicit kind:soft tag. No untagged prose expectations."
    kind: hard
  - id: VC-04
    proves: "step 3 — done iff guaranteed"
    check: "An item is marked done only when its expected-result test passes (done ⟺ verification green)."
    kind: hard
  - id: VC-05
    proves: "step 2 probe — fuzzy expectations are surfaced, not dropped"
    check: "An expected result that cannot be turned into a test is flagged soft/needs-human-judgment, never silently skipped."
    kind: hard
  - id: VC-06
    proves: "cross_cutting — auditable trail"
    check: "For each change, git/OL history contains the diff + the 5 answers + the test + actual-vs-expected."
    kind: hard
  - id: VC-07
    proves: "q2_why — alignment was ACTUALLY achieved (semantic)"
    check: "On a sample of recorded ideas, the human agrees the recorded 5 answers match their intent."
    kind: soft   # human-judged — the residue no mechanical test covers (demonstrates the soft case)


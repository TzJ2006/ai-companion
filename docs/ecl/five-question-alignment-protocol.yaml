  - id: REQ-002
    text: "Per-idea pipeline: (1) conflict/dup-check vs existing ECLs, (2) split into ECL node(s), (3) every node carries the 5 questions."
    status: validated
    confidence: 0.85
    source: user-stated
    priority: must
    acceptance_criteria:
      - "Conflict/dup-check reuses ccplan Phase 1 ECL Reuse Discovery."
      - "Split reuses ccplan Phase 4 crystallization."
      - "Every ECL node has all 5 question fields non-empty (or explicitly deferred)."
  - id: REQ-003
    text: "Each idea (task-level cohesive change, DEC-012) is confirmed INDEPENDENTLY by the human before work proceeds (no batching across ideas)."
    status: validated
    confidence: 0.9
    source: user-stated
    priority: must
    acceptance_criteria: ["One confirmation per idea; work does not start until that idea's 5 answers are confirmed."]
  - id: REQ-004
    text: "Extend the ECL node schema with the 2 new questions: why-this-way (rationale) + expected-with-test (predicted outcome + its test)."
    status: validated
    confidence: 0.9
    source: user-stated
    priority: must
    acceptance_criteria: ["Node schema gains why_this_way + expected (with test/command or kind:soft). Supersedes/extends ecl-schema-upgrade 3-layer."]
  - id: REQ-005
    text: "Expectation (natural language) + value-based verification (DEC-014): the '期望结果' is STATED IN NATURAL LANGUAGE; HOW to guarantee actual == expected is operationalized as ONE OR MORE values (number/boolean) + comparison code that computes the actual value(s) and compares to the expected value(s). done iff all comparisons pass. If NO value can be derived to check it -> proxy metric, else kind:soft + human sign-off (OQ-4)."
    status: validated
    confidence: 0.85
    source: user-stated
    priority: must
    acceptance_criteria:
      - "Expected result = a natural-language statement (human-readable)."
      - "Verification = >=1 (value, type: number|boolean, comparison) + code; done iff ALL comparisons pass (VC-04)."
      - "No derivable value -> proxy metric OR kind:soft + sign-off (VC-05, OQ-4)."
  - id: REQ-006
    text: "Soft expectations (kind:soft) require human sign-off before the item is marked done."
    status: validated
    confidence: 0.9
    source: user-stated
    priority: must
    acceptance_criteria: ["A kind:soft item cannot reach done without a recorded human sign-off (OQ-4)."]
  - id: REQ-007
    text: "Enforcement = GATE + DETECT (F-02 fix): GATE all Claude-mediated modification paths (require a confirmed 5Q node before Edit/Write); DETECT genuine MANUAL edits post-hoc via a git pre-commit check that flags un-recorded changes for retroactive 5Q. Manual edits cannot be PREVENTED, only surfaced."
    status: validated
    confidence: 0.8
    source: probe-result
    priority: must
    acceptance_criteria:
      - "A Claude-mediated Edit/Write lacking a confirmed 5Q node is blocked (reuse pre-tool-use-guard.ts)."
      - "A manual (non-Claude) edit is DETECTED at commit time and quarantined for retroactive 5Q (negative test: inject a manual edit -> it MUST be surfaced)."
    challenges: ["'Universal prevention' was impossible (F-02); reframed as gate-Claude + detect-manual."]
  - id: REQ-008
    text: "Passive recording + version control — per change record diff + 5 answers + verification(values+code) + actual-vs-expected, AND the CONFIRMATION DELTA (did the human edit the AI's inferred answers?) which is the high-signal anti-theater part (F-08). Specify a reader + retention; the trail must be queryable, not write-only."
    status: validated
    confidence: 0.85
    source: user-stated
    priority: must
    acceptance_criteria:
      - "Each change records diff + 5 answers + verification + actual-vs-expected + confirmation-delta to a concrete store (e.g., .devcompanion/history/<id>.json)."
      - "Recorded answers are flagged AI-inferred vs human-edited (so the trail isn't a false consensus record)."
  - id: REQ-009
    text: "Self-exemption base case (F-03 fix): the /ccdiscuss protocol's own definition file and the meta-act of editing protocol/ECL records are OUT of scope, terminating the 'ECL governing ECLs' recursion. /ccdiscuss's own bootstrap is built under /ccplan, not under itself."
    status: validated
    confidence: 0.85
    source: probe-result
    priority: must
    acceptance_criteria:
      - "Editing an ECL/protocol record does NOT recursively re-trigger the protocol on itself."
      - "A declared exemption list (protocol/ECL files) is respected."


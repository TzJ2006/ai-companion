  raw_input: |
    idea: 我需要一个 skill，能帮我生成一下双语的 overview.html 文档
    follow-up: 我刚才说的这个应该如何做到
    /ccplan: 开始规划
  status: skipped
  reason: >-
    Fast-tracked per the read-if-present handoff: /ccdiscuss already aligned
    intent (alignment_record below — 5 questions all `aligned`, 3 divergences
    resolved). Phase 0 calibration and Phase 2 hypothesis interrogation are
    short-circuited.
  intent_decomposition:

ecl_version: "1.0"
feature: "ai-companion-dashboard"
status: completed
created: 2026-05-21
updated: 2026-05-21

prompt_calibration:
  raw_input: "需要一个 CI 入口 + 聚合所有 repo HTML 报告的地方，支持搜索和添加项目"
  intent_decomposition:
    total_intents: 2
    total_tracks: 1
    tracks:
      - track_id: T1
        name: "AI Companion Dashboard"
        priority: 1
        intents:
          - raw: "一键触发入口"
            type: feature
          - raw: "聚合所有 repo 的 HTML 报告，支持搜索和添加项目"
            type: feature
  tracks:
    T1:
      calibrated_scenario: |
        在 ai-companion monorepo 中新增 packages/dashboard 包。
        一条命令 (npm run dashboard) 启动 Fastify HTTP 服务监听本地端口，
        自动打开浏览器。仪表盘扫描配置中的 repo 目录发现 *.html 报告，
        按 repo 分组展示卡片。支持即时搜索和通过 UI 添加新项目路径。
        纯 HTML/CSS/JS 前端，无框架依赖。配置文件 ~/.aidev-dashboard.json
        持久化项目列表。预留 onboarding 扩展接口但暂不实现。

requirements:
  - id: REQ-001
    text: "一条命令启动服务并自动打开浏览器"
    status: verified
    confidence: 0.95
  - id: REQ-002
    text: "扫描配置中的 repo 目录发现 HTML 报告"
    status: verified
    confidence: 0.9
  - id: REQ-003
    text: "按 repo 分组的卡片式展示"
    status: verified
    confidence: 0.9
  - id: REQ-004
    text: "即时搜索过滤（按 repo 名和文件名）"
    status: verified
    confidence: 0.9
  - id: REQ-005
    text: "通过 UI 添加/移除项目路径"
    status: verified
    confidence: 0.85
  - id: REQ-006
    text: "配置持久化到用户级 JSON 文件"
    status: verified
    confidence: 0.9
  - id: REQ-007
    text: "端口冲突自动处理（fallback 到下一个可用端口）"
    status: verified
    confidence: 0.9

decisions:
  - id: DEC-001
    text: "选择 Fastify 轻量服务 + 纯 HTML/CSS/JS 前端"
    rationale: "动态交互能力 + 极低内存 + 未来可扩展"
    alternatives_rejected:
      - "静态索引页（缺交互）"
      - "Tauri 微应用（开发成本高）"

dependency_graph:
  FEAT-005: []
  FEAT-002: [FEAT-005]
  FEAT-001: [FEAT-002, FEAT-005]
  FEAT-003: [FEAT-001]
  FEAT-004: [FEAT-003]

security:
  - binding: "127.0.0.1 only"
  - path_traversal: "resolve + prefix check on report serving"
  - input_validation: "addProject verifies path exists and is directory"

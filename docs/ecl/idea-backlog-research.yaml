ecl_version: "1.0"
feature: "idea-backlog-research"
status: completed
created: 2026-05-21
updated: 2026-05-21

prompt_calibration:
  raw_input: "记录点子 + 空闲时自动调研 prior art"
  intent_decomposition:
    total_intents: 1
    total_tracks: 1
    tracks:
      - track_id: T1
        name: "Idea Backlog + Research"
        priority: 1
        intents:
          - raw: "记录 idea + 手动触发调研 + 产出完整报告"
            type: feature
  tracks:
    T1:
      calibrated_scenario: |
        在任意 repo 的 .devcompanion/ideas/ 中用 JSON 格式存储 idea。
        通过 CLI 命令 `idea add` 记录，`idea research <slug>` 手动触发后台调研。
        调研引擎调用 `claude -p` 执行搜索和分析，产出结构化 Markdown 报告。
      intent_dimensions:
        task: { status: present, value: "Idea 记录 + 调研系统" }
        input: { status: present, value: "CLI args: title, description, tags" }
        output: { status: present, value: "结构化 Markdown 调研报告" }
        constraints: { status: enriched, value: "JSON 存储, 复用现有 claude-caller" }
        context: { status: enriched, value: "TypeScript monorepo, npm workspaces, ESM" }
        audience: { status: present, value: "开发者（单人使用）" }
        memory: { status: present, value: "需跨 repo 可移植" }
        success_criteria: { status: resolved, value: "idea CRUD + 7-section 调研报告 + 120s timeout" }
        examples: { status: missing, deferred: true }

requirements:
  - id: REQ-001
    text: "用户可以通过 CLI 记录 idea（title, description, tags）"
    status: verified
    confidence: 0.95
    acceptance_criteria:
      - "idea add 'title' --description '...' 创建 JSON 文件"
      - "slug 自动生成，碰撞追加 -2"
      - "ideas-index.json 同步更新"
    decomposition:
      features: [FEAT-001]

  - id: REQ-002
    text: "用户可以手动触发调研"
    status: verified
    confidence: 0.95
    acceptance_criteria:
      - "idea research <slug> 启动后台 claude -p 调研"
      - "状态从 draft 变为 researching，完成后变为 researched 或 failed"
      - "120s timeout + abort + 不留孤儿进程"
    decomposition:
      features: [FEAT-002]

  - id: REQ-003
    text: "调研产出结构化 Markdown 报告"
    status: verified
    confidence: 0.95
    acceptance_criteria:
      - "报告包含 7 个 section: Summary, Prior Art, Comparison, Technical Feasibility, Implementation Approaches, Risks, Recommended Next Steps"
      - "每 section 至少 50 字符"
      - "校验失败则标记 failed 状态"
    decomposition:
      features: [FEAT-003]

  - id: REQ-004
    text: "通过 CLI 子命令操作"
    status: verified
    confidence: 0.95
    acceptance_criteria:
      - "idea add / list / research / show 四个子命令可用"
      - "集成到现有 @aidev/cli 中"
    decomposition:
      features: [FEAT-004]

features:
  - id: FEAT-001
    name: "Idea 创建与存储"
    parent: REQ-001
    modules: [MOD-001]
    dependencies: []
    complexity: small

  - id: FEAT-002
    name: "调研执行引擎"
    parent: REQ-002
    modules: [MOD-002]
    dependencies: [FEAT-001, FEAT-003]
    complexity: medium

  - id: FEAT-003
    name: "报告生成与校验"
    parent: REQ-003
    modules: [MOD-003]
    dependencies: []
    complexity: small

  - id: FEAT-004
    name: "CLI 子命令集成"
    parent: REQ-004
    modules: [MOD-004]
    dependencies: [FEAT-001, FEAT-002]
    complexity: small

modules:
  - id: MOD-001
    name: "idea-store"
    parent: FEAT-001
    file_path: "packages/idea/src/idea-store.ts"
    functions:
      - { id: FN-001, name: "createIdea", signature: "(title, description, tags?) => IdeaEntry" }
      - { id: FN-002, name: "listIdeas", signature: "(filter?) => IdeaEntry[]" }
      - { id: FN-003, name: "getIdea", signature: "(slug) => IdeaEntry | null" }
      - { id: FN-004, name: "updateIdeaStatus", signature: "(slug, status) => void" }
      - { id: FN-005, name: "generateSlug", signature: "(title) => string" }

  - id: MOD-002
    name: "researcher"
    parent: FEAT-002
    file_path: "packages/idea/src/researcher.ts"
    functions:
      - { id: FN-006, name: "buildResearchPrompt", signature: "(idea, projectContext) => string" }
      - { id: FN-007, name: "executeResearch", signature: "(slug, options?) => ResearchReport" }
      - { id: FN-008, name: "saveReport", signature: "(slug, report) => string" }

  - id: MOD-003
    name: "report-validator"
    parent: FEAT-003
    file_path: "packages/idea/src/report-validator.ts"
    functions:
      - { id: FN-009, name: "validateResearchReport", signature: "(markdown) => ValidationResult" }
      - { id: FN-010, name: "formatReportHeader", signature: "(idea, metadata) => string" }

  - id: MOD-004
    name: "cli-idea-command"
    parent: FEAT-004
    file_path: "packages/cli/src/commands/idea.ts"
    functions:
      - { id: FN-011, name: "ideaAddCommand" }
      - { id: FN-012, name: "ideaListCommand" }
      - { id: FN-013, name: "ideaResearchCommand" }
      - { id: FN-014, name: "ideaShowCommand" }

dependency_graph:
  "@aidev/llm": []
  "scripts-migration": ["@aidev/llm"]
  FEAT-001: ["@aidev/llm"]
  FEAT-003: []
  FEAT-002: [FEAT-001, FEAT-003, "@aidev/llm"]
  FEAT-004: [FEAT-001, FEAT-002]

decisions:
  - id: DEC-001
    date: 2026-05-21
    decision: "存储格式用 JSON，不引入 YAML 依赖"
    rationale: "与 HistoryStore/AnalysisStore 保持一致"

  - id: DEC-002
    date: 2026-05-21
    decision: "方案 B+A: 独立 @aidev/idea 包 + CLI 子命令"
    rationale: "关注点分离，可测试性好，符合现有 monorepo 结构"

  - id: DEC-003
    date: 2026-05-21
    decision: "提取 @aidev/llm 共享包"
    rationale: "消除 scripts/lib/claude-caller.ts 的不可复用性"

  - id: DEC-004
    date: 2026-05-21
    decision: "直接 spawn claude 而非包 PowerShell"
    rationale: "解决 timeout 无法杀子进程树问题"

  - id: DEC-005
    date: 2026-05-21
    decision: "报告 7 sections 必须校验"
    rationale: "防止 LLM 输出不合格时误标 researched"

confrontation:
  red_team:
    - { id: ATK-001, scenario: "并发 research 竞争", severity: medium, verdict: mitigated }
    - { id: ATK-002, scenario: "LLM 输出缺少 sections", severity: high, verdict: mitigated }
    - { id: ATK-003, scenario: "slug Unicode 碰撞", severity: medium, verdict: mitigated }
    - { id: ATK-004, scenario: "timeout 不杀进程树", severity: high, verdict: mitigated }
    - { id: ATK-005, scenario: "prompt injection", severity: low, verdict: defended }
    - { id: ATK-006, scenario: "输出过大", severity: low, verdict: mitigated }
    - { id: ATK-007, scenario: "llm 提取破坏 scripts", severity: high, verdict: mitigated }
    - { id: ATK-008, scenario: "Claude CLI 不可用", severity: medium, verdict: mitigated }

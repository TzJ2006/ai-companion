ecl_version: "2.0"
feature: "unified-overview-report"
status: abandoned
# never completed; superseded by generate-overview.ts /ccoverview
created: 2026-05-18
updated: 2026-08-17

prompt_calibration:
  raw_input: "将多个 HTML report 统一为 Overview HTML，三层结构+函数调用图+checkbox 人工确认"
  intent_decomposition:
    total_intents: 1
    total_tracks: 1
    tracks:
      - track_id: T1
        name: "Unified Overview Report"
        priority: 1
        intents:
          - raw: "合并现有报告为统一的 Overview HTML"
            type: feature
  tracks:
    T1:
      calibrated_scenario: |
        将现有 5 个 HTML 报告合并为 1 个统一的 Overview HTML。
        三层结构：项目总览 → ECL Feature 列表 → 函数索引。
        新增函数直接调用图分析（dependencies / called by）。
        所有验证条目旁有人工确认 checkbox，状态可导出/导入。
        文件更新时自动归档旧版，保留最近 10 个。

requirements:
  - id: REQ-001
    text: "Overview HTML 包含三层结构"
    status: validated
    confidence: 1.0
    acceptance_criteria:
      - "第一层：项目总览（描述、feature 数、函数数、验证通过率、checkbox 进度）"
      - "第二层：ECL Feature 列表（What/How/Verify + 实现函数超链接）"
      - "第三层：函数索引（全部函数，与 ECL feature 相同的 What/How/Verify 结构）"
    decomposition:
      features: [FEAT-001, FEAT-002, FEAT-003]

  - id: REQ-002
    text: "函数调用图分析（直接调用）"
    status: validated
    confidence: 1.0
    acceptance_criteria:
      - "分析函数体内的直接函数调用（不递归）"
      - "每个函数有 dependencies 列表（它调用了谁）"
      - "每个函数有 called_by 列表（谁调用了它）"
      - "调用关系在 HTML 中展示为超链接"
    decomposition:
      features: [FEAT-004]

  - id: REQ-003
    text: "ECL Feature 与函数索引双向关联"
    status: validated
    confidence: 1.0
    acceptance_criteria:
      - "根据 ECL key_files 判断函数属于哪个 feature"
      - "ECL feature 展开后有超链接到对应函数"
      - "函数条目标注它属于哪个 feature"
      - "不属于任何 ECL feature 的函数标记 'not in any ECL'"
    decomposition:
      features: [FEAT-005]

  - id: REQ-004
    text: "孤立函数检测与标记"
    status: validated
    confidence: 1.0
    acceptance_criteria:
      - "不属于 ECL + 没被调用 + 没有 export + 不是入口文件 + 不是测试辅助 → 标记建议删除"
      - "标记建议删除的函数旁有 checkbox 让人确认是否应删除"
      - "不属于 ECL 但被其他函数依赖的函数只标记 'not in any ECL'，不标记删除"
    decomposition:
      features: [FEAT-005]

  - id: REQ-005
    text: "人工确认 Checkbox 机制"
    status: validated
    confidence: 1.0
    acceptance_criteria:
      - "所有验证条目旁有 checkbox"
      - "所有函数测试条目旁有 checkbox"
      - "建议删除的函数旁有 checkbox"
      - "页面顶部汇总 checkbox 进度"
      - "导出按钮 → 保存到 .devcompanion/confirmations/overview-confirmation.json"
      - "导入按钮 → 恢复已保存的 checkbox 状态"
      - "确认文件唯一（每次导出覆盖）"
    decomposition:
      features: [FEAT-006]

  - id: REQ-006
    text: "验证条目需解释判断方式"
    status: validated
    confidence: 1.0
    acceptance_criteria:
      - "每个验证条目展示：命令是什么、做了什么、判断方式（true/false、数值比较、存在性检查等）"
      - "展示实际执行结果"
      - "展示结论（通过/失败）"
    decomposition:
      features: [FEAT-001]

  - id: REQ-007
    text: "文件版本归档"
    status: validated
    confidence: 1.0
    acceptance_criteria:
      - "更新前旧版移动到 .devcompanion/reports/archive/ 带时间戳"
      - "保留最近 10 个版本"
      - "超出 10 个时询问用户是否删除，不自动删除"
    decomposition:
      features: [FEAT-007]

  - id: REQ-008
    text: "触发更新机制"
    status: validated
    confidence: 1.0
    acceptance_criteria:
      - "/ccplan 完成后自动增量更新"
      - "/ccdebug 修复后自动增量更新"
      - "/cconboard 执行时全量重建"
      - "/ccoverview 手动触发（支持 --verify-only 和 --full）"
      - "自动触发时直接执行不询问"
    decomposition:
      features: [FEAT-008]

  - id: REQ-009
    text: "Checkbox 状态跨更新保留"
    status: validated
    confidence: 1.0
    acceptance_criteria:
      - "重新生成 HTML 时读取已有 confirmation JSON"
      - "验证条目未变化（命令和结果相同）→ 保留打勾状态"
      - "验证条目变化了 → 重置该 checkbox"
    decomposition:
      features: [FEAT-006]

features:
  - id: FEAT-001
    name: "ECL Feature 渲染层"
    parent: REQ-001
    complexity: medium
    dependencies: []
    description: "读取 ECL yaml，执行验证，渲染 feature 卡片（含验证解释）"

  - id: FEAT-002
    name: "项目总览渲染层"
    parent: REQ-001
    complexity: small
    dependencies: [FEAT-001, FEAT-003]
    description: "汇总统计数据，渲染顶部概览面板"

  - id: FEAT-003
    name: "函数索引渲染层"
    parent: REQ-001
    complexity: medium
    dependencies: [FEAT-004, FEAT-005]
    description: "渲染全部函数的 What/How/Verify 卡片"

  - id: FEAT-004
    name: "函数调用图静态分析"
    parent: REQ-002
    complexity: large
    dependencies: []
    description: "分析 TypeScript/Python 函数体内的直接调用关系"

  - id: FEAT-005
    name: "ECL 归属映射与孤立检测"
    parent: REQ-003
    complexity: medium
    dependencies: [FEAT-004]
    description: "将函数映射到 ECL feature，检测孤立函数"

  - id: FEAT-006
    name: "Checkbox 交互与持久化"
    parent: REQ-005
    complexity: medium
    dependencies: []
    description: "页面内 checkbox 交互 + 导出/导入 JSON"

  - id: FEAT-007
    name: "文件版本归档系统"
    parent: REQ-007
    complexity: small
    dependencies: []
    description: "更新前归档旧版，管理历史版本数量"

  - id: FEAT-008
    name: "触发更新集成"
    parent: REQ-008
    complexity: medium
    dependencies: [FEAT-001, FEAT-002, FEAT-003, FEAT-007]
    description: "/ccoverview skill + 自动触发钩子"

decisions:
  - id: DEC-001
    phase: conversation
    decision: "函数调用图只分析直接调用，不递归"
    rationale: "间接调用链实现复杂且对 overview 价值有限"
    date: 2026-05-18

  - id: DEC-002
    phase: conversation
    decision: "Checkbox 状态导出为 JSON 文件，方案 B"
    rationale: "不依赖 localStorage，可跨设备使用"
    date: 2026-05-18

  - id: DEC-003
    phase: conversation
    decision: "归档保留最近 10 个版本，超出询问而非自动删除"
    rationale: "避免误删有价值的历史版本"
    date: 2026-05-18

  - id: DEC-004
    phase: conversation
    decision: "不属于 ECL 的函数标记 'not in any ECL'，孤立函数额外标记建议删除"
    rationale: "区分被依赖的函数和真正无用的函数"
    date: 2026-05-18

  - id: DEC-005
    phase: conversation
    decision: "自动触发时增量更新，不询问用户"
    rationale: "减少打断，保持工作流顺畅"
    date: 2026-05-18

  - id: DEC-006
    phase: conversation
    decision: "验证条目 checkbox 由人工确认有效性"
    rationale: "机器只能判断通过/失败，人类判断验证本身是否合理"
    date: 2026-05-18

dependency_graph:
  FEAT-001: []
  FEAT-002: [FEAT-001, FEAT-003]
  FEAT-003: [FEAT-004, FEAT-005]
  FEAT-004: []
  FEAT-005: [FEAT-004]
  FEAT-006: []
  FEAT-007: []
  FEAT-008: [FEAT-001, FEAT-002, FEAT-003, FEAT-007]

probes:
  - target: FEAT-004
    type: assumption
    question: "TypeScript AST (tree-sitter) 能否从函数体中提取调用表达式？"
    method: code-inspection
    result: "tree-sitter-typescript 有 call_expression 节点类型，包含 function 字段（被调用者）和 arguments 字段"
    verdict: feasible

  - target: FEAT-004
    type: spike
    question: "Python AST 能否同样提取函数体内的调用？"
    method: code-inspection
    result: "tree-sitter-python 有 call 节点类型，包含 function 字段"
    verdict: feasible

confrontation:
  red_team:
    - id: ATK-001
      scenario: "函数调用图分析可能非常慢（大项目数百个文件）"
      severity: medium
    - id: ATK-002
      scenario: "动态调用（回调、高阶函数）无法被静态分析捕获"
      severity: medium
    - id: ATK-003
      scenario: "增量更新时如何知道哪些函数受影响？"
      severity: high
    - id: ATK-004
      scenario: "checkbox 确认文件被意外删除后重新生成会丢失所有确认进度"
      severity: medium
  blue_team:
    - attack: ATK-001
      verdict: mitigated
      mitigation: "缓存调用图到 .devcompanion/cache/call-graph.json，只重新分析 git 变更的文件"
    - attack: ATK-002
      verdict: defended
      mitigation: "设计明确只追踪静态可分析的直接调用，文档说明局限性。动态调用不是本功能的目标"
    - attack: ATK-003
      verdict: mitigated
      mitigation: "增量更新策略：git diff 获取变更文件列表 → 只重新解析这些文件 → 更新受影响的调用关系 → 只重跑受影响 feature 的验证"
    - attack: ATK-004
      verdict: mitigated
      mitigation: "导出时同时归档 confirmation JSON 到 archive 目录，可从 archive 恢复"
